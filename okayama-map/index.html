<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0">
<title>岡山県観光マップ</title>
<meta name="description" content="SVGMap.js を使った岡山県観光マップ。観光スポットや気象情報をインタラクティブに表示します。">
<link rel="preload" href="/tutorials/tutorial1/img/mappin1.png" as="image">
<style>
  :root {
    color-scheme: light;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #f8fafc;
    color: #0f172a;
  }
  #mapcanvas { position: absolute; inset: 0; }
  #gui { position: absolute; inset: 0; pointer-events: none; }
  #gui img, #gui font, #gui span { pointer-events: auto; }
  #zoomupButton { left: 12px; top: 12px; position: absolute; }
  #zoomdownButton { left: 12px; top: 36px; position: absolute; }
  #gpsButton { left: 12px; top: 60px; position: absolute; }
  #mapTitle { right: 16px; top: 14px; position: absolute; color: #0f172a; font-weight: 600; }
  #mapCredit { right: 16px; bottom: 12px; position: absolute; color: #475569; font-size: 11px; }
  #centerSight { position: absolute; opacity: 0.5; width: 15px; height: 15px; left: calc(50% - 7.5px); top: calc(50% - 7.5px); }
  #posCmt { position: absolute; left: 12px; bottom: 32px; font-size: 12px; color: #1e293b; }
  #centerPos { position: absolute; left: 60px; bottom: 30px; font-size: 12px; color: #1e293b; }

  #controlPanel {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 280px;
    max-height: calc(100vh - 32px);
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    border: 1px solid #cbd5f5;
    box-shadow: 0 10px 30px rgba(15,23,42,0.18);
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(6px);
  }
  #controlPanel header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid #e2e8f0;
  }
  #controlPanel h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
  }
  #controlPanel p {
    margin: 4px 0 0;
    font-size: 12px;
    color: #475569;
  }
  #controlScroll {
    overflow-y: auto;
    padding: 12px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .groupTitle {
    font-size: 12px;
    letter-spacing: 0.04em;
    font-weight: 600;
    color: #1e293b;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .toggle-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .toggle-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.2s ease;
  }
  .toggle-item:hover {
    background: rgba(148,163,184,0.16);
  }
  .toggle-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #1d4ed8;
  }
  .toggle-item label {
    font-size: 13px;
    flex: 1;
    cursor: pointer;
  }
  #weatherControls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #weatherControls input[type="range"] {
    width: 100%;
    accent-color: #0369a1;
  }
  .stat-card {
    background: rgba(241,245,249,0.9);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #1e293b;
    display: grid;
    row-gap: 4px;
  }
  .stat-card span {
    display: flex;
    justify-content: space-between;
  }
  #layerSummary {
    font-weight: 600;
    color: #0f172a;
  }
  #networkNotice {
    font-size: 11px;
    color: #64748b;
    line-height: 1.5;
  }

  #infoCard {
    position: absolute;
    left: 16px;
    bottom: 110px;
    width: 280px;
    background: rgba(255,255,255,0.96);
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    box-shadow: 0 12px 24px rgba(15,23,42,0.22);
    padding: 14px 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(4px);
    pointer-events: auto;
  }
  #infoCard.visible { display: flex; }
  #infoCard header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #infoTitle {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  #infoClose {
    border: none;
    background: rgba(226,232,240,0.9);
    width: 24px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #1f2937;
    transition: background 0.2s ease;
  }
  #infoClose:hover { background: rgba(148,163,184,0.7); }
  #infoSummary {
    margin: 0;
    font-size: 13px;
    color: #475569;
    line-height: 1.4;
  }
  #infoLink {
    align-self: flex-start;
    padding: 6px 10px;
    background: #2563eb;
    color: #fff;
    border-radius: 6px;
    font-size: 12px;
    text-decoration: none;
    transition: background 0.2s ease;
  }
  #infoLink:hover { background: #1d4ed8; }
</style>
<script>
  window.svgMapOptions = window.svgMapOptions ?? {};
  window.svgMapOptions.enableEssentialUI = false;
</script>
</head>
<body>
  <div id="mapcanvas" data-src="Container.svg"></div>
  <div id="gui">
    <img id="zoomupButton" src="/tutorials/tutorial1/img/zoomup.png" onclick="svgMap.zoomup()" width="20" height="20" alt="Zoom In">
    <img id="zoomdownButton" src="/tutorials/tutorial1/img/zoomdown.png" onclick="svgMap.zoomdown()" width="20" height="20" alt="Zoom Out">
    <img id="gpsButton" src="/tutorials/tutorial1/img/gps.png" onclick="svgMap.gps()" width="20" height="20" alt="GPS">
    <font id="mapTitle">SVGMap.js : 岡山県観光マップ</font>
    <font id="mapCredit" size="-2">by SVGMap tech.</font>
    <img id="centerSight" src="/tutorials/tutorial1/img/Xcursor.png" width="15" height="15" alt="Center">
    <font id="posCmt" size="-2">Lat,Lng:</font>
    <span id="centerPos">lat , lng</span>
  </div>

  <aside id="controlPanel">
    <header>
      <h1>レイヤーと表示設定</h1>
      <p>国土地理院タイルと岡山の観光情報を自由に組み合わせましょう。</p>
    </header>
    <div id="controlScroll">
      <section>
        <div class="groupTitle">ベースマップ</div>
        <div class="toggle-list">
          <div class="toggle-item">
            <input type="checkbox" id="toggle-basemap" data-layer="basemap" checked>
            <label for="toggle-basemap">国土地理院 淡色地図</label>
          </div>
          <div class="toggle-item">
            <input type="checkbox" id="toggle-coastline" data-layer="coastline">
            <label for="toggle-coastline">日本海岸線（ガイド）</label>
          </div>
        </div>
      </section>

      <section>
        <div class="groupTitle">情報レイヤー</div>
        <div class="toggle-list">
          <div class="toggle-item">
            <input type="checkbox" id="toggle-spots" data-layer="spots" checked>
            <label for="toggle-spots">岡山観光スポット</label>
          </div>
          <div class="toggle-item">
            <input type="checkbox" id="toggle-weather" data-layer="weather" checked>
            <label for="toggle-weather">現在の気象</label>
          </div>
        </div>
      </section>

      <section id="weatherControls">
        <div class="groupTitle">気象レイヤーの透明度</div>
        <input type="range" id="weatherOpacity" min="0" max="1" step="0.05" value="1">
        <small>現在の透明度: <span id="weatherOpacityValue">100%</span></small>
      </section>

      <section class="stat-card">
        <span><span>表示中レイヤー</span><span id="layerSummary">---</span></span>
        <span><span>ベースマップ</span><span id="basemapStatus">オンライン</span></span>
        <span><span>スポット数</span><span id="spotCount">--</span></span>
      </section>

      <section id="networkNotice">
        ※ ベースマップは国土地理院のオンラインタイルを利用しています。<br>
        オフラインで動かす場合は、ローカルに用意したベースマップに差し替えてください。
      </section>
    </div>
  </aside>

  <div id="infoCard">
    <header>
      <h2 id="infoTitle">スポット名</h2>
      <button id="infoClose" type="button" title="閉じる">×</button>
    </header>
    <p id="infoSummary">スポットの説明がここに表示されます。</p>
    <a id="infoLink" href="#" target="_blank" rel="noopener">詳しく見る</a>
  </div>

  <script type="module">
    import { svgMap } from 'https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/SVGMapLv0.1_r18module.js';
    window.svgMap = svgMap;

    const SVG_NS = "http://www.w3.org/2000/svg";
    const XLINK_NS = "http://www.w3.org/1999/xlink";

    const weatherLabels = {
      clear: { label: "快晴", icon: "☀️" },
      partly: { label: "晴れ時々くもり", icon: "🌤️" },
      cloudy: { label: "くもり", icon: "☁️" },
      rain: { label: "雨", icon: "🌧️" },
      snow: { label: "雪", icon: "🌨️" },
      storm: { label: "雷雨", icon: "⛈️" },
      fog: { label: "霧", icon: "🌫️" },
      error: { label: "取得エラー", icon: "⚠️" },
    };

    const layerDefinitions = {
      basemap: { id: "layer-basemap", checkbox: "toggle-basemap", defaultVisible: true },
      coastline: { id: "layer-coastline", checkbox: "toggle-coastline", defaultVisible: false },
      spots: { id: "layer-spots", checkbox: "toggle-spots", defaultVisible: true },
      weather: { id: "layer-weather", checkbox: "toggle-weather", defaultVisible: true },
    };

    const suppressEssentialUI = () => {
      if (!window.EssentialUIs) return false;
      [
        "setLayerListSize",
        "refreshWindowSize",
        "#refreshWindowSize",
        "initLayerSpecificUI",
        "setLayerSpecificWebAppLaunchUiEnable",
      ].forEach((fn) => {
        window.EssentialUIs[fn] = () => {};
      });
      return true;
    };

    if (!suppressEssentialUI()) {
      const timer = setInterval(() => {
        if (suppressEssentialUI()) clearInterval(timer);
      }, 200);
    }

    const waitForSvgImage = () =>
      new Promise((resolve) => {
        const check = () => {
          if (window.svgMap && window.svgMap.svgImage) resolve(window.svgMap.svgImage);
          else requestAnimationFrame(check);
        };
        check();
      });

    const applyVisibility = (el, visible) => {
      if (!el) return;
      el.setAttribute("visibility", visible ? "visible" : "hidden");
      el.setAttribute("display", visible ? "inline" : "none");
      el.style.display = visible ? "inline" : "none";
    };

    const setLayerVisibility = (svgImage, layerId, visible) => {
      const base = svgImage.getElementById(layerId);
      applyVisibility(base, visible);
      if (layerId === layerDefinitions.weather.id) {
        const dynamic = svgImage.getElementById("live-weather-layer");
        applyVisibility(dynamic, visible);
        const slider = document.getElementById("weatherOpacity");
        if (slider) slider.disabled = !visible;
      }
    };

    const setLayerOpacity = (svgImage, layerId, opacity) => {
      const base = svgImage.getElementById(layerId);
      if (base) base.setAttribute("opacity", opacity);
      if (layerId === layerDefinitions.weather.id) {
        const dynamic = svgImage.getElementById("live-weather-layer");
        if (dynamic) dynamic.setAttribute("opacity", opacity);
      }
    };

    const collectLayerStats = (svgImage) => {
      const result = {};
      for (const [key, def] of Object.entries(layerDefinitions)) {
        const base = svgImage.getElementById(def.id);
        const dynamic = key === "weather" ? svgImage.getElementById("live-weather-layer") : null;
        const visible =
          (base && base.getAttribute("visibility") !== "hidden") ||
          (dynamic && dynamic.getAttribute("display") !== "none");
        const opacity = parseFloat(
          (dynamic && dynamic.getAttribute("opacity")) ??
          (base && base.getAttribute("opacity")) ??
          "1"
        );
        result[key] = { visible, opacity };
      }
      return result;
    };

    const updateSummary = (stats) => {
      const summaryEl = document.getElementById("layerSummary");
      const layers = [];
      if (stats.basemap?.visible) layers.push("ベース");
      if (stats.spots?.visible) layers.push("スポット");
      if (stats.weather?.visible) layers.push("気象");
      if (stats.coastline?.visible) layers.push("海岸線");
      summaryEl.textContent = layers.length ? layers.join(" / ") : "なし";
    };

    const updateSpotCount = async () => {
      try {
        const response = await fetch("/okayama-map/okayama-spots.svg", { cache: "no-cache" });
        if (!response.ok) throw new Error("fetch failed");
        const text = await response.text();
        const matches = text.match(/xlink:href="#/g);
        document.getElementById("spotCount").textContent = matches ? matches.length : 0;
      } catch {
        document.getElementById("spotCount").textContent = "--";
      }
    };

    const classifyWeather = (code) => {
      if (code === 0) return "clear";
      if ([1, 2].includes(code)) return "partly";
      if (code === 3) return "cloudy";
      if ([45, 48].includes(code)) return "fog";
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82, 56, 57, 66, 67].includes(code)) return "rain";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
      if ([95, 96, 99].includes(code)) return "storm";
      return "cloudy";
    };

    const parseCsv = (text) => {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];
      const headers = (lines[0].match(/(".*?"|[^,]+)(?=,|$)/g) || []).map((h) => h.replace(/^"|"$/g, "").trim());

      return lines.slice(1)
        .map((line) => {
          const columns = (line.match(/(".*?"|[^,]+)(?=,|$)/g) || []).map((c) => c.replace(/^"|"$/g, "").trim());
          const record = {};
          headers.forEach((key, idx) => { record[key] = columns[idx]; });
          return record;
        })
        .filter((entry) => entry?.name && entry?.lon && entry?.lat)
        .map((entry) => ({
          name: entry.name,
          lon: Number(entry.lon),
          lat: Number(entry.lat),
        }));
    };

    const fetchWeatherStations = async () => {
      const response = await fetch("/okayama-map/data/weather_points.csv", { cache: "no-cache" });
      if (!response.ok) throw new Error("weather_points.csv が読み込めません");
      return parseCsv(await response.text());
    };

    const fetchWeatherForStation = async (station) => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${station.lat}&longitude=${station.lon}&current_weather=true`;
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("weather fetch failed");
        const data = await response.json();
        return data.current_weather ?? null;
      } catch {
        return null;
      }
    };

    const normalizeWeatherEntry = (station, weather) => {
      if (!weather) {
        return {
          station,
          display: { label: weatherLabels.error.label, icon: weatherLabels.error.icon, temperature: "--°C" },
        };
      }
      const info = weatherLabels[classifyWeather(weather.weathercode ?? -1)] ?? weatherLabels.error;
      return {
        station,
        display: {
          label: info.label,
          icon: info.icon,
          temperature: weather.temperature != null ? `${weather.temperature.toFixed(1)}°C` : "--°C",
        },
      };
    };

    const createWeatherBubble = (svgImage, entry) => {
      const group = svgImage.createElementNS(SVG_NS, "g");
      group.setAttribute(
        "transform",
        `ref(svg,${(entry.station.lon * 100).toFixed(2)},${(-entry.station.lat * 100).toFixed(2)})`
      );
      group.setAttribute("class", "live-weather-entry");

      const background = svgImage.createElementNS(SVG_NS, "rect");
      background.setAttribute("x", "-18");
      background.setAttribute("y", "-30");
      background.setAttribute("width", "36");
      background.setAttribute("height", "28");
      background.setAttribute("rx", "6");
      background.setAttribute("fill", "rgba(255,255,255,0.92)");
      background.setAttribute("stroke", "#94a3b8");
      background.setAttribute("stroke-width", "0.6");
      group.appendChild(background);

      const iconText = svgImage.createElementNS(SVG_NS, "text");
      iconText.setAttribute("x", "0");
      iconText.setAttribute("y", "-18");
      iconText.setAttribute("font-size", "8");
      iconText.setAttribute("text-anchor", "middle");
      iconText.setAttribute("fill", "#0f172a");
      iconText.textContent = entry.display.icon;
      group.appendChild(iconText);

      const tempText = svgImage.createElementNS(SVG_NS, "text");
      tempText.setAttribute("x", "0");
      tempText.setAttribute("y", "-6");
      tempText.setAttribute("font-size", "6");
      tempText.setAttribute("text-anchor", "middle");
      tempText.setAttribute("fill", "#0f172a");
      tempText.textContent = entry.display.temperature ?? "--°C";
      group.appendChild(tempText);

      const labelText = svgImage.createElementNS(SVG_NS, "text");
      labelText.setAttribute("x", "0");
      labelText.setAttribute("y", "4");
      labelText.setAttribute("font-size", "4.5");
      labelText.setAttribute("text-anchor", "middle");
      labelText.setAttribute("fill", "#475569");
      labelText.textContent = entry.display.label;
      group.appendChild(labelText);

      const nameText = svgImage.createElementNS(SVG_NS, "text");
      nameText.setAttribute("x", "0");
      nameText.setAttribute("y", "12");
      nameText.setAttribute("font-size", "4.5");
      nameText.setAttribute("text-anchor", "middle");
      nameText.setAttribute("fill", "#64748b");
      nameText.textContent = entry.station.name;
      group.appendChild(nameText);

      return group;
    };

    const buildWeatherLayer = (svgImage, entries, visible) => {
      svgImage.getElementById("live-weather-layer")?.remove();
      const layer = svgImage.createElementNS(SVG_NS, "g");
      layer.setAttribute("id", "live-weather-layer");
      layer.setAttribute("class", "live-weather");
      applyVisibility(layer, visible);
      layer.setAttribute("opacity", "1");
      entries.forEach((entry) => layer.appendChild(createWeatherBubble(svgImage, entry)));
      svgImage.appendChild(layer);
    };

    const setupSpotInteraction = (svgImage) => {
      const infoCard = document.getElementById("infoCard");
      const infoTitle = document.getElementById("infoTitle");
      const infoSummary = document.getElementById("infoSummary");
      const infoLink = document.getElementById("infoLink");
      const closeButton = document.getElementById("infoClose");

      const layer = svgImage.getElementById("layer-spots");
      if (!layer) return;

      layer.querySelectorAll("a").forEach((anchor) => {
        anchor.addEventListener("click", (event) => {
          event.preventDefault();
          const use = anchor.querySelector("use");
          const content = use?.getAttribute("content") ?? "";
          const [name, ...summaryParts] = content.split(",");
          const summary = summaryParts.join(", ").trim();
          infoTitle.textContent = name?.trim() || "観光スポット";
          infoSummary.textContent = summary || "詳細情報はリンク先をご覧ください。";
          const href = anchor.getAttributeNS(XLINK_NS, "href") || anchor.getAttribute("href") || "#";
          infoLink.href = href;
          infoCard.classList.add("visible");
        });
      });

      closeButton.addEventListener("click", () => {
        infoCard.classList.remove("visible");
      });
    };

    const initializeControls = (svgImage) => {
      for (const [key, def] of Object.entries(layerDefinitions)) {
        const checkbox = document.getElementById(def.checkbox);
        if (!checkbox) continue;
        checkbox.checked = def.defaultVisible;
        setLayerVisibility(svgImage, def.id, def.defaultVisible);
        checkbox.addEventListener("change", () => {
          setLayerVisibility(svgImage, def.id, checkbox.checked);
          updateSummary(collectLayerStats(svgImage));
        });
      }

      const weatherOpacity = document.getElementById("weatherOpacity");
      const weatherOpacityValue = document.getElementById("weatherOpacityValue");
      weatherOpacity.addEventListener("input", (event) => {
        const value = parseFloat(event.target.value);
        weatherOpacityValue.textContent = `${Math.round(value * 100)}%`;
        setLayerOpacity(svgImage, layerDefinitions.weather.id, value);
      });
      weatherOpacity.disabled = !document.getElementById("toggle-weather").checked;
    };

    const refreshWeatherLayer = async (svgImage) => {
      try {
        const stations = await fetchWeatherStations();
        const results = await Promise.all(
          stations.map(async (station) => ({
            station,
            weather: await fetchWeatherForStation(station),
          }))
        );
        const normalized = results.map(({ station, weather }) => normalizeWeatherEntry(station, weather));
        const visible = document.getElementById("toggle-weather").checked;
        buildWeatherLayer(svgImage, normalized, visible);
        svgImage.getElementById("layer-weather")?.setAttribute("visibility", "hidden");
        document.getElementById("basemapStatus").textContent = "オンライン";
      } catch (error) {
        console.warn("[okayama-map] weather update failed:", error);
        const stations = await fetchWeatherStations();
        const fallback = stations.map((station) => normalizeWeatherEntry(station, null));
        buildWeatherLayer(svgImage, fallback, false);
        document.getElementById("basemapStatus").textContent = "気象取得エラー";
      }
    };

    (async () => {
      const svgImage = await waitForSvgImage();
      initializeControls(svgImage);
      setupSpotInteraction(svgImage);
      updateSpotCount();
      await refreshWeatherLayer(svgImage);
      updateSummary(collectLayerStats(svgImage));
    })();
  </script>
</body>
</html>

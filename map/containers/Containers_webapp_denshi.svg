<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="13321.68 -3540.28 124.52 115.43">
  <globalCoordinateSystem srsName="http://purl.org/crs/84" transform="matrix(100,0,0,-100,0,0)" />

  <!-- 電子国土ベースマップ付き検証用 container。
       注意: dynamicDenshiKokudo2016.svg は外部ネットワーク必須。
       localhost では Timeout → SVGMap の loadCompleted が false のまま固まる可能性あり。
       ネットワーク疎通確認済みの環境で使用すること。 -->

  <animation id="layer-basemap" x="-30000" y="-30000" width="60000" height="60000"
             xlink:href="/svgMapAppLayers/basemaps/dynamicDenshiKokudo2016.svg#map=pale"
             title="国土地理院 淡色地図" class="basemap switch" visibility="visible" opacity="1"/>

  <animation id="layer-base-area" x="13300" y="-3600" width="200" height="200"
             xlink:href="/map/layers/base_area_okayama_simple.svg"
             title="L1 行政界" class="vectorEtcData" visibility="visible" opacity="1"/>

  <animation id="layer-evacuation" x="13300" y="-3600" width="200" height="200"
             xlink:href="/map/webapp/layers/evacuation/evacuationLayer.svg#data=/map/data/evacuation/okayama.json&amp;layer=evacuation"
             title="L2 避難所" class="poi clickable" visibility="visible" opacity="1"/>

  <animation id="layer-team-activity" x="13300" y="-3600" width="200" height="200"
             xlink:href="/map/webapp/layers/team-activity/teamActivityLayer.svg#data=/map/data/team-activity/okayama.json&amp;layer=teamActivity"
             title="L3 チーム活動" class="vectorEtcData clickable" visibility="visible" opacity="1"/>
</svg>

<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SVGMap Native 防災マップ</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    color: #182226;
    background: #dfe8e8;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  button,
  select {
    font: inherit;
  }
  .app {
    display: grid;
    grid-template-rows: 70px minmax(0, 1fr);
    width: 100%;
    height: 100%;
  }
  .topbar {
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 18px;
    border-bottom: 1px solid rgba(44, 61, 66, 0.13);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 4px 18px rgba(31, 46, 50, 0.1);
    backdrop-filter: blur(14px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 224px;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #b84535;
    color: #ffffff;
    font-size: 18px;
    font-weight: 900;
  }
  .brand-text {
    min-width: 0;
  }
  .brand-text strong {
    display: block;
    font-size: 16px;
    line-height: 1.25;
  }
  .brand-text span {
    display: block;
    margin-top: 2px;
    color: #69777c;
    font-size: 14px;
    font-weight: 700;
  }
  .selectors {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .field {
    display: grid;
    gap: 3px;
  }
  .field label {
    color: #748186;
    font-size: 14px;
    font-weight: 700;
  }
  .field select {
    width: 178px;
    height: 38px;
    padding: 0 32px 0 11px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: #f0f4f4;
    color: #1d292d;
    font-size: 16px;
    font-weight: 700;
  }
  .field.municipality select {
    width: 224px;
  }
  .field select:hover,
  .field select:focus {
    border-color: #7da9a5;
    outline: none;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(23, 114, 105, 0.1);
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
  }
  .icon-button {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid #d1dadd;
    border-radius: 6px;
    background: #ffffff;
    color: #405157;
    cursor: pointer;
  }
  .icon-button:hover {
    border-color: #7da9a5;
    background: #f2f8f7;
  }
  .icon-button svg {
    width: 19px;
    height: 19px;
  }
  .icon-button.active {
    border-color: #177269;
    background: #e7f4f2;
    color: #105e57;
  }
  .workspace {
    position: relative;
    min-height: 0;
  }
  .map-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #dfe8e8;
  }
  .layer-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    width: 400px;
    overflow: hidden;
    border: 1px solid rgba(40, 56, 61, 0.16);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.98);
    box-shadow: 0 18px 42px rgba(31, 46, 50, 0.18);
    backdrop-filter: blur(12px);
    transform: translateX(calc(100% + 32px));
    transition: transform 0.18s ease-out;
  }
  .layer-panel.open {
    transform: translateX(0);
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 18px 15px;
    border-bottom: 0;
    background: #223136;
    color: #ffffff;
  }
  .panel-header p {
    margin: 0 0 2px;
    color: #8fc8c1;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.12em;
  }
  .panel-header h1 {
    margin: 0;
    font-size: 18px;
    line-height: 1.35;
    white-space: nowrap;
  }
  .panel-header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .panel-add {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: auto;
    height: 32px;
    padding: 0 9px;
    border: 1px solid #b9c8c8;
    border-radius: 6px;
    background: #ffffff;
    color: #176a63;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .panel-add:hover,
  .panel-add.active {
    border-color: #177269;
    background: #e7f4f2;
  }
  .panel-close {
    display: inline-grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #64748b;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }
  .panel-close:hover {
    color: #182226;
    background: #edf3f2;
  }
  .layer-count {
    min-width: 54px;
    padding: 4px 7px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: #dce9e8;
    font-size: 14px;
    font-weight: 700;
  }
  .layer-list {
    flex: 1;
    margin: 0;
    padding: 5px 18px 12px;
    overflow-y: auto;
    list-style: none;
  }
  .layer-import-form {
    display: grid;
    grid-template-columns: 104px minmax(0, 1fr);
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid #dfe7e7;
    background: #f7fafa;
  }
  .layer-import-form[hidden] {
    display: none;
  }
  .layer-import-form select,
  .layer-import-form input {
    min-width: 0;
    height: 38px;
    padding: 0 10px;
    border: 1px solid #cbd7d7;
    border-radius: 6px;
    background: #ffffff;
    color: #172033;
    font: inherit;
    font-size: 14px;
  }
  .layer-import-url,
  .layer-import-file,
  .layer-import-title,
  .layer-import-actions,
  .layer-import-status {
    grid-column: 1 / -1;
  }
  .layer-import-title[hidden],
  .layer-import-file[hidden] {
    display: none;
  }
  .layer-import-actions {
    display: flex;
    justify-content: flex-end;
  }
  .layer-import-submit {
    min-height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: 6px;
    background: #177269;
    color: #ffffff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .layer-import-submit:disabled {
    opacity: 0.55;
    cursor: wait;
  }
  .layer-import-status {
    min-height: 18px;
    margin: 0;
    color: #64748b;
    font-size: 13px;
  }
  .layer-presets {
    display: flex;
    gap: 8px;
    padding: 11px 18px 8px;
    border-bottom: 1px solid #dfe7e7;
    background: #ffffff;
  }
  .layer-preset-button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid #bfd4d2;
    border-radius: 6px;
    background: #eff8f7;
    color: #135f58;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .layer-preset-button:hover {
    border-color: #177269;
    background: #e1f2ef;
  }
  .layer-preset-button small {
    color: #55706d;
    font-size: 12px;
    font-weight: 700;
  }
  .layer-import-status.error {
    color: #b42318;
  }
  .layer-row {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) auto;
    align-items: center;
    gap: 11px;
    min-height: 60px;
    border-bottom: 1px solid #e6ecec;
    transition: background 0.14s;
  }
  .layer-row:hover {
    background: #f7fafa;
  }
  .layer-symbol {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 6px;
    background: #e8edef;
    color: #43565c;
    font-size: 14px;
    font-weight: 900;
  }
  .layer-row[data-kind="poi"] .layer-symbol {
    background: #e2f3ed;
    color: #146447;
  }
  .layer-row[data-kind="external"] .layer-symbol {
    background: #fff5e8;
    color: #8a5b25;
  }
  .layer-row[data-layer="layer-base-area"] .layer-symbol {
    background: #dff2f0;
    color: #126b64;
  }
  .layer-row[data-layer="layer-team-activity-pins"] .layer-symbol {
    background: #e6efff;
    color: #245db5;
  }
  .layer-row[data-layer="layer-team-activity"] .layer-symbol {
    background: #fff0d8;
    color: #9a5a0c;
  }
  .layer-row[data-layer="layer-hazard"] .layer-symbol {
    background: #fce8e4;
    color: #ad3f31;
  }
  .layer-row[data-layer="layer-river-level"] .layer-symbol {
    background: #e1f2ef;
    color: #176a63;
  }
  .layer-row[data-layer="layer-road-closure"] .layer-symbol {
    background: #fbe7e4;
    color: #9f3128;
  }
  .layer-copy {
    min-width: 0;
  }
  .layer-copy strong {
    display: block;
    overflow: hidden;
    font-size: 16px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .layer-copy small {
    display: block;
    margin-top: 2px;
    overflow: hidden;
    color: #77858a;
    font-size: 14px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .layer-controls {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .layer-remove {
    display: inline-grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #7b898e;
    font-size: 18px;
    cursor: pointer;
  }
  .layer-remove:hover {
    background: #fbe9e7;
    color: #a83b31;
  }
  .switch {
    position: relative;
    width: 42px;
    height: 24px;
  }
  .switch input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
  .switch span {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #cbd5e1;
    cursor: pointer;
    transition: background 0.16s;
  }
  .switch span::after {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.28);
    content: "";
    transition: transform 0.16s;
  }
  .switch input:checked + span {
    background: #177269;
  }
  .switch input:checked + span::after {
    transform: translateX(18px);
  }
  .switch input:focus-visible + span {
    outline: 3px solid rgba(23, 114, 105, 0.22);
    outline-offset: 2px;
  }
  .panel-footer {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid #e0e7e7;
    background: #f3f7f6;
    color: #5e7075;
    font-size: 14px;
  }
  .ready-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d97706;
  }
  .ready-dot.ready {
    background: #16a34a;
  }
  .map-controls {
    position: absolute;
    right: 16px;
    left: auto;
    bottom: 16px;
    z-index: 9;
    display: grid;
    gap: 7px;
    transition: right 0.18s ease-out, left 0.18s ease-out;
  }
  .map-controls .icon-button {
    width: 44px;
    height: 44px;
    border-color: rgba(116, 137, 142, 0.42);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 8px 22px rgba(31, 46, 50, 0.16);
  }
  .loading {
    display: grid;
    place-items: center;
    position: absolute;
    inset: 0;
    z-index: 30;
    background: rgba(235, 242, 241, 0.94);
    color: #315b57;
    font-size: 16px;
    font-weight: 700;
  }
  .loading[hidden] {
    display: none;
  }
  @media (max-width: 820px) {
    .app {
      grid-template-rows: auto minmax(0, 1fr);
    }
    .topbar {
      min-height: 58px;
      padding: 8px 10px;
      gap: 8px;
    }
    .brand {
      min-width: 0;
      margin-right: auto;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
    }
    .brand-text span {
      display: none;
    }
    .selectors {
      position: absolute;
      top: 66px;
      left: 10px;
      right: 58px;
      z-index: 12;
      padding: 8px;
      border: 1px solid #d5dde5;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }
    .field {
      flex: 1;
    }
    .field select,
    .field.municipality select {
      width: 100%;
      min-width: 0;
    }
    .top-actions .desktop-only {
      display: none;
    }
    .layer-panel {
      top: 8px;
      right: 8px;
      bottom: 8px;
      width: min(356px, calc(100vw - 16px));
      transform: translateX(calc(100% + 16px));
    }
    .map-controls {
      right: 10px;
      left: auto;
      bottom: 10px;
    }
  }

  /* Full-bleed native map shell */
  .app {
    position: relative;
    display: block;
  }
  .workspace {
    position: absolute;
    inset: 0;
  }
  .topbar {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: block;
    min-height: 0;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
    pointer-events: none;
    backdrop-filter: none;
  }
  .brand,
  .selectors,
  .top-actions {
    position: absolute;
    top: 16px;
    height: 52px;
    border: 1px solid rgba(40, 56, 61, 0.15);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 10px 28px rgba(31, 46, 50, 0.16);
    pointer-events: auto;
    backdrop-filter: blur(14px);
  }
  .brand {
    left: 16px;
    gap: 9px;
    min-width: 0;
    padding: 6px 13px 6px 7px;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
  }
  .brand-text strong {
    font-size: 16px;
    white-space: nowrap;
  }
  .brand-text span {
    display: none;
  }
  .selectors {
    left: 242px;
    display: flex;
    gap: 0;
    padding: 6px;
  }
  .field {
    position: relative;
    display: block;
  }
  .field + .field {
    border-left: 1px solid #dce3e3;
  }
  .field label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .field select,
  .field.municipality select {
    width: 170px;
    height: 38px;
    border: 0;
    background: transparent;
  }
  .field.municipality select {
    width: 210px;
  }
  .field select:hover,
  .field select:focus {
    border: 0;
    background: #f1f6f5;
    box-shadow: none;
  }
  .top-actions {
    right: 16px;
    display: flex;
    gap: 4px;
    padding: 6px;
  }
  .top-actions .icon-button {
    border-color: transparent;
  }
  .layer-panel {
    top: 82px;
    right: 16px;
    bottom: 16px;
    width: 400px;
    border-radius: 8px;
  }
  .panel-header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid #e2e8e8;
    background: #ffffff;
    color: #182226;
  }
  .panel-header p {
    color: #177269;
  }
  .panel-header h1 {
    font-size: 18px;
  }
  .layer-count {
    min-width: auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: #718085;
  }
  .layer-list {
    padding: 5px 18px 14px;
  }
  .layer-group-label {
    padding: 15px 0 5px;
    color: #7a888d;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.1em;
  }
  .layer-row {
    min-height: 58px;
  }
  .layer-symbol img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }
  .map-controls {
    right: 16px;
    left: auto;
    bottom: 16px;
    gap: 5px;
    padding: 5px;
    border: 1px solid rgba(40, 56, 61, 0.15);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 10px 28px rgba(31, 46, 50, 0.16);
    backdrop-filter: blur(12px);
  }
  body.panel-open .map-controls {
    right: calc(400px + 28px);
    left: auto;
  }
  .map-controls .icon-button {
    width: 38px;
    height: 38px;
    border-color: transparent;
    box-shadow: none;
  }
  @media (max-width: 820px) {
    .brand,
    .top-actions {
      top: 10px;
      height: 48px;
    }
    .brand {
      left: 10px;
      padding-right: 9px;
    }
    .brand-text strong {
      max-width: 132px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-actions {
      right: 10px;
      padding: 4px;
    }
    .selectors {
      top: 66px;
      left: 10px;
      right: 10px;
      height: 48px;
      padding: 5px;
    }
    .field select,
    .field.municipality select {
      width: 100%;
      height: 36px;
    }
    .layer-panel {
      top: 124px;
      right: 8px;
      bottom: 8px;
      width: min(360px, calc(100vw - 16px));
    }
    .map-controls {
      right: 10px;
      left: auto;
      bottom: 10px;
    }
    body.panel-open .map-controls {
      right: auto;
      left: 10px;
    }
  }

  .brand {
    width: 52px;
    padding: 6px;
  }
  .brand-text {
    display: none;
  }
  .search-box {
    position: absolute;
    top: 16px;
    left: 78px;
    z-index: 24;
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) 38px;
    align-items: center;
    width: min(410px, calc(100vw - 690px));
    min-width: 310px;
    height: 52px;
    border: 1px solid rgba(40, 56, 61, 0.15);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.98);
    box-shadow: 0 10px 28px rgba(31, 46, 50, 0.17);
    pointer-events: auto;
    backdrop-filter: blur(14px);
  }
  .search-icon {
    display: grid;
    place-items: center;
    color: #5f7075;
  }
  .search-icon svg {
    width: 20px;
    height: 20px;
  }
  .search-input {
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #182226;
    font: inherit;
    font-size: 16px;
  }
  .search-input::placeholder {
    color: #879398;
  }
  .search-clear {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #66777c;
    font-size: 22px;
    cursor: pointer;
  }
  .search-clear[hidden] {
    display: none;
  }
  .search-results {
    position: absolute;
    top: calc(100% + 7px);
    left: 0;
    width: 100%;
    max-height: min(480px, calc(100vh - 92px));
    overflow-y: auto;
    border: 1px solid rgba(40, 56, 61, 0.14);
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 18px 42px rgba(31, 46, 50, 0.2);
  }
  .search-results[hidden] {
    display: none;
  }
  .search-results ul {
    margin: 0;
    padding: 6px 0;
    list-style: none;
  }
  .search-result-button {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 58px;
    padding: 8px 13px;
    border: 0;
    background: #ffffff;
    color: #182226;
    text-align: left;
    cursor: pointer;
  }
  .search-result-button:hover,
  .search-result-button:focus-visible {
    outline: 0;
    background: #f0f6f5;
  }
  .search-result-icon {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #e7f2f0;
    color: #176c64;
    font-size: 14px;
    font-weight: 800;
  }
  .search-result-copy {
    min-width: 0;
  }
  .search-result-copy strong,
  .search-result-copy small {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-result-copy strong {
    font-size: 16px;
  }
  .search-result-copy small {
    margin-top: 2px;
    color: #6c7b80;
    font-size: 14px;
  }
  .search-empty {
    margin: 0;
    padding: 18px 14px;
    color: #6c7b80;
    font-size: 14px;
  }
  .selectors {
    left: 500px;
  }
  @media (max-width: 1180px) {
    .search-box {
      width: min(410px, calc(100vw - 160px));
    }
    .selectors {
      top: 76px;
      left: 16px;
    }
    .layer-panel {
      top: 82px;
    }
  }
  @media (max-width: 820px) {
    .brand {
      display: none;
    }
    .search-box {
      top: 10px;
      left: 10px;
      width: calc(100vw - 68px);
      min-width: 0;
      height: 48px;
    }
    .selectors {
      top: 66px;
      left: 10px;
      right: 10px;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">防</div>
      <div class="brand-text">
        <strong>SVGMap 防災マップ</strong>
        <span>災害情報・避難所</span>
      </div>
    </div>

    <div class="search-box" role="search">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </span>
      <input
        id="map-search"
        class="search-input"
        type="text"
        inputmode="search"
        enterkeyhint="search"
        autocomplete="off"
        placeholder="避難所・活動・カメラ・市区町村を検索"
        aria-label="地図を検索"
        aria-controls="search-results"
      >
      <button id="search-clear" class="search-clear" type="button" aria-label="検索を消去" title="消去" hidden>×</button>
      <div id="search-results" class="search-results" hidden>
        <ul id="search-result-list"></ul>
        <p id="search-empty" class="search-empty" hidden>一致する場所がありません</p>
      </div>
    </div>

    <div class="selectors">
      <div class="field">
        <label for="region-select">都道府県</label>
        <select id="region-select" aria-label="都道府県"></select>
      </div>
      <div class="field municipality">
        <label for="municipality-select">市区町村</label>
        <select id="municipality-select" aria-label="市区町村"></select>
      </div>
    </div>

    <div class="top-actions">
      <button id="location-button" class="icon-button desktop-only" type="button" title="現在地" aria-label="現在地">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
      </button>
      <button id="layer-button" class="icon-button" type="button" title="レイヤー" aria-label="レイヤーパネル">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 2 9 5-9 5-9-5 9-5Z"></path>
          <path d="m3 12 9 5 9-5M3 17l9 5 9-5"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="workspace">
    <iframe id="map-frame" class="map-frame" title="SVGMap"></iframe>

    <div class="map-controls" aria-label="地図操作">
      <button id="zoom-in" class="icon-button" type="button" title="拡大" aria-label="拡大">+</button>
      <button id="zoom-out" class="icon-button" type="button" title="縮小" aria-label="縮小">−</button>
      <button id="reset-view" class="icon-button" type="button" title="表示位置を戻す" aria-label="表示位置を戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <path d="M3 4v6h6"></path>
        </svg>
      </button>
    </div>

    <aside id="layer-panel" class="layer-panel">
      <header class="panel-header">
        <div>
          <p>CONTAINER LAYERS</p>
          <h1>表示レイヤー</h1>
        </div>
        <div class="panel-header-actions">
          <button id="layer-import-button" class="panel-add" type="button" aria-label="外部レイヤーを追加" title="外部レイヤーを追加">
            <span aria-hidden="true">＋</span>
            <span>追加</span>
          </button>
          <span id="layer-count" class="layer-count">0 / 0</span>
          <button id="panel-close" class="panel-close" type="button" aria-label="レイヤーパネルを閉じる" title="閉じる">×</button>
        </div>
      </header>
      <form id="layer-import-form" class="layer-import-form" hidden>
        <select id="layer-import-kind" aria-label="インポート形式">
          <option value="container">Container.svg</option>
          <option value="layer">SVG / HTML</option>
        </select>
        <input id="layer-import-url" class="layer-import-url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.jp/Container.svg">
        <input id="layer-import-file" class="layer-import-file" type="file" accept=".svg,.html,.htm,image/svg+xml,text/html" hidden>
        <input id="layer-import-title" class="layer-import-title" type="text" autocomplete="off" placeholder="レイヤー名" hidden>
        <div class="layer-import-actions">
          <button id="layer-import-submit" class="layer-import-submit" type="submit">追加</button>
        </div>
        <p id="layer-import-status" class="layer-import-status" role="status"></p>
      </form>
      <div id="layer-presets" class="layer-presets" aria-label="レイヤープリセット"></div>
      <ul id="layer-list" class="layer-list"></ul>
      <footer class="panel-footer">
        <span id="ready-dot" class="ready-dot" aria-hidden="true"></span>
        <span id="status-text">地域設定を読み込み中</span>
      </footer>
    </aside>

    <div id="loading" class="loading">地図を読み込み中...</div>
  </section>
</main>

<script type="module">
  import { MAP_MESSAGES } from './shared/mapMessages.js';
  import {
    importContainerText,
    importLocalLayerFile,
    importSingleLayer,
    loadImportedLayers,
    saveImportedLayers,
  } from './shared/nativeLayerImporter.js';

  const elements = {
    frame: document.getElementById('map-frame'),
    region: document.getElementById('region-select'),
    municipality: document.getElementById('municipality-select'),
    layerPanel: document.getElementById('layer-panel'),
    layerButton: document.getElementById('layer-button'),
    panelClose: document.getElementById('panel-close'),
    importButton: document.getElementById('layer-import-button'),
    importForm: document.getElementById('layer-import-form'),
    importKind: document.getElementById('layer-import-kind'),
    importUrl: document.getElementById('layer-import-url'),
    importFile: document.getElementById('layer-import-file'),
    importTitle: document.getElementById('layer-import-title'),
    importSubmit: document.getElementById('layer-import-submit'),
    importStatus: document.getElementById('layer-import-status'),
    layerPresets: document.getElementById('layer-presets'),
    layerList: document.getElementById('layer-list'),
    layerCount: document.getElementById('layer-count'),
    readyDot: document.getElementById('ready-dot'),
    status: document.getElementById('status-text'),
    loading: document.getElementById('loading'),
    search: document.getElementById('map-search'),
    searchClear: document.getElementById('search-clear'),
    searchResults: document.getElementById('search-results'),
    searchResultList: document.getElementById('search-result-list'),
    searchEmpty: document.getElementById('search-empty'),
  };

  const params = new URLSearchParams(location.search);
  const state = {
    regions: [],
    municipalities: [],
    regionId: params.get('regionId') || '',
    municipalityId: params.get('municipalityId') || '',
    municipality: null,
    runtimeConfig: null,
    layers: [],
    presets: [],
    searchLayers: [],
    importedLayers: loadImportedLayers(),
    searchRecords: [],
    runtimeReady: false,
  };

  const fetchJson = async (url) => {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${response.status} ${url}`);
    return response.json();
  };

  const postToMap = (message) => {
    elements.frame.contentWindow?.postMessage(message, location.origin);
  };

  const setLayerPanelOpen = (open) => {
    elements.layerPanel.classList.toggle('open', open);
    elements.layerButton.classList.toggle('active', open);
    elements.layerButton.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('panel-open', open);
  };

  const setImportFormOpen = (open) => {
    elements.importForm.hidden = !open;
    elements.importButton.classList.toggle('active', open);
    if (open) {
      setLayerPanelOpen(true);
      elements.importUrl.focus();
    }
  };

  const setStatus = (message, ready = false) => {
    elements.status.textContent = message;
    elements.readyDot.classList.toggle('ready', ready);
  };

  const updateUrl = () => {
    const next = new URL(location.href);
    next.searchParams.set('regionId', state.regionId);
    if (state.municipalityId) next.searchParams.set('municipalityId', state.municipalityId);
    else next.searchParams.delete('municipalityId');
    history.replaceState(null, '', next);
  };

  const viewportForMunicipality = () =>
    state.municipality?.viewport || state.runtimeConfig?.initialViewport || null;

  const collectQtctRecords = (node, records = []) => {
    if (!node) return records;
    if (Array.isArray(node.records)) records.push(...node.records);
    for (const child of node.children || []) collectQtctRecords(child, records);
    return records;
  };

  const searchRecordFromQtct = (record, layer, search) => ({
    type: 'feature',
    layerId: search.layerId || layer.id,
    targetLayerId: layer.id,
    layerLabel: layer.title || layer.label || layer.id,
    layerGroup: layer.group || '',
    symbol: layer.symbol || '',
    id: record.id,
    title: record.title || record.name || record.id,
    subtitle: record.address || record.summary || record.operator || record.properties?.location || record.properties?.river || layer.title || '',
    searchText: [
      record.title,
      record.name,
      record.address,
      record.summary,
      record.description,
      record.area,
      record.operator,
      record.river,
      record.location,
      record.provider,
      record.properties?.location,
      record.properties?.river,
      record.properties?.roadName,
      record.properties?.section,
      layer.title,
    ].filter(Boolean).join(' '),
    lat: Number(record.lat),
    lon: Number(record.lon),
  });

  const normalizeSearchRecord = (record, layer, search) => ({
    type: record.type || 'feature',
    layerId: record.layerId || search.layerId || layer.id,
    targetLayerId: record.targetLayerId || layer.id,
    layerLabel: record.layerLabel || layer.title || layer.label || layer.id,
    layerGroup: record.layerGroup || layer.group || '',
    symbol: record.symbol || layer.symbol || '',
    id: record.id,
    title: record.title || record.name || record.id,
    subtitle: record.subtitle || record.address || record.summary || record.operator || record.properties?.location || record.properties?.river || layer.title || '',
    searchText: record.searchText || [
      record.title,
      record.name,
      record.subtitle,
      record.address,
      record.summary,
      record.description,
      record.area,
      record.operator,
      layer.title,
    ].filter(Boolean).join(' '),
    lat: Number(record.lat),
    lon: Number(record.lon),
  });

  const loadSearchIndex = async () => {
    state.searchRecords = [];
    const searchResults = state.searchLayers.map(async (layer) => {
      const search = layer.search || {};
      const url = String(search.url || '').replaceAll('{regionId}', encodeURIComponent(state.regionId));
      if (!url) return [];
      const data = await fetchJson(url);
      const records = Array.isArray(data.records)
        ? data.records.map((record) => normalizeSearchRecord(record, layer, search))
        : collectQtctRecords(data.tree).map((record) => searchRecordFromQtct(record, layer, search));
      return records.filter((record) => Number.isFinite(record.lat) && Number.isFinite(record.lon));
    });
    const results = await Promise.allSettled(searchResults);
    state.searchRecords = results.flatMap((result) => result.status === 'fulfilled' ? result.value : []);
  };

  const normalizeSearchText = (value) =>
    String(value || '').normalize('NFKC').toLocaleLowerCase('ja-JP').replace(/\s+/g, '');

  const searchCandidates = (query) => {
    const normalized = normalizeSearchText(query);
    if (!normalized) return [];
    const candidates = [
      ...state.regions.map((region) => ({
        type: 'region',
        id: region.id,
        title: region.label || region.prefecture || region.id,
        subtitle: '都道府県',
        searchText: `${region.label || ''} ${region.prefecture || ''}`,
      })),
      ...state.municipalities.map((municipality) => ({
        type: 'municipality',
        id: municipality.id,
        title: municipality.label,
        subtitle: `市区町村・避難所${municipality.shelterCount || 0}件`,
        searchText: `${municipality.label || ''} ${municipality.displayCode || ''}`,
        municipality,
      })),
      ...state.searchRecords,
    ];
    return candidates
      .map((candidate) => {
        const title = normalizeSearchText(candidate.title);
        const text = normalizeSearchText(candidate.searchText);
        const score = title === normalized ? 0 : title.startsWith(normalized) ? 1 : title.includes(normalized) ? 2 : text.includes(normalized) ? 3 : 99;
        return { ...candidate, score };
      })
      .filter((candidate) => candidate.score < 99)
      .sort((a, b) => a.score - b.score || a.title.localeCompare(b.title, 'ja'))
      .slice(0, 10);
  };

  const closeSearchResults = () => {
    elements.searchResults.hidden = true;
  };

  const resultSymbol = (result) => {
    if (result.type === 'region') return '県';
    if (result.type === 'municipality') return '市';
    if (result.symbol) return result.symbol;
    return '地';
  };

  const focusSearchResult = async (result) => {
    elements.search.value = result.title;
    elements.searchClear.hidden = false;
    closeSearchResults();
    if (result.type === 'region') {
      state.regionId = result.id;
      state.municipalityId = '';
      elements.region.value = result.id;
      await loadMunicipalities();
      await loadMap();
      return;
    }
    if (result.type === 'municipality') {
      state.municipalityId = result.id;
      state.municipality = result.municipality;
      elements.municipality.value = result.id;
      await loadMap();
      return;
    }
    if (!Number.isFinite(result.lat) || !Number.isFinite(result.lon)) return;
    const layerIds = [result.targetLayerId].filter(Boolean);
    for (const id of layerIds) {
      const layer = state.layers.find((entry) => entry.id === id);
      if (layer) layer.visible = true;
      toggleLayer(id, true);
    }
    renderLayers();
    postToMap({
      type: MAP_MESSAGES.mapSetViewport,
      viewport: {
        lat: result.lat,
        lon: result.lon,
        latSpan: 0.025,
        lonSpan: 0.025,
      },
    });
    setStatus(`${result.title}を表示中`, true);
  };

  const renderSearchResults = () => {
    const results = searchCandidates(elements.search.value);
    elements.searchResultList.replaceChildren();
    elements.searchEmpty.hidden = results.length > 0;
    for (const result of results) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'search-result-button';
      const icon = document.createElement('span');
      icon.className = 'search-result-icon';
      icon.textContent = resultSymbol(result);
      const copy = document.createElement('span');
      copy.className = 'search-result-copy';
      const title = document.createElement('strong');
      title.textContent = result.title;
      const subtitle = document.createElement('small');
      subtitle.textContent = result.subtitle || result.layerLabel || '';
      copy.append(title, subtitle);
      button.append(icon, copy);
      button.addEventListener('click', () => void focusSearchResult(result));
      item.append(button);
      elements.searchResultList.append(item);
    }
    elements.searchResults.hidden = !elements.search.value.trim();
  };

  const applyViewport = () => {
    const viewport = viewportForMunicipality();
    if (!viewport) return;
    postToMap({ type: MAP_MESSAGES.mapSetViewport, viewport });
  };

  const layerKind = (layer) => {
    if (layer.kind) return layer.kind;
    if (layer.imported) return 'external';
    if (layer.id.includes('external')) return 'external';
    if (layer.className.includes('poi')) return 'poi';
    return 'vector';
  };

  const layerSymbol = (layer) => {
    if (layer.symbol) return layer.symbol;
    if (layer.id.includes('evacuation')) return '避';
    if (layer.id.includes('team-activity')) return '活';
    if (layer.id.includes('river-level')) return '水';
    if (layer.id.includes('road-closure')) return '道';
    if (layer.id.includes('hazard')) return '災';
    if (layer.id.includes('webcam')) return 'カ';
    if (layer.id.includes('basemap')) return '地';
    if (layer.id.includes('area')) return '界';
    if (layer.id.includes('external')) return '外';
    return '層';
  };

  const layerGroup = (layer) => {
    if (layer.group) return layer.group;
    if (layer.imported) return 'インポート';
    if (layer.id.includes('external')) return '外部データ';
    if (layer.id.includes('basemap') || layer.id.includes('base-area')) return '基本地図';
    if (layer.id.includes('river-level') || layer.id.includes('webcam')) return '河川確認';
    return '防災情報';
  };

  const layerIcon = (layer) => {
    if (layer.icon) return layer.icon;
    if (layer.id === 'layer-evacuation') return '/map/icons/shelter-open.svg';
    if (layer.id === 'layer-team-activity-pins') return '/map/icons/team-active.svg';
    return '';
  };

  const updateLayerCount = () => {
    const visible = state.layers.filter((layer) => layer.visible).length;
    elements.layerCount.textContent = `${visible} / ${state.layers.length}`;
  };

  const toggleLayer = (id, visible) => {
    const layer = state.layers.find((entry) => entry.id === id);
    if (layer) {
      layer.visible = visible;
      if (layer.attrs) layer.attrs.visibility = visible ? 'visible' : 'hidden';
    }
    if (layer?.imported && !layer.transient) saveImportedLayers(state.layers);
    postToMap({
      type: MAP_MESSAGES.mapSetLayerVisible,
      layerKey: layer?.toggleKey || id,
      visible,
    });
    updateLayerCount();
  };

  const removeImportedLayer = (id) => {
    const removing = state.importedLayers.find((layer) => layer.id === id);
    const href = removing?.attrs?.['xlink:href'] || '';
    if (removing?.transient && href.startsWith('blob:')) URL.revokeObjectURL(href);
    state.importedLayers = state.importedLayers.filter((layer) => layer.id !== id);
    state.layers = state.layers.filter((layer) => layer.id !== id);
    saveImportedLayers(state.importedLayers);
    postToMap({ type: MAP_MESSAGES.mapRemoveLayer, layerId: id });
    renderLayers();
  };

  const applyLayerPreset = (preset) => {
    const targetIds = Array.isArray(preset?.layers) ? preset.layers : [];
    let changed = 0;
    for (const id of targetIds) {
      const layer = state.layers.find((entry) => entry.id === id);
      if (!layer) continue;
      if (!layer.visible) changed += 1;
      toggleLayer(id, true);
    }
    renderLayers();
    setLayerPanelOpen(true);
    setStatus(changed > 0 ? preset.message : preset.alreadyMessage, true);
  };

  const renderPresets = () => {
    elements.layerPresets.replaceChildren();
    const availableLayerIds = new Set(state.layers.map((layer) => layer.id));
    const presets = state.presets.filter((preset) => (
      Array.isArray(preset.layers) && preset.layers.some((id) => availableLayerIds.has(id))
    ));
    elements.layerPresets.hidden = presets.length === 0;
    for (const preset of presets) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'layer-preset-button';
      const label = document.createElement('span');
      label.textContent = preset.label;
      const description = document.createElement('small');
      description.textContent = preset.description || '';
      button.append(label, description);
      button.addEventListener('click', () => applyLayerPreset(preset));
      elements.layerPresets.append(button);
    }
  };

  const renderLayers = () => {
    elements.layerList.replaceChildren();
    let previousGroup = '';
    for (const layer of state.layers) {
      const group = layerGroup(layer);
      if (group !== previousGroup) {
        const heading = document.createElement('li');
        heading.className = 'layer-group-label';
        heading.textContent = group;
        elements.layerList.append(heading);
        previousGroup = group;
      }
      const row = document.createElement('li');
      row.className = 'layer-row';
      row.dataset.kind = layerKind(layer);
      row.dataset.layer = layer.id;

      const symbol = document.createElement('span');
      symbol.className = 'layer-symbol';
      const icon = layerIcon(layer);
      if (icon) {
        const image = document.createElement('img');
        image.src = icon;
        image.alt = '';
        symbol.append(image);
      } else {
        symbol.textContent = layerSymbol(layer);
      }
      symbol.setAttribute('aria-hidden', 'true');

      const copy = document.createElement('span');
      copy.className = 'layer-copy';
      const title = document.createElement('strong');
      title.textContent = layer.title.replace(/^L\d+\s*/, '');
      const meta = document.createElement('small');
      meta.textContent = layerKind(layer) === 'external'
        ? layer.imported ? 'インポート' : '外部データ'
        : layerKind(layer) === 'poi'
          ? '地点情報'
          : '地図表示';
      copy.append(title, meta);

      const label = document.createElement('label');
      label.className = 'switch';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = layer.visible;
      input.setAttribute('aria-label', `${layer.title}を表示`);
      input.addEventListener('change', () => toggleLayer(layer.id, input.checked));
      const track = document.createElement('span');
      label.append(input, track);

      const controls = document.createElement('span');
      controls.className = 'layer-controls';
      controls.append(label);
      if (layer.imported) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'layer-remove';
        remove.textContent = '×';
        remove.title = `${layer.title}を削除`;
        remove.setAttribute('aria-label', `${layer.title}を削除`);
        remove.addEventListener('click', () => removeImportedLayer(layer.id));
        controls.append(remove);
      }

      row.append(symbol, copy, controls);
      elements.layerList.append(row);
    }
    updateLayerCount();
  };

  const loadLayers = async (containerUrl) => {
    const [response, catalogResult] = await Promise.all([
      fetch(containerUrl),
      fetch('/map/layers/catalog.json').then((catalogResponse) => (
        catalogResponse.ok ? catalogResponse.json() : null
      )).catch(() => null),
    ]);
    if (!response.ok) throw new Error(`${response.status} ${containerUrl}`);
    const text = await response.text();
    const documentXml = new DOMParser().parseFromString(text, 'image/svg+xml');
    const containerLayers = Array.from(documentXml.querySelectorAll('animation')).map((animation, index) => ({
      id: animation.getAttribute('id') || `layer-${index + 1}`,
      title: animation.getAttribute('title') || animation.getAttribute('id') || `レイヤー ${index + 1}`,
      className: animation.getAttribute('class') || '',
      visible: animation.getAttribute('visibility') !== 'hidden',
    }));
    const containerById = new Map(containerLayers.map((layer) => [layer.id, layer]));
    const catalogLayers = Array.isArray(catalogResult?.layers)
      ? catalogResult.layers
        .filter((layer) => containerById.has(layer.id))
        .map((layer) => {
          const mounted = containerById.get(layer.id);
          return {
            ...mounted,
            ...layer,
            id: layer.id,
            title: layer.label || mounted.title,
            className: mounted.className,
            visible: mounted.visible,
            mounts: Array.isArray(layer.mounts) && layer.mounts.length > 0 ? layer.mounts : [layer.id],
            toggleKey: layer.toggleKey || layer.id,
          };
        })
      : containerLayers.filter((layer) => !/detail|base-area/.test(layer.id));
    state.presets = Array.isArray(catalogResult?.presets) ? catalogResult.presets : [];
    state.layers = [...catalogLayers, ...state.importedLayers];
    state.searchLayers = catalogLayers.filter((layer) => layer.search?.kind === 'qtct');
    renderPresets();
    renderLayers();
  };

  const setImportStatus = (message, error = false) => {
    elements.importStatus.textContent = message;
    elements.importStatus.classList.toggle('error', error);
  };

  const addImportedLayers = (layers) => {
    const knownHrefs = new Set(state.importedLayers.map((layer) => layer.attrs?.['xlink:href']));
    const additions = layers.filter((layer) => !knownHrefs.has(layer.attrs?.['xlink:href']));
    if (additions.length === 0) throw new Error('同じレイヤーは追加済みです');
    state.importedLayers.push(...additions);
    state.layers.push(...additions);
    saveImportedLayers(state.importedLayers);
    renderLayers();
    if (state.runtimeReady) {
      postToMap({ type: MAP_MESSAGES.mapImportLayers, layers: additions });
    }
    return additions;
  };

  const importExternalLayers = async () => {
    const kind = elements.importKind.value;
    const rawUrl = elements.importUrl.value.trim();
    const localFile = elements.importFile.files?.[0] || null;
    if (kind === 'layer') {
      if (localFile) {
        return addImportedLayers([
          importLocalLayerFile(localFile, elements.importTitle.value),
        ]);
      }
      if (!rawUrl) throw new Error('URLまたはSVG/HTMLファイルを指定してください');
      return addImportedLayers([
        importSingleLayer({ url: rawUrl, title: elements.importTitle.value }),
      ]);
    }
    if (!rawUrl) throw new Error('URLを入力してください');
    const sourceUrl = new URL(rawUrl, location.href).href;
    const response = await fetch(sourceUrl, { mode: 'cors' });
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const layers = importContainerText(await response.text(), response.url || sourceUrl);
    if (layers.length > 200) throw new Error('一度に追加できるレイヤーは200件までです');
    return addImportedLayers(layers);
  };

  const municipalityCodes = () =>
    (state.municipality?.municipalityCodes || []).join(',');

  const loadMap = async () => {
    state.runtimeReady = false;
    elements.loading.hidden = false;
    setStatus('地図を読み込み中');
    const runtimeUrl = `/map/regions/${encodeURIComponent(state.regionId)}/runtime-config.json`;
    state.runtimeConfig = await fetchJson(runtimeUrl);
    await loadLayers(state.runtimeConfig.containerUrl);

    const mapParams = new URLSearchParams({
      embed: '1',
      regionId: state.regionId,
      runtimeConfigUrl: runtimeUrl,
      v: 'native-static-26',
    });
    const codes = municipalityCodes();
    if (codes) mapParams.set('municipalityCodes', codes);
    elements.frame.src = `/map/webapp/current-map.html?${mapParams}`;
    updateUrl();
    void loadSearchIndex();
  };

  const renderRegions = () => {
    elements.region.replaceChildren();
    for (const region of state.regions) {
      const option = document.createElement('option');
      option.value = region.id;
      option.textContent = region.label || region.prefecture || region.id;
      option.selected = region.id === state.regionId;
      elements.region.append(option);
    }
  };

  const renderMunicipalities = () => {
    elements.municipality.replaceChildren();
    for (const municipality of state.municipalities) {
      const option = document.createElement('option');
      option.value = municipality.id;
      option.textContent = municipality.label;
      option.disabled = municipality.dataStatus === 'empty';
      option.selected = municipality.id === state.municipalityId;
      elements.municipality.append(option);
    }
  };

  const loadMunicipalities = async () => {
    const index = await fetchJson(`/map/regions/${encodeURIComponent(state.regionId)}/municipalities.json`);
    state.municipalities = index.municipalities || [];
    const selected = state.municipalities.find((entry) => entry.id === state.municipalityId)
      || state.municipalities.find((entry) => entry.dataStatus !== 'empty')
      || state.municipalities[0]
      || null;
    state.municipality = selected;
    state.municipalityId = selected?.id || '';
    renderMunicipalities();
  };

  const changeRegion = async () => {
    state.regionId = elements.region.value;
    state.municipalityId = '';
    await loadMunicipalities();
    await loadMap();
  };

  const changeMunicipality = async () => {
    state.municipalityId = elements.municipality.value;
    state.municipality = state.municipalities.find((entry) => entry.id === state.municipalityId) || null;
    await loadMap();
  };

  elements.region.addEventListener('change', () => void changeRegion());
  elements.municipality.addEventListener('change', () => void changeMunicipality());
  elements.search.addEventListener('input', () => {
    elements.searchClear.hidden = !elements.search.value;
    renderSearchResults();
  });
  elements.search.addEventListener('focus', renderSearchResults);
  elements.search.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeSearchResults();
      elements.search.blur();
    }
    if (event.key === 'Enter') {
      const first = elements.searchResultList.querySelector('button');
      first?.click();
    }
  });
  elements.searchClear.addEventListener('click', () => {
    elements.search.value = '';
    elements.searchClear.hidden = true;
    closeSearchResults();
    elements.search.focus();
  });
  document.addEventListener('pointerdown', (event) => {
    if (!event.target.closest('.search-box')) closeSearchResults();
  });
  elements.layerButton.addEventListener('click', () => {
    setLayerPanelOpen(!elements.layerPanel.classList.contains('open'));
  });
  elements.panelClose.addEventListener('click', () => setLayerPanelOpen(false));
  elements.importButton.addEventListener('click', () => {
    setImportFormOpen(elements.importForm.hidden);
  });
  elements.importKind.addEventListener('change', () => {
    const singleLayer = elements.importKind.value === 'layer';
    elements.importTitle.hidden = !singleLayer;
    elements.importFile.hidden = !singleLayer;
    if (!singleLayer) elements.importFile.value = '';
    elements.importUrl.placeholder = singleLayer
      ? 'https://example.jp/layer.svg または下でファイル選択'
      : 'https://example.jp/Container.svg';
    setImportStatus('');
  });
  elements.importForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    elements.importSubmit.disabled = true;
    setImportStatus('確認中...');
    try {
      const additions = await importExternalLayers();
      setImportStatus(`${additions.length}件を追加しました`);
      elements.importUrl.value = '';
      elements.importFile.value = '';
      elements.importTitle.value = '';
    } catch (error) {
      console.error('[native-map] layer import failed', error);
      const cors = error instanceof TypeError ? '取得できません。URLまたはCORS設定を確認してください' : error.message;
      setImportStatus(cors, true);
    } finally {
      elements.importSubmit.disabled = false;
    }
  });
  document.getElementById('zoom-in').addEventListener('click', () => {
    postToMap({ type: MAP_MESSAGES.mapZoom, factor: 0.8 });
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    postToMap({ type: MAP_MESSAGES.mapZoom, factor: 1.25 });
  });
  document.getElementById('reset-view').addEventListener('click', applyViewport);
  document.getElementById('location-button').addEventListener('click', () => {
    if (!navigator.geolocation) {
      setStatus('現在地を取得できません');
      return;
    }
    setStatus('現在地を取得中');
    navigator.geolocation.getCurrentPosition(
      ({ coords }) => {
        postToMap({
          type: MAP_MESSAGES.mapFocusLocation,
          location: {
            lat: coords.latitude,
            lon: coords.longitude,
            latSpan: 0.03,
            lonSpan: 0.03,
          },
        });
        setStatus('現在地を表示中', true);
      },
      () => setStatus('現在地を取得できません', state.runtimeReady),
      { enableHighAccuracy: true, timeout: 10000 },
    );
  });

  window.addEventListener('message', (event) => {
    if (event.origin !== location.origin || event.source !== elements.frame.contentWindow) return;
    if (event.data?.type !== MAP_MESSAGES.runtimeReady) return;
    state.runtimeReady = true;
    elements.loading.hidden = true;
    setStatus(`${state.municipality?.label || state.runtimeConfig?.label || state.regionId}を表示中`, true);
    applyViewport();
    if (state.importedLayers.length > 0) {
      postToMap({ type: MAP_MESSAGES.mapImportLayers, layers: state.importedLayers });
    }
    for (const layer of state.layers) {
      toggleLayer(layer.id, layer.visible);
    }
  });

  const start = async () => {
    try {
      const regionIndex = await fetchJson('/map/regions/index.json');
      state.regions = regionIndex.regions || [];
      state.regionId = state.regions.some((entry) => entry.id === state.regionId)
        ? state.regionId
        : regionIndex.defaultRegionId || state.regions[0]?.id || 'okayama';
      renderRegions();
      await loadMunicipalities();
      await loadMap();
    } catch (error) {
      console.error('[native-map] startup failed', error);
      elements.loading.textContent = '地図を読み込めませんでした';
      setStatus('静的データの読み込みに失敗しました');
    }
  };

  if (innerWidth > 820) {
    setLayerPanelOpen(true);
  }
  void start();
</script>
</body>
</html>

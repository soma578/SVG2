<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0">
<title>SVGMap Native 防災マップ</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #dbeafe;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #mapcanvas {
    position: absolute;
    inset: 0;
  }
  #controller, #layerlist, #layerList, #initLayerSpecificUI,
  #centerSight, #ticker, .layerUI, .essentialUI {
    display: none !important;
    visibility: hidden !important;
  }
  #layerSpecificUI {
    display: none;
  }
</style>
<script>
  window.svgMapOptions = {
    enableEssentialUI: false,
    enableGIS: false,
    enableAuthoringTool: false,
    enableCustomLayersManager: false,
    enableLayerUI: false
  };
</script>
</head>
<body>
  <img id="centerSight" alt="" width="1" height="1"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
       style="position:absolute;left:0;top:0;opacity:0;pointer-events:none;">
  <div id="mapcanvas" data-src="/map/containers/Containers_webapp_denshi_33.svg"></div>
  <div id="controller"></div>
  <div id="layerlist"></div>
  <div id="layerList"></div>
  <div id="layerSpecificUI"></div>
  <div id="initLayerSpecificUI"></div>

  <script type="module">
    import { MAP_MESSAGES } from './shared/mapMessages.js';
    import { fetchWithRuntimeCache } from './shared/runtimeCache.js';

    console.log('[current-map] VERSION native-v18');

    let svgMap;

    window.addEventListener('error', (event) => {
      const message = String(event.message || '');
      const source = String(event.filename || '');
      if (message.includes('domElement is not defined') && source.includes('ShowPoiProperty.js')) {
        // Suppress known SVGMap popup bug noise.
        event.preventDefault();
      }
    });

    const query = new URLSearchParams(window.location.search);
    const runtimeState = {
      regionId: query.get('regionId') || 'okayama',
      runtimeConfigUrl: query.get('runtimeConfigUrl') || '',
      municipalityCode: query.get('municipalityCode') || '',
      municipalityCodes: query.get('municipalityCodes') || query.get('municipalityCode') || '',
      config: null,
    };
    const INTERACTION_MODES = new Set([
      'select-prefecture',
      'select-municipality',
      'inspect-area',
    ]);
    let interactionMode = 'inspect-area';
    let currentLocation = null;
    let currentLocationRenderTimer = null;
    let currentLocationRefreshTimer = null;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const XLINK_NS = 'http://www.w3.org/1999/xlink';
    const CURRENT_LOCATION_PIN_ID = 'current-location-pin';
    const CURRENT_LOCATION_PIN_HREF = '/map/icons/current-location-pin.svg';
    const layerVisibility = {
      baseArea: true,
      evacuation: true,
      teamActivity: true,
      hazard: false,
    };
    const notifyParent = (type, payload = {}) => {
      window.parent?.postMessage?.({ type, payload }, window.location.origin);
    };

    const emitDataStatus = (payload) => {
      const entry = {
        ...payload,
        online: navigator.onLine,
        updatedAt: payload.updatedAt || payload.at || new Date().toISOString(),
      };
      console.log('[current-map] data status', entry);
      notifyParent(MAP_MESSAGES.runtimeDataStatus, entry);
    };

    const defaultRuntimeConfig = () => ({
      version: 'fallback',
      regionId: runtimeState.regionId,
      containerUrl: '/map/containers/Containers_webapp_denshi_33.svg',
      iconsBaseUrl: '/map/icons',
      initialViewport: {
        lat: 34.66,
        lon: 133.92,
        latSpan: 0.42,
        lonSpan: 0.52,
      },
      layers: {
        evacuation: { dataUrl: '/map/data/evacuation/okayama.json' },
        teamActivity: {
          dataUrl: '/map/data/team-activity/okayama.json',
          baseAreaLayerUrl: '/map/layers/base_area_okayama_simple.svg',
        },
      },
    });

    const runtimeConfigUrlFor = (regionId) =>
      runtimeState.runtimeConfigUrl || `/map/regions/${encodeURIComponent(regionId || 'okayama')}/runtime-config.json`;

    const loadRuntimeConfig = async () => {
      const url = runtimeConfigUrlFor(runtimeState.regionId);
      try {
        const { data: config, source } = await fetchWithRuntimeCache(url, 'runtimeConfig', {
          label: '地域設定',
          emitDataStatus,
          logLabel: 'current-map',
        });
        runtimeState.config = {
          ...defaultRuntimeConfig(),
          ...config,
          layers: {
            ...defaultRuntimeConfig().layers,
            ...(config.layers || {}),
          },
        };
        runtimeState.regionId = runtimeState.config.regionId || runtimeState.regionId;
        console.log('[current-map] runtime-config loaded', {
          regionId: runtimeState.regionId,
          url,
          containerUrl: runtimeState.config.containerUrl,
          evacuationDataUrl: runtimeState.config.layers?.evacuation?.dataUrl,
          teamActivityDataUrl: runtimeState.config.layers?.teamActivity?.dataUrl,
          source,
        });
      } catch (error) {
        runtimeState.config = defaultRuntimeConfig();
        console.warn('[current-map] runtime-config fallback', {
          regionId: runtimeState.regionId,
          url,
          error,
        });
      }
      document.getElementById('mapcanvas')?.setAttribute('data-src', runtimeState.config.containerUrl);
      return runtimeState.config;
    };

    const normalizeFeature = (raw) => {
      if (!raw || typeof raw !== 'object') return null;
      return {
        enabled: raw.enabled !== false,
        id: String(raw.id || raw.featureId || raw.title || ''),
        layerId: String(raw.layerId || raw.category || 'unknown'),
        title: String(raw.title || raw.name || raw.id || '名称未設定'),
        kind: String(raw.kind || 'poi'),
        category: raw.category ? String(raw.category) : undefined,
        summary: raw.summary ? String(raw.summary) : undefined,
        description: raw.description ? String(raw.description) : undefined,
        address: raw.address ? String(raw.address) : undefined,
        status: raw.status ? String(raw.status) : undefined,
        lat: Number.isFinite(Number(raw.lat)) ? Number(raw.lat) : undefined,
        lon: Number.isFinite(Number(raw.lon)) ? Number(raw.lon) : undefined,
        feature: raw.feature || raw,
        area: raw.area ? String(raw.area) : undefined,
        resolvedArea: raw.resolvedArea ? String(raw.resolvedArea) : undefined,
        label: raw.label ? String(raw.label) : undefined,
        properties: raw.properties || undefined,
        teams: Array.isArray(raw.teams) ? raw.teams : undefined,
      };
    };

    const normalizeEvacuationStatus = (status) => {
      const value = String(status || '').trim().toLowerCase();
      if (['open', 'opened', 'active', 'available', '利用可', '開設中'].includes(value)) return 'open';
      if (['limited', 'crowded', 'near_full', '要確認'].includes(value)) return 'limited';
      if (['full', '満員'].includes(value)) return 'full';
      if (['closed', 'close', 'inactive', '閉鎖'].includes(value)) return 'closed';
      return 'unknown';
    };

    const getZoomLevel = () => {
      const scale = Number(window.svgImagesProps?.root?.scale || window.svgImageProps?.scale);
      if (Number.isFinite(scale) && scale > 0) return Math.floor(Math.LOG2E * Math.log(scale) + 7.25);
      return 13;
    };

    const getMaxLodRank = (zoom) => {
      if (zoom < 9.2) return 0;
      if (zoom < 10.2) return 1;
      if (zoom < 11.2) return 2;
      if (zoom < 12.2) return 3;
      if (zoom < 13.2) return 4;
      return 5;
    };

    const getRootSvgDocument = () => {
      return svgMap?.getSvgImages?.()?.root || window.svgImages?.root || null;
    };

    const createRootSvgElement = (tagName) => {
      const rootDoc = getRootSvgDocument();
      if (!rootDoc) return null;
      return rootDoc.createElementNS?.(SVG_NS, tagName) || rootDoc.createElement?.(tagName) || null;
    };

    const removeCurrentLocationMarker = () => {
      const rootDoc = getRootSvgDocument();
      rootDoc?.getElementById?.(CURRENT_LOCATION_PIN_ID)?.remove?.();
    };

    const refreshCurrentLocationMarkerOnce = () => {
      if (currentLocationRefreshTimer) {
        window.clearTimeout(currentLocationRefreshTimer);
      }
      currentLocationRefreshTimer = window.setTimeout(() => {
        currentLocationRefreshTimer = null;
        try {
          svgMap?.refreshScreen?.();
        } catch (error) {
          console.warn('[current-map] current location refresh skipped', error);
        }
      }, 80);
    };

    const renderCurrentLocationMarker = () => {
      if (!currentLocation || !svgMap) return;
      const lat = Number(currentLocation.lat);
      const lon = Number(currentLocation.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        removeCurrentLocationMarker();
        return;
      }

      const rootDoc = getRootSvgDocument();
      const root = rootDoc?.documentElement;
      if (!root) {
        console.warn('[current-map] current location root SVG not ready');
        return;
      }

      rootDoc.getElementById?.(CURRENT_LOCATION_PIN_ID)?.remove?.();

      const pin = createRootSvgElement('image');
      if (!pin) return;
      const x = (lon * 100).toFixed(6);
      const y = (-lat * 100).toFixed(6);
      pin.setAttribute('id', CURRENT_LOCATION_PIN_ID);
      pin.setAttribute('href', CURRENT_LOCATION_PIN_HREF);
      pin.setAttributeNS?.(XLINK_NS, 'xlink:href', CURRENT_LOCATION_PIN_HREF);
      pin.setAttribute('x', '-16');
      pin.setAttribute('y', '-32');
      pin.setAttribute('width', '32');
      pin.setAttribute('height', '32');
      pin.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      pin.setAttribute('transform', `ref(svg,${x},${y})`);
      pin.setAttribute('pointer-events', 'none');
      root.appendChild(pin);
      refreshCurrentLocationMarkerOnce();
    };

    const scheduleCurrentLocationRender = () => {
      if (currentLocationRenderTimer) {
        window.clearTimeout(currentLocationRenderTimer);
      }
      currentLocationRenderTimer = window.setTimeout(() => {
        currentLocationRenderTimer = null;
        renderCurrentLocationMarker();
      }, 120);
    };

    const setCurrentLocationMarker = (location) => {
      const lat = Number(location?.lat);
      const lon = Number(location?.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        currentLocation = null;
        removeCurrentLocationMarker();
        return;
      }
      currentLocation = { lat, lon };
      scheduleCurrentLocationRender();
    };

    // Routing table: maps feature identifiers to LaWA delivery config.
    // current-map.html reads layerId/category/kind to determine the destination
    // without interpreting feature contents. Add a new entry here when a new layer is introduced.
    const LAYER_ROUTES = {
      evacuation: {
        layerIds: ['evacuation'],
        categories: ['evacuation'],
        kinds: [],
        messageType: MAP_MESSAGES.mapShowEvacuationFeature,
        layerKey: 'evacuation',
        deliveryLayerKey: 'evacuationDetail',
      },
      teamActivity: {
        layerIds: ['teamActivity'],
        categories: ['teamActivity'],
        kinds: ['activity-marker', 'activity-mesh'],
        messageType: MAP_MESSAGES.mapShowTeamActivityFeature,
        layerKey: 'teamActivity',
        deliveryLayerKey: 'teamActivityDetail',
      },
      area: {
        layerIds: ['area', 'baseArea'],
        categories: [],
        kinds: ['area', 'municipality', 'district-area'],
        // Area features are not forwarded by this route directly.
        // Area targets are sourced from teamActivity (teamActivity:areaTargets) and carry
        // layerId:'teamActivity', so they route through the teamActivity entry instead.
        // If a dedicated map:showAreaFeature message is ever added, set messageType here.
        messageType: null,
        ownerLayerId: 'teamActivity',
        selectableInModes: ['inspect-area'],
        layerKey: null,
      },
    };

    const routeForFeature = (feature) => {
      if (!feature) return null;
      const { layerId, category, kind } = feature;
      for (const route of Object.values(LAYER_ROUTES)) {
        if (
          (layerId && route.layerIds.includes(layerId)) ||
          (category && route.categories.includes(category)) ||
          (kind && route.kinds.includes(kind))
        ) return route;
      }
      return null;
    };

    // Deliver a normalized feature to LaWA frames. Routing decides the message TYPE
    // (mapShowEvacuationFeature / mapShowTeamActivityFeature); delivery is broadcast and
    // the matching detail layer picks it up by type.
    const broadcastFeature = (feature) => {
      const route = routeForFeature(feature);
      if (!route?.messageType) return;
      if (route.layerKey && !layerVisibility[route.layerKey]) return;
      const message = { type: route.messageType, feature };
      broadcastToLayers(message, `feature:${route.deliveryLayerKey || route.layerKey || 'unknown'}`);
    };

    const setInitialView = () => {
      try {
        const vp = runtimeState.config?.initialViewport || defaultRuntimeConfig().initialViewport;
        const centerLat = Number(vp.lat);
        const centerLon = Number(vp.lon);
        const latSpan = Number(vp.latSpan);
        const lonSpan = Number(vp.lonSpan);
        svgMap.setGeoViewPort?.(
          centerLat - latSpan / 2, centerLon - lonSpan / 2,
          latSpan, lonSpan,
          false,
        );
      } catch (error) {
        console.warn('[current-map] initial view failed', error);
      }
    };

    const init = () => {
      window.setTimeout(() => {
        setInitialView();
        notifyParent(MAP_MESSAGES.runtimeReady, {
          engine: 'svgmap',
          regionId: runtimeState.regionId,
          runtimeConfigUrl: runtimeConfigUrlFor(runtimeState.regionId),
          initialViewport: runtimeState.config?.initialViewport,
          layers: ['baseArea', 'evacuation', 'teamActivity'],
        });
      }, 350);
    };

    const LAYER_ANIM_ID = {
      evacuation: 'layer-evacuation',
      evacuationDetail: 'layer-evacuation-detail',
      teamActivity: 'layer-team-activity',
      teamActivityPins: 'layer-team-activity-pins',
      teamActivityDetail: 'layer-team-activity-detail',
      baseArea: 'layer-base-area',
      hazard: 'layer-hazard',
    };

    const LAYER_VISIBILITY_ANIM_IDS = {
      teamActivity: ['layer-team-activity', 'layer-team-activity-pins'],
    };

    const findRootLayerAnimation = (animId) => {
      const rootDoc = svgMap.getSvgImages?.()?.root || window.svgImages?.root || document;
      return rootDoc?.getElementById?.(animId) || document.getElementById(animId);
    };

    const findLayerChildDocument = (animId) => {
      const images = svgMap.getSvgImages?.() || window.svgImages || {};
      const props = svgMap.getSvgImagesProps?.() || window.svgImagesProps || {};
      for (const [iid, prop] of Object.entries(props)) {
        if (prop?.rootLayer === animId || prop?.id === animId || prop?.title === animId) {
          return images[iid] || null;
        }
      }
      const anim = findRootLayerAnimation(animId);
      const about = anim?.getAttribute?.('about') || anim?.getAttribute?.('iid');
      return about ? images[about] || null : null;
    };

    // === レイヤーメッセージバス =====================================
    // 配送モデルは「ブロードキャスト + 受信側が message type で判別」。これが正式仕様。
    // 過去に animId から特定 controller を逆引きして配送していたが、SVGMap 内部の
    // iframe/controller 管理 (svgImagesProps) への依存は壊れやすく、不達をデバッグ
    // できない事故を繰り返したため廃止した。受信側 (各レイヤー HTML) は自分宛てで
    // ないメッセージを無視する責務を持つ (mapMessages.js のコメント参照)。
    // デバッグ: URL に ?debugBus=1 か localStorage.svgmapDebugBus=1 で配送ログを出す。
    const BUS_DEBUG = (() => {
      try {
        return /[?&]debugBus=1/.test(window.location.search)
          || window.localStorage?.getItem('svgmapDebugBus') === '1';
      } catch { return false; }
    })();

    const broadcastToLayers = (message, debugLabel = '') => {
      const seen = new Set();
      const targets = [];
      const add = (win) => {
        if (!win || seen.has(win)) return;
        seen.add(win);
        targets.push(win);
      };
      add(window);
      document.querySelectorAll('iframe').forEach((frame) => {
        try { add(frame.contentWindow); } catch {}
      });
      const props = svgMap.getSvgImagesProps?.() || window.svgImagesProps || {};
      for (const prop of Object.values(props)) {
        add(prop?.controllerWindow);
      }
      let delivered = 0;
      for (const win of targets) {
        try {
          if (win === window) win.postMessage?.(message, window.location.origin);
          else win.postMessage?.(message, '*');
          delivered += 1;
        } catch {}
      }
      if (BUS_DEBUG) {
        console.log('[bus]', message?.type, debugLabel ? `(${debugLabel})` : '', `→ ${delivered} windows`);
      }
      return delivered;
    };

    const setLayerVisible = (layerKey, visible) => {
      const normalizedLayerKey = layerKey === 'team-activity' ? 'teamActivity' : layerKey;
      const animId = LAYER_ANIM_ID[normalizedLayerKey];
      if (!animId) return;
      const animIds = LAYER_VISIBILITY_ANIM_IDS[normalizedLayerKey] || [animId];
      const nextVisible = Boolean(visible);
      layerVisibility[normalizedLayerKey] = nextVisible;
      console.log('[current-map] map:setLayerVisible received', {
        layerKey: normalizedLayerKey,
        visible: nextVisible,
      });
      const visibility = nextVisible ? 'visible' : 'hidden';
      const display = nextVisible ? 'inline' : 'none';
      // ハザードは LaWA が SVG グループレベルで表示制御する。
      // svgMap.setLayerVisibility() を呼ぶと SVGMap がドキュメントをアンロードし
      // iframe が破棄されるため、ハザードはスキップして postMessage のみで制御する。
      if (normalizedLayerKey === 'hazard') {
        const message = { type: MAP_MESSAGES.mapLayerVisibilityChanged, layerKey: 'hazard', visible: nextVisible };
        broadcastToLayers(message, 'visibility:hazard');
        return;
      }
      const affected = [];
      for (const targetAnimId of animIds) {
        try {
          svgMap.setLayerVisibility?.(targetAnimId, nextVisible);
        } catch (error) {
          console.warn('[current-map] setLayerVisibility failed, falling back to DOM attrs', {
            layerId: normalizedLayerKey,
            animId: targetAnimId,
            error,
          });
        }
        const anim = findRootLayerAnimation(targetAnimId);
        if (anim) {
          anim.setAttribute('visibility', visibility);
          anim.setAttribute('display', display);
          anim.setAttribute('opacity', nextVisible ? '1' : '0');
          if (anim.style) {
            anim.style.visibility = visibility;
            anim.style.display = display;
            anim.style.opacity = nextVisible ? '1' : '0';
          }
        }
        const childDoc = findLayerChildDocument(targetAnimId);
        const childRoot = childDoc?.documentElement;
        if (childRoot) {
          childRoot.setAttribute('visibility', visibility);
          childRoot.setAttribute('display', display);
          childRoot.setAttribute('opacity', nextVisible ? '1' : '0');
          if (childRoot.style) {
            childRoot.style.visibility = visibility;
            childRoot.style.display = display;
            childRoot.style.opacity = nextVisible ? '1' : '0';
          }
        }
        affected.push({
          animId: targetAnimId,
          hasRootAnimation: Boolean(anim),
          hasChildDocument: Boolean(childDoc),
        });
      }
      const message = {
        type: MAP_MESSAGES.mapLayerVisibilityChanged,
        layerKey: normalizedLayerKey,
        visible: nextVisible,
      };
      const delivered = broadcastToLayers(message, `visibility:${normalizedLayerKey}`);
      svgMap.refreshScreen?.();
      console.log('[current-map] layer visibility changed', {
        layerKey: normalizedLayerKey,
        animIds,
        visible: nextVisible,
        affected,
        delivered,
      });
    };

    // === ハザード: ズームに応じて県全域/市町村別ファイルを切り替える ===
    // hazardLayer LaWA に prefSvgUrl + svgUrlTemplate + municipality filter を送る
    const broadcastHazardConfig = () => {
      const prefSvgUrl = runtimeState.config?.layers?.hazard?.layerUrl || '';
      const tmpl = runtimeState.config?.layers?.hazard?.svgUrlTemplate || '';
      if (!prefSvgUrl && !tmpl) return;
      broadcastToLayers({
        type: MAP_MESSAGES.mapSetLayerConfig,
        layerId: 'hazard',
        prefSvgUrl,
        svgUrlTemplate: tmpl,
      }, 'config:hazard');
    };

    const broadcastInteractionMode = () => {
      broadcastToLayers({
        type: MAP_MESSAGES.mapInteractionModeChanged,
        interactionMode,
      }, 'interactionMode');
    };

    const setInteractionMode = (nextMode) => {
      const normalized = INTERACTION_MODES.has(nextMode) ? nextMode : 'inspect-area';
      if (interactionMode === normalized) {
        broadcastInteractionMode();
        return;
      }
      interactionMode = normalized;
      console.log('[current-map] interaction mode changed', {
        interactionMode,
      });
      broadcastInteractionMode();
    };

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin && event.origin !== 'null') {
        console.warn('[current-map] message rejected by origin', {
          origin: event.origin,
          selfOrigin: window.location.origin,
          type: event.data?.type,
        });
        return;
      }
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === MAP_MESSAGES.mapSetViewport) {
        const vp = msg.viewport;
        const centerLat = Number(vp?.lat);
        const centerLon = Number(vp?.lon);
        const latSpan = Number(vp?.latSpan);
        const lonSpan = Number(vp?.lonSpan);
        if (Number.isFinite(centerLat) && Number.isFinite(centerLon) && latSpan > 0 && lonSpan > 0) {
          try {
            svgMap.setGeoViewPort?.(
              centerLat - latSpan / 2, centerLon - lonSpan / 2,
              latSpan, lonSpan,
              false,
            );
          } catch (err) {
            console.warn('[current-map] map:setViewport failed', err);
          }
        }
        return;
      }

      // Zoom relative to the currently displayed viewport, not a fixed point.
      // setGeoViewPort(lat, lng, latSpan, lngSpan) treats lat/lng as the SW corner,
      // so we read the center from gv.cy/gv.cx and subtract half the new span.
      if (msg.type === MAP_MESSAGES.mapZoom) {
        const factor = Number(msg.factor);
        if (!Number.isFinite(factor) || factor <= 0) return;
        try {
          const gv = svgMap?.getGeoViewBox?.();
          if (!gv || !Number.isFinite(Number(gv.width)) || !Number.isFinite(Number(gv.height))) return;
          const centerLat = Number.isFinite(Number(gv.cy)) ? Number(gv.cy) : Number(gv.y) + Number(gv.height) / 2;
          const centerLon = Number.isFinite(Number(gv.cx)) ? Number(gv.cx) : Number(gv.x) + Number(gv.width) / 2;
          const newLatSpan = Number(gv.height) * factor;
          const newLonSpan = Number(gv.width) * factor;
          svgMap.setGeoViewPort?.(centerLat - newLatSpan / 2, centerLon - newLonSpan / 2, newLatSpan, newLonSpan, false);
          svgMap.refreshScreen?.();
        } catch (err) {
          console.warn('[current-map] map:zoom failed', err);
        }
        return;
      }

      if (msg.type === MAP_MESSAGES.mapSetCurrentLocation) {
        setCurrentLocationMarker(msg.location || msg.payload || msg);
        return;
      }

      // Atomically center the view on a location and drop the pin there.
      // lat/lon here are GPS center coordinates. setGeoViewPort expects the SW corner,
      // so subtract half the span to convert center → SW.
      if (msg.type === MAP_MESSAGES.mapFocusLocation) {
        const loc = msg.location || msg.payload || msg;
        const lat = Number(loc?.lat);
        const lon = Number(loc?.lon);
        const latSpan = Number(loc?.latSpan);
        const lonSpan = Number(loc?.lonSpan);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        try {
          if (Number.isFinite(latSpan) && Number.isFinite(lonSpan) && latSpan > 0 && lonSpan > 0) {
            svgMap?.setGeoViewPort?.(lat - latSpan / 2, lon - lonSpan / 2, latSpan, lonSpan, false);
          } else {
            const gv = svgMap?.getGeoViewBox?.();
            if (gv && Number.isFinite(Number(gv.width)) && Number.isFinite(Number(gv.height))) {
              const ls = Number(gv.height);
              const ls2 = Number(gv.width);
              svgMap?.setGeoViewPort?.(lat - ls / 2, lon - ls2 / 2, ls, ls2, false);
            }
          }
          svgMap?.refreshScreen?.();
        } catch (err) {
          console.warn('[current-map] map:focusLocation viewport failed', err);
        }
        // Defer pin draw until SVGMap has finished reloading tiles after the viewport change.
        // requestAnimationFrame (~16 ms) is too short — the SVG root is still being rebuilt.
        // 500 ms matches the old two-step approach that was known to work reliably.
        window.setTimeout(() => {
          setCurrentLocationMarker({ lat, lon });
        }, 500);
        return;
      }

      if (msg.type === MAP_MESSAGES.mapSetLayerVisible || msg.type === MAP_MESSAGES.runtimeSetLayerVisibility) {
        const layerKey = msg.layerKey || msg.layerId || msg.payload?.layerKey || msg.payload?.layerId;
        const visible = msg.visible ?? msg.payload?.visible;
        setLayerVisible(layerKey, visible);
        return;
      }

      if (msg.type === MAP_MESSAGES.mapSetInteractionMode) {
        setInteractionMode(msg.interactionMode || msg.payload?.interactionMode);
        return;
      }

      const schedulePoiReparse = (reason) => {
        console.log('[current-map] received', reason, '→ scheduling re-parse');
        window.setTimeout(() => {
          try {
            // refreshScreen だけでは #dynamicLoad の再パース(getSymbols/setPoiBBox)が
            // 走らず、preRenderFunction で追加した <use> POI が hit-test 未登録のまま
            // （パンするまで押せない）。pan と同じく viewport を現在値で再設定して、
            // 本物の再パースを一度だけ誘発し POI を登録させる。
            // getGeoViewBox: {x:西経度, y:南緯度, width:経度幅, height:緯度幅}
            // setGeoViewPort(南西緯度, 南西経度, 緯度幅, 経度幅, animation)
            const gv = svgMap.getGeoViewBox?.();
            if (gv && Number.isFinite(Number(gv.width)) && Number.isFinite(Number(gv.height))) {
              svgMap.setGeoViewPort?.(Number(gv.y), Number(gv.x), Number(gv.height), Number(gv.width), false);
              console.log('[current-map] viewport re-set (force re-parse) for', reason);
            } else {
              svgMap.refreshScreen?.();
              console.log('[current-map] refreshScreen fallback for', reason);
            }
          } catch (err) {
            console.warn('[current-map] re-parse nudge failed', err);
          }
        }, 80); // SVGMapの現在のparseSVGサイクルが終わるのを待つ
      };

      // layer内から直接 svgMap.refreshScreen() を呼ぶと #parseSVG の途中に
      // 再入してクラッシュするため、ここで setTimeout を挟んで安全に呼ぶ
      if (
        msg.type === MAP_MESSAGES.runtimePoiLayerRendered ||
        msg.type === MAP_MESSAGES.hazardLayerDataReady
      ) {
        schedulePoiReparse(`${msg.type}:${msg.payload?.layerId || msg.layerId || 'unknown'}`);
        return;
      }

      // team markers 描画完了 → POI ヒットテスト再登録のため reparse を誘発する
      // (getSymbols は #dynamicLoad 冒頭で走るため、preRenderFunction 後に追加された
      //  <use> POI は次の viewport 変化まで登録されない。setGeoViewPort で再パースする)
      if (msg.type === 'teamActivityLayer:markersReady') {
        schedulePoiReparse(msg.type);
        return;
      }

      // hazardLayer 準備完了 → svgUrlTemplate + municipality filter を送る
      if (msg.type === MAP_MESSAGES.hazardLayerReady) {
        broadcastHazardConfig();
        broadcastToLayers({
          type: MAP_MESSAGES.mapLayerVisibilityChanged,
          layerKey: 'hazard',
          visible: layerVisibility.hazard,
        }, 'visibility:hazard:ready');
        const hazardCodes = runtimeState.municipalityCodes
          .split(',').map((s) => s.trim()).filter(Boolean);
        if (hazardCodes.length > 0) {
          const filterMsg = { type: MAP_MESSAGES.mapSetMunicipalityFilter, municipalityCodes: hazardCodes };
          broadcastToLayers(filterMsg, 'filter:hazard');
        }
        return;
      }

      // Layer ready → send correct data URL + layer config + municipality filter
      if (msg.type === MAP_MESSAGES.runtimeLayerReady || msg.type === MAP_MESSAGES.teamActivityLayerReady) {
        const layerId = msg.type === MAP_MESSAGES.runtimeLayerReady
          ? (msg.payload?.layerId || msg.layerId || '')
          : 'teamActivity';
        if (layerId !== 'evacuation' && layerId !== 'teamActivity') return;
        const layerCfg = layerId === 'evacuation'
          ? runtimeState.config?.layers?.evacuation
          : runtimeState.config?.layers?.teamActivity;
        const dataUrl = layerCfg?.dataUrl;
        const acceptsRuntimeDataUrl = msg.payload?.acceptsRuntimeDataUrl !== false;
        if (dataUrl && acceptsRuntimeDataUrl) {
          console.log('[current-map]', msg.type, '→ sending dataUrl', dataUrl);
          broadcastToLayers({ type: MAP_MESSAGES.mapSetDataUrl, layerId, url: dataUrl }, `dataUrl:${layerId}`);
        }
        if (layerId === 'teamActivity') {
          const baseUrl = layerCfg?.baseAreaLayerUrl;
          const districtTemplate = layerCfg?.districtSvgUrlTemplate;
          if (baseUrl || districtTemplate) {
            broadcastToLayers({
              type: MAP_MESSAGES.mapSetLayerConfig,
              layerId: 'teamActivity',
              baseAreaLayerUrl: baseUrl,
              districtSvgUrlTemplate: districtTemplate,
            }, 'config:teamActivity');
          }
        }
        const allowedCodes = runtimeState.municipalityCodes
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);
        if (allowedCodes.length > 0) {
          console.log('[current-map]', msg.type, '→ sending municipality filter', allowedCodes);
          broadcastToLayers({ type: MAP_MESSAGES.mapSetMunicipalityFilter, municipalityCodes: allowedCodes }, 'filter:layerReady');
        }
        return;
      }

      if (msg.type === MAP_MESSAGES.runtimeDataStatus) {
        const payload = msg.payload || {};
        emitDataStatus({
          key: payload.key || msg.key || 'runtimeData',
          label: payload.label || msg.label,
          source: payload.source || msg.source || 'fallback',
          url: payload.url || msg.url,
          online: payload.online,
          updatedAt: payload.updatedAt || payload.at,
          message: payload.message,
        });
        return;
      }

      if (msg.type === MAP_MESSAGES.runtimeFeatureSelect) {
        const feature = normalizeFeature(msg.payload?.feature || msg.feature);
        if (feature) broadcastFeature(feature);
        return;
      }

      if (msg.type === MAP_MESSAGES.runtimeFeatureDetail) {
        notifyParent(MAP_MESSAGES.runtimeFeatureDetail, {
          layerId: msg.payload?.layerId,
          detail: msg.payload?.detail,
        });
        return;
      }

    });

    await loadRuntimeConfig();
    console.log('[current-map] data-src set to', runtimeState.config.containerUrl);
    const svgMapModule = await import('/map/vendor/svgmapjs/SVGMapLv0.1_r18module.js');
    svgMap = svgMapModule.svgMap;
    window.svgMap = svgMap;
    svgMap.initLoad();
    init();
  </script>
</body>
</html>

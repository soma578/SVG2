<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0">
<title>SVGMap Native 防災マップ</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #dbeafe;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #mapcanvas {
    position: absolute;
    inset: 0;
  }
  #controller, #layerlist, #layerList, #layerSpecificUI, #initLayerSpecificUI,
  #centerSight, #ticker, .layerUI, .essentialUI {
    display: none !important;
    visibility: hidden !important;
  }
</style>
<script>
  window.svgMapOptions = {
    enableEssentialUI: false,
    enableGIS: false,
    enableAuthoringTool: false,
    enableCustomLayersManager: false,
    enableLayerUI: false
  };
</script>
</head>
<body>
  <img id="centerSight" alt="" width="1" height="1"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
       style="position:absolute;left:0;top:0;opacity:0;pointer-events:none;">
  <div id="mapcanvas" data-src="/map/containers/Containers_webapp.svg"></div>
  <div id="controller"></div>
  <div id="layerlist"></div>
  <div id="layerList"></div>
  <div id="layerSpecificUI"></div>
  <div id="initLayerSpecificUI"></div>

  <script type="module">
    console.log('[current-map] VERSION unified-feature-select-debug-v6');

    let svgMap;

    window.addEventListener('error', (event) => {
      const message = String(event.message || '');
      const source = String(event.filename || '');
      if (message.includes('domElement is not defined') && source.includes('ShowPoiProperty.js')) {
        // Suppress known SVGMap popup bug noise.
        event.preventDefault();
      }
    });

    const query = new URLSearchParams(window.location.search);
    const runtimeState = {
      regionId: query.get('regionId') || 'okayama',
      runtimeConfigUrl: query.get('runtimeConfigUrl') || '',
      municipalityCode: query.get('municipalityCode') || '',
      municipalityCodes: query.get('municipalityCodes') || query.get('municipalityCode') || '',
      config: null,
    };
    let teamActivityHitTargets = [];
    let evacuationHitTargets = [];
    let areaSelectionTargets = [];
    let pointerStart = null;
    let lastFeatureEmitAt = 0;
    const INTERACTION_MODES = new Set([
      'select-prefecture',
      'select-municipality',
      'select-area',
      'inspect-area',
    ]);
    let interactionMode = 'inspect-area';
    let currentLocation = null;
    let currentLocationRenderTimer = null;
    let currentLocationRefreshTimer = null;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const XLINK_NS = 'http://www.w3.org/1999/xlink';
    const CURRENT_LOCATION_PIN_ID = 'current-location-pin';
    const CURRENT_LOCATION_PIN_HREF = '/map/icons/current-location-pin.svg';
    const layerVisibility = {
      baseArea: true,
      evacuation: true,
      teamActivity: true,
    };
    const DATA_CACHE_NAME = 'svgmap-runtime-data-v1';

    const notifyParent = (type, payload = {}) => {
      if (type === 'runtime:featureSelect') {
        console.log('[current-map] notifyParent featureSelect', {
          id: payload?.id,
          layerId: payload?.layerId,
          title: payload?.title,
        });
      }
      // Use wildcard to avoid dropping messages across localhost/127.0.0.1
      // and nested srcdoc/window hops.
      window.parent?.postMessage?.({ type, payload }, '*');
    };

    const emitDataStatus = (payload) => {
      const entry = {
        ...payload,
        online: navigator.onLine,
        updatedAt: payload.updatedAt || payload.at || new Date().toISOString(),
      };
      console.log('[current-map] data status', entry);
      notifyParent('runtime:dataStatus', entry);
    };

    const fetchWithRuntimeCache = async (url, key, { responseType = 'json', label } = {}) => {
      const absoluteUrl = new URL(url, window.location.href).href;
      const request = new Request(absoluteUrl, { method: 'GET' });
      try {
        const response = await fetch(absoluteUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if ('caches' in window) {
          const cache = await caches.open(DATA_CACHE_NAME);
          await cache.put(request, response.clone());
        }
        emitDataStatus({ key, label, source: 'network', url });
        return {
          source: 'network',
          data: responseType === 'text' ? await response.text() : await response.json(),
        };
      } catch (error) {
        if ('caches' in window) {
          const cache = await caches.open(DATA_CACHE_NAME);
          const cached = await cache.match(request);
          if (cached) {
            console.warn('[current-map] using cached runtime data', { key, url, error });
            emitDataStatus({ key, label, source: 'cache', url, message: 'ネットワーク取得失敗のため保存済みを表示' });
            return {
              source: 'cache',
              data: responseType === 'text' ? await cached.text() : await cached.json(),
            };
          }
        }
        emitDataStatus({ key, label, source: 'fallback', url, message: 'キャッシュなし' });
        throw error;
      }
    };

    const defaultRuntimeConfig = () => ({
      version: 'fallback',
      regionId: runtimeState.regionId,
      containerUrl: '/map/containers/Containers_webapp.svg',
      iconsBaseUrl: '/map/icons',
      initialViewport: {
        lat: 34.66,
        lon: 133.92,
        latSpan: 0.42,
        lonSpan: 0.52,
      },
      layers: {
        evacuation: { dataUrl: '/map/data/evacuation/okayama.json' },
        teamActivity: {
          dataUrl: '/map/data/team-activity/okayama.json',
          baseAreaLayerUrl: '/map/layers/base_area_okayama_simple.svg',
        },
      },
    });

    const runtimeConfigUrlFor = (regionId) =>
      runtimeState.runtimeConfigUrl || `/map/regions/${encodeURIComponent(regionId || 'okayama')}/runtime-config.json`;

    const loadRuntimeConfig = async () => {
      const url = runtimeConfigUrlFor(runtimeState.regionId);
      try {
        const { data: config, source } = await fetchWithRuntimeCache(url, 'runtimeConfig', { label: '地域設定' });
        runtimeState.config = {
          ...defaultRuntimeConfig(),
          ...config,
          layers: {
            ...defaultRuntimeConfig().layers,
            ...(config.layers || {}),
          },
        };
        runtimeState.regionId = runtimeState.config.regionId || runtimeState.regionId;
        console.log('[current-map] runtime-config loaded', {
          regionId: runtimeState.regionId,
          url,
          containerUrl: runtimeState.config.containerUrl,
          evacuationDataUrl: runtimeState.config.layers?.evacuation?.dataUrl,
          teamActivityDataUrl: runtimeState.config.layers?.teamActivity?.dataUrl,
          source,
        });
      } catch (error) {
        runtimeState.config = defaultRuntimeConfig();
        console.warn('[current-map] runtime-config fallback', {
          regionId: runtimeState.regionId,
          url,
          error,
        });
      }
      document.getElementById('mapcanvas')?.setAttribute('data-src', runtimeState.config.containerUrl);
      return runtimeState.config;
    };

    const normalizeFeature = (raw) => {
      if (!raw || typeof raw !== 'object') return null;
      return {
        enabled: raw.enabled !== false,
        id: String(raw.id || raw.featureId || raw.title || ''),
        layerId: String(raw.layerId || raw.category || 'unknown'),
        title: String(raw.title || raw.name || raw.id || '名称未設定'),
        kind: String(raw.kind || 'poi'),
        category: raw.category ? String(raw.category) : undefined,
        summary: raw.summary ? String(raw.summary) : undefined,
        description: raw.description ? String(raw.description) : undefined,
        address: raw.address ? String(raw.address) : undefined,
        status: raw.status ? String(raw.status) : undefined,
        lat: Number.isFinite(Number(raw.lat)) ? Number(raw.lat) : undefined,
        lon: Number.isFinite(Number(raw.lon)) ? Number(raw.lon) : undefined,
        feature: raw.feature || raw,
        area: raw.area ? String(raw.area) : undefined,
        resolvedArea: raw.resolvedArea ? String(raw.resolvedArea) : undefined,
        label: raw.label ? String(raw.label) : undefined,
        properties: raw.properties || undefined,
        teams: Array.isArray(raw.teams) ? raw.teams : undefined,
      };
    };

    const asNumber = (value) => {
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    };

    const normalizeEvacuationStatus = (status) => {
      const value = String(status || '').trim().toLowerCase();
      if (['open', 'opened', 'active', 'available', '利用可', '開設中'].includes(value)) return 'open';
      if (['limited', 'crowded', 'near_full', '要確認'].includes(value)) return 'limited';
      if (['full', '満員'].includes(value)) return 'full';
      if (['closed', 'close', 'inactive', '閉鎖'].includes(value)) return 'closed';
      return 'unknown';
    };

    const getZoomLevel = () => {
      const scale = Number(window.svgImagesProps?.root?.scale || window.svgImageProps?.scale);
      if (Number.isFinite(scale) && scale > 0) return Math.floor(Math.LOG2E * Math.log(scale) + 7.25);
      return 13;
    };

    const getMaxLodRank = (zoom) => {
      if (zoom < 9.2) return 0;
      if (zoom < 10.2) return 1;
      if (zoom < 11.2) return 2;
      if (zoom < 12.2) return 3;
      if (zoom < 13.2) return 4;
      return 5;
    };

    const geoToPixel = (record, geoViewBox, canvasSize) => {
      const x = ((record.lon - geoViewBox.x) / geoViewBox.width) * canvasSize.width;
      const y = ((geoViewBox.y + geoViewBox.height - record.lat) / geoViewBox.height) * canvasSize.height;
      return { x, y };
    };

    const getCanvasSizeSafe = () => {
      const canvasSize = svgMap.getCanvasSize?.();
      const fallback = document.querySelector('#mapcanvas canvas')?.getBoundingClientRect?.();
      return {
        width: Number(canvasSize?.width || fallback?.width || window.innerWidth),
        height: Number(canvasSize?.height || fallback?.height || window.innerHeight),
      };
    };

    const getRootSvgDocument = () => {
      return svgMap?.getSvgImages?.()?.root || window.svgImages?.root || null;
    };

    const createRootSvgElement = (tagName) => {
      const rootDoc = getRootSvgDocument();
      if (!rootDoc) return null;
      return rootDoc.createElementNS?.(SVG_NS, tagName) || rootDoc.createElement?.(tagName) || null;
    };

    const removeCurrentLocationMarker = () => {
      const rootDoc = getRootSvgDocument();
      rootDoc?.getElementById?.(CURRENT_LOCATION_PIN_ID)?.remove?.();
    };

    const refreshCurrentLocationMarkerOnce = () => {
      if (currentLocationRefreshTimer) {
        window.clearTimeout(currentLocationRefreshTimer);
      }
      currentLocationRefreshTimer = window.setTimeout(() => {
        currentLocationRefreshTimer = null;
        try {
          svgMap?.refreshScreen?.();
        } catch (error) {
          console.warn('[current-map] current location refresh skipped', error);
        }
      }, 80);
    };

    const renderCurrentLocationMarker = () => {
      if (!currentLocation || !svgMap) return;
      const lat = Number(currentLocation.lat);
      const lon = Number(currentLocation.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        removeCurrentLocationMarker();
        return;
      }

      const rootDoc = getRootSvgDocument();
      const root = rootDoc?.documentElement;
      if (!root) {
        console.warn('[current-map] current location root SVG not ready');
        return;
      }

      rootDoc.getElementById?.(CURRENT_LOCATION_PIN_ID)?.remove?.();

      const pin = createRootSvgElement('image');
      if (!pin) return;
      const x = (lon * 100).toFixed(6);
      const y = (-lat * 100).toFixed(6);
      pin.setAttribute('id', CURRENT_LOCATION_PIN_ID);
      pin.setAttribute('href', CURRENT_LOCATION_PIN_HREF);
      pin.setAttributeNS?.(XLINK_NS, 'xlink:href', CURRENT_LOCATION_PIN_HREF);
      pin.setAttribute('x', '-16');
      pin.setAttribute('y', '-32');
      pin.setAttribute('width', '32');
      pin.setAttribute('height', '32');
      pin.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      pin.setAttribute('transform', `ref(svg,${x},${y})`);
      pin.setAttribute('pointer-events', 'none');
      root.appendChild(pin);
      console.log('[current-map] current location SVG pin drawn', { lat, lon, x, y });
      refreshCurrentLocationMarkerOnce();
    };

    const scheduleCurrentLocationRender = () => {
      if (currentLocationRenderTimer) {
        window.clearTimeout(currentLocationRenderTimer);
      }
      currentLocationRenderTimer = window.setTimeout(() => {
        currentLocationRenderTimer = null;
        renderCurrentLocationMarker();
      }, 120);
    };

    const setCurrentLocationMarker = (location) => {
      const lat = Number(location?.lat);
      const lon = Number(location?.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        currentLocation = null;
        removeCurrentLocationMarker();
        return;
      }
      currentLocation = { lat, lon };
      scheduleCurrentLocationRender();
      console.log('[current-map] current location marker set', currentLocation);
    };

    const hitTestTeamActivity = (event) => {
      const zoom = getZoomLevel();
      console.log('[current-map] click hit-test state', {
        teamActivityTargets: teamActivityHitTargets.length,
        teamActivityVisible: layerVisibility.teamActivity,
        interactionMode,
        zoom,
      });
      if (interactionMode !== 'inspect-area') return null;
      if (!layerVisibility.teamActivity) return null;
      if (teamActivityHitTargets.length === 0) {
        console.warn('[current-map] teamActivity hit-test skipped: no targets');
        return null;
      }
      const geoViewBox = svgMap.getGeoViewBox?.();
      if (!geoViewBox || !Number.isFinite(Number(geoViewBox.width))) return null;
      const canvasSize = getCanvasSizeSafe();
      if (!Number.isFinite(canvasSize.width) || !Number.isFinite(canvasSize.height)) return null;

      const rect = document.querySelector('#mapcanvas canvas')?.getBoundingClientRect?.()
        || document.getElementById('mapcanvas')?.getBoundingClientRect?.();
      if (!rect) return null;

      const sx = event.clientX - rect.left;
      const sy = event.clientY - rect.top;
      let nearest = null;

      for (const target of teamActivityHitTargets) {
        if (target.kind === 'activity-mesh') continue;
        const lon = Number(target.lon);
        const lat = Number(target.lat);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        if (lon < geoViewBox.x || lon > geoViewBox.x + geoViewBox.width) continue;
        if (lat < geoViewBox.y || lat > geoViewBox.y + geoViewBox.height) continue;
        const p = geoToPixel({ lon, lat }, geoViewBox, canvasSize);
        const halfWidth = Math.max(Number(target.screenWidth || 0) / 2, 24);
        const halfHeight = Math.max(Number(target.screenHeight || 0) / 2, 16);
        const dx = Math.abs(p.x - sx);
        const dy = Math.abs(p.y - sy);
        const ellipseScore = (dx / (halfWidth + 8)) ** 2 + (dy / (halfHeight + 8)) ** 2;
        const distance = Math.hypot(p.x - sx, p.y - sy);
        console.log('[current-map] teamActivity hit-test target screen', {
          id: target.id,
          title: target.title,
          mapX: target.x,
          mapY: target.y,
          screenX: Number(p.x.toFixed(1)),
          screenY: Number(p.y.toFixed(1)),
          clientX: Number(sx.toFixed(1)),
          clientY: Number(sy.toFixed(1)),
          dx: Number((sx - p.x).toFixed(1)),
          dy: Number((sy - p.y).toFixed(1)),
          halfW: Number(halfWidth.toFixed(1)),
          halfH: Number(halfHeight.toFixed(1)),
        });
        const hit = ellipseScore <= 1 || distance <= Math.max(Number(target.hitRadius || 0), 16);
        if (!hit) continue;
        const score = ellipseScore + distance / 10000;
        if (!nearest || score < nearest.score) nearest = { target, distance, score };
      }

      console.log('[current-map] teamActivity hit-test', {
        sx: Math.round(sx),
        sy: Math.round(sy),
        targets: teamActivityHitTargets.length,
        nearestTitle: nearest?.target?.title || null,
        nearestDistance: nearest ? Number(nearest.distance.toFixed(1)) : null,
      });

      return nearest ? normalizeFeature(nearest.target) : null;
    };

    const hitTestEvacuationTargets = (event) => {
      if (interactionMode !== 'inspect-area') return null;
      if (!layerVisibility.evacuation) return null;
      if (evacuationHitTargets.length === 0) return null;
      const geoViewBox = svgMap.getGeoViewBox?.();
      if (!geoViewBox || !Number.isFinite(Number(geoViewBox.width))) return null;
      const canvasSize = getCanvasSizeSafe();
      if (!Number.isFinite(canvasSize.width) || !Number.isFinite(canvasSize.height)) return null;
      const rect = document.querySelector('#mapcanvas canvas')?.getBoundingClientRect?.()
        || document.getElementById('mapcanvas')?.getBoundingClientRect?.();
      if (!rect) return null;
      const sx = event.clientX - rect.left;
      const sy = event.clientY - rect.top;
      let nearest = null;
      for (const target of evacuationHitTargets) {
        const lon = Number(target.lon);
        const lat = Number(target.lat);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        if (lon < geoViewBox.x || lon > geoViewBox.x + geoViewBox.width) continue;
        if (lat < geoViewBox.y || lat > geoViewBox.y + geoViewBox.height) continue;
        const p = geoToPixel({ lon, lat }, geoViewBox, canvasSize);
        const distance = Math.hypot(p.x - sx, p.y - sy);
        const hitRadius = Math.max(Number(target.hitRadius || 0), 24);
        if (distance > hitRadius) continue;
        if (!nearest || distance < nearest.distance) nearest = { target, distance };
      }
      console.log('[current-map] evacuation hit-test', {
        sx: Math.round(sx),
        sy: Math.round(sy),
        targets: evacuationHitTargets.length,
        nearestTitle: nearest?.target?.title || null,
        nearestDistance: nearest ? Number(nearest.distance.toFixed(1)) : null,
      });
      return nearest ? normalizeFeature(nearest.target.feature) : null;
    };

    const pointInPolygon = (lon, lat, pts) => {
      if (!Array.isArray(pts) || pts.length < 3) return false;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = Number(pts[i][0]);
        const yi = Number(pts[i][1]);
        const xj = Number(pts[j][0]);
        const yj = Number(pts[j][1]);
        if (!Number.isFinite(xi) || !Number.isFinite(yi) || !Number.isFinite(xj) || !Number.isFinite(yj)) continue;
        if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
          inside = !inside;
        }
      }
      return inside;
    };

    const eventToGeo = (event) => {
      const geoViewBox = svgMap.getGeoViewBox?.();
      if (!geoViewBox || !Number.isFinite(Number(geoViewBox.width))) return null;
      const canvasSize = getCanvasSizeSafe();
      const rect = document.querySelector('#mapcanvas canvas')?.getBoundingClientRect?.()
        || document.getElementById('mapcanvas')?.getBoundingClientRect?.();
      if (!rect || !Number.isFinite(canvasSize.width) || !Number.isFinite(canvasSize.height)) return null;
      const sx = event.clientX - rect.left;
      const sy = event.clientY - rect.top;
      return {
        lon: Number(geoViewBox.x) + (sx / canvasSize.width) * Number(geoViewBox.width),
        lat: Number(geoViewBox.y) + Number(geoViewBox.height) - (sy / canvasSize.height) * Number(geoViewBox.height),
        sx,
        sy,
      };
    };

    const hitTestAreaSelection = (event) => {
      if (interactionMode !== 'select-area') return null;
      const point = eventToGeo(event);
      if (!point) return null;
      let matched = null;
      for (const target of areaSelectionTargets) {
        if (!target?.enabled) continue;
        if (pointInPolygon(point.lon, point.lat, target.poly)) {
          matched = target;
          break;
        }
      }
      console.log('[current-map] area hit-test', {
        targets: areaSelectionTargets.length,
        lon: Number(point.lon.toFixed(6)),
        lat: Number(point.lat.toFixed(6)),
        matchedId: matched?.id || null,
        matchedTitle: matched?.title || null,
      });
      return matched ? normalizeFeature(matched) : null;
    };

    const parseContentFeature = (carrier) => {
      const content = carrier?.getAttribute?.('content');
      if (!content) return null;

      const ownerSvg = carrier.ownerSVGElement || carrier.closest?.('svg');
      const property = ownerSvg?.getAttribute?.('property') || '';
      const keys = property.split(',').map((key) => key.trim()).filter(Boolean);
      const values = content.split(',').map((value) => value.trim());
      if (!keys.length || !values.length) return null;

      const raw = keys.reduce((acc, key, index) => {
        acc[key] = values[index] || '';
        return acc;
      }, {});

      return normalizeFeature({
        ...raw,
        id: raw.id || carrier.getAttribute('data-feature-id'),
        title: raw.title || carrier.getAttribute('xlink:title') || carrier.getAttribute('title'),
        layerId: carrier.getAttribute('data-layer-id') || raw.layerId || raw.category,
        kind: carrier.getAttribute('data-kind') || raw.kind || 'poi',
        category: carrier.getAttribute('data-layer-id') || raw.category,
        lat: raw.lat || raw.latitude || carrier.getAttribute('data-lat'),
        lon: raw.lon || raw.longitude || carrier.getAttribute('data-lon'),
      });
    };

    const featureFromCarrier = (carrier) => {
      if (carrier) {
        try {
          return normalizeFeature(JSON.parse(carrier.getAttribute('data-feature') || '{}'));
        } catch {
          return normalizeFeature({
            id: carrier.getAttribute('data-feature-id'),
            layerId: carrier.getAttribute('data-layer-id'),
            title: carrier.getAttribute('data-title'),
            kind: carrier.getAttribute('data-kind'),
            lat: carrier.getAttribute('data-lat'),
            lon: carrier.getAttribute('data-lon'),
          });
        }
      }
      return null;
    };

    const findFeatureElement = (event) => {
      const path = event?.composedPath ? event.composedPath() : [];
      for (const el of path) {
        if (el?.getAttribute?.('data-feature')) return el;
      }
      return event?.target?.closest?.('[data-feature]') || null;
    };

    const featureFromElement = (element) => {
      const feature = featureFromCarrier(element?.closest?.('[data-feature]'));
      if (feature) return feature;

      return parseContentFeature(element?.closest?.('[content]'));
    };

    const featureFromEvent = (event) =>
      featureFromCarrier(findFeatureElement(event)) || featureFromElement(event?.target);

    const isAreaFeature = (feature) =>
      feature?.layerId === 'area' ||
      feature?.layerId === 'baseArea' ||
      feature?.kind === 'area' ||
      feature?.kind === 'municipality' ||
      feature?.kind === 'district-area';

    const isIconInspectionFeature = (feature) =>
      feature?.layerId === 'evacuation' ||
      feature?.layerId === 'teamActivity' ||
      feature?.category === 'evacuation' ||
      feature?.category === 'teamActivity';

    const findTeamActivityTarget = (event) => {
      const path = event.composedPath ? event.composedPath() : [];
      for (const el of path) {
        if (el?.getAttribute?.('data-layer-id') === 'teamActivity') return el;
      }
      return event.target?.closest?.('[data-layer-id="teamActivity"]') || null;
    };

    const emitFeature = (feature) => {
      if (!feature?.enabled) return;
      lastFeatureEmitAt = Date.now();
      console.log('[tap-debug][current-map] emitFeature', {
        id: feature?.id,
        layerId: feature?.layerId,
        kind: feature?.kind,
        title: feature?.title,
      });
      console.log('[current-map] emitFeature', {
        id: feature?.id,
        layerId: feature?.layerId,
        title: feature?.title,
      });
      notifyParent('runtime:featureSelect', feature);
    };

    const isMapPointerEvent = (event) => {
      const canvas = document.querySelector('#mapcanvas canvas');
      const mapCanvas = document.getElementById('mapcanvas');
      const rect = (canvas || mapCanvas)?.getBoundingClientRect?.();
      if (!rect) return false;
      return (
        event.clientX >= rect.left &&
        event.clientX <= rect.right &&
        event.clientY >= rect.top &&
        event.clientY <= rect.bottom
      );
    };

    const rememberPointerStart = (event) => {
      if (!isMapPointerEvent(event)) return;
      pointerStart = {
        x: event.clientX,
        y: event.clientY,
        t: Date.now(),
      };
    };

    const isTapLikePointer = (event) => {
      if (!pointerStart) return true;
      const dx = event.clientX - pointerStart.x;
      const dy = event.clientY - pointerStart.y;
      return Math.hypot(dx, dy) <= 10 && Date.now() - pointerStart.t <= 900;
    };

    const stopMapEvent = (event) => {
      event.preventDefault?.();
      event.stopPropagation?.();
      event.stopImmediatePropagation?.();
    };

    const handleMapFeatureEventCapture = (event, source) => {
      console.log('[tap-debug][current-map] input', {
        source,
        x: event?.clientX,
        y: event?.clientY,
        interactionMode,
        teamActivityVisible: layerVisibility.teamActivity,
      });
      if (!isMapPointerEvent(event)) return false;
      if (Date.now() - lastFeatureEmitAt < 450) {
        stopMapEvent(event);
        console.log('[tap-debug][current-map] blocked by debounce', { source });
        return true;
      }
      if (source !== 'click' && !isTapLikePointer(event)) return false;

      const domFeature = featureFromEvent(event);
      if (domFeature) {
        console.log('[tap-debug][current-map] domFeature', {
          source,
          id: domFeature.id,
          layerId: domFeature.layerId,
          kind: domFeature.kind,
          title: domFeature.title,
        });
        if (interactionMode === 'select-area') {
          if (isAreaFeature(domFeature)) {
            console.log('[current-map] area feature click', {
              source,
              id: domFeature.id,
              layerId: domFeature.layerId,
              title: domFeature.title,
              interactionMode,
            });
            stopMapEvent(event);
            emitFeature(domFeature);
            return true;
          }
          if (isIconInspectionFeature(domFeature)) {
            console.log('[current-map] ignored DOM feature in select-area mode', {
              source,
              id: domFeature.id,
              layerId: domFeature.layerId,
              kind: domFeature.kind,
            });
          }
          const areaFeature = hitTestAreaSelection(event);
          if (areaFeature) {
            console.log('[current-map] area hit featureSelect', {
              source,
              id: areaFeature.id,
              layerId: areaFeature.layerId,
              title: areaFeature.title,
            });
            stopMapEvent(event);
            emitFeature(areaFeature);
            return true;
          }
          console.log('[current-map] select-area click ignored: no area feature', { source });
          return false;
        }

        if (interactionMode === 'inspect-area' && isAreaFeature(domFeature)) {
          console.log('[current-map] ignored area polygon in inspect-area mode', {
            source,
            id: domFeature.id,
            layerId: domFeature.layerId,
            kind: domFeature.kind,
          });
          stopMapEvent(event);
          return true;
        }

        if (interactionMode === 'inspect-area' && !isIconInspectionFeature(domFeature)) {
          console.log('[current-map] ignored non-inspection DOM feature', {
            source,
            id: domFeature.id,
            layerId: domFeature.layerId,
            kind: domFeature.kind,
            interactionMode,
          });
          stopMapEvent(event);
          return true;
        }

        if (
          (domFeature.layerId === 'teamActivity' || domFeature.category === 'teamActivity') &&
          !layerVisibility.teamActivity
        ) {
          console.log('[current-map] ignored DOM teamActivity feature: hidden', {
            source,
            id: domFeature.id,
          });
          stopMapEvent(event);
          return true;
        }
        console.log('[current-map] data-feature click', {
          source,
          id: domFeature.id,
          layerId: domFeature.layerId,
          title: domFeature.title,
          interactionMode,
        });
        stopMapEvent(event);
        emitFeature(domFeature);
        return true;
      }

      if (interactionMode === 'select-area') {
        const areaFeature = hitTestAreaSelection(event);
        if (areaFeature) {
          console.log('[current-map] area hit featureSelect', {
            source,
            id: areaFeature.id,
            layerId: areaFeature.layerId,
            title: areaFeature.title,
          });
          stopMapEvent(event);
          emitFeature(areaFeature);
          return true;
        }
        console.log('[current-map] select-area click ignored: no area feature', { source });
        return false;
      }

      const evacFeature = hitTestEvacuationTargets(event);
      if (evacFeature) {
        console.log('[current-map] evacuation hit featureSelect', {
          source,
          id: evacFeature.id,
          layerId: evacFeature.layerId,
          title: evacFeature.title,
        });
        stopMapEvent(event);
        emitFeature(evacFeature);
        return true;
      }

      const teamFeature = hitTestTeamActivity(event);
      if (teamFeature) {
        console.log('[tap-debug][current-map] teamFeatureByHitTest', {
          source,
          id: teamFeature.id,
          layerId: teamFeature.layerId,
          title: teamFeature.title,
        });
        console.log('[current-map] teamActivity hit featureSelect', {
          source,
          id: teamFeature.id,
          layerId: teamFeature.layerId,
          title: teamFeature.title,
          teams: teamFeature.teams?.length,
        });
        stopMapEvent(event);
        emitFeature(teamFeature);
        return true;
      }

      const teamTarget = findTeamActivityTarget(event);
      if (teamTarget) {
        if (!layerVisibility.teamActivity) {
          console.log('[current-map] ignored teamActivity target: hidden', {
            source,
            featureId: teamTarget.getAttribute('data-feature-id'),
          });
          stopMapEvent(event);
          return true;
        }
        console.log('[current-map] teamActivity target detected; skip evacuation hit-test', {
          source,
          featureId: teamTarget.getAttribute('data-feature-id'),
          target: teamTarget.tagName,
        });
        return true;
      }

      console.log('[tap-debug][current-map] no-feature-detected', { source });
      return false;
    };

    const bindFeatureClicks = () => {
      console.log('[current-map] bindFeatureClicks registering handlers');

      document.addEventListener('pointerdown', (event) => {
        rememberPointerStart(event);
      }, true);

      document.addEventListener('pointerup', (event) => {
        if (!isMapPointerEvent(event)) return;
        handleMapFeatureEventCapture(event, 'pointerup');
      }, true);

      document.addEventListener('click', (event) => {
        if (!isMapPointerEvent(event)) return;
        if (!isTapLikePointer(event)) return;
        handleMapFeatureEventCapture(event, 'click');
      }, true);
    };

    const setInitialView = () => {
      try {
        const viewport = runtimeState.config?.initialViewport || defaultRuntimeConfig().initialViewport;
        svgMap.setGeoViewPort?.(
          Number(viewport.lat),
          Number(viewport.lon),
          Number(viewport.latSpan),
          Number(viewport.lonSpan),
          false,
        );
      } catch (error) {
        console.warn('[current-map] initial view failed', error);
      }
    };

    const init = () => {
      bindFeatureClicks();
      window.setTimeout(() => {
        setInitialView();
        notifyParent('runtime:ready', {
          engine: 'svgmap',
          regionId: runtimeState.regionId,
          runtimeConfigUrl: runtimeConfigUrlFor(runtimeState.regionId),
          initialViewport: runtimeState.config?.initialViewport,
          layers: ['baseArea', 'evacuation', 'teamActivity'],
        });
      }, 350);
    };

    const LAYER_ANIM_ID = {
      evacuation: 'layer-evacuation',
      teamActivity: 'layer-team-activity',
      baseArea: 'layer-base-area',
    };

    const findRootLayerAnimation = (animId) => {
      const rootDoc = svgMap.getSvgImages?.()?.root || window.svgImages?.root || document;
      return rootDoc?.getElementById?.(animId) || document.getElementById(animId);
    };

    const findLayerChildDocument = (animId) => {
      const images = svgMap.getSvgImages?.() || window.svgImages || {};
      const props = svgMap.getSvgImagesProps?.() || window.svgImagesProps || {};
      for (const [iid, prop] of Object.entries(props)) {
        if (prop?.rootLayer === animId || prop?.id === animId || prop?.title === animId) {
          return images[iid] || null;
        }
      }
      const anim = findRootLayerAnimation(animId);
      const about = anim?.getAttribute?.('about') || anim?.getAttribute?.('iid');
      return about ? images[about] || null : null;
    };

    const findLayerControllerWindows = (animId) => {
      const props = svgMap.getSvgImagesProps?.() || window.svgImagesProps || {};
      const controllers = [];
      const seen = new Set();
      for (const prop of Object.values(props)) {
        if (!prop?.controllerWindow) continue;
        if (prop.rootLayer !== animId && prop.id !== animId && prop.title !== animId) continue;
        if (seen.has(prop.controllerWindow)) continue;
        seen.add(prop.controllerWindow);
        controllers.push(prop.controllerWindow);
      }
      return controllers;
    };

    const setLayerVisible = (layerKey, visible) => {
      const normalizedLayerKey = layerKey === 'team-activity' ? 'teamActivity' : layerKey;
      const animId = LAYER_ANIM_ID[normalizedLayerKey];
      if (!animId) return;
      const nextVisible = Boolean(visible);
      layerVisibility[normalizedLayerKey] = nextVisible;
      if (normalizedLayerKey === 'teamActivity' && !nextVisible) {
        teamActivityHitTargets = [];
        areaSelectionTargets = [];
        console.log('[current-map] cleared teamActivity hitTargets because hidden');
      }
      if (normalizedLayerKey === 'evacuation' && !nextVisible) {
        evacuationHitTargets = [];
        console.log('[current-map] cleared evacuationHitTargets because hidden');
      }
      console.log('[current-map] map:setLayerVisible received', {
        layerKey: normalizedLayerKey,
        visible: nextVisible,
      });
      const visibility = nextVisible ? 'visible' : 'hidden';
      const display = nextVisible ? 'inline' : 'none';
      try {
        svgMap.setLayerVisibility?.(animId, nextVisible);
      } catch (error) {
        console.warn('[current-map] setLayerVisibility failed, falling back to DOM attrs', {
          layerId: normalizedLayerKey,
          animId,
          error,
        });
      }
      const anim = findRootLayerAnimation(animId);
      if (anim) {
        anim.setAttribute('visibility', visibility);
        anim.setAttribute('display', display);
        anim.setAttribute('opacity', nextVisible ? '1' : '0');
        if (anim.style) {
          anim.style.visibility = visibility;
          anim.style.display = display;
          anim.style.opacity = nextVisible ? '1' : '0';
        }
      }
      const childDoc = findLayerChildDocument(animId);
      const childRoot = childDoc?.documentElement;
      if (childRoot) {
        childRoot.setAttribute('visibility', visibility);
        childRoot.setAttribute('display', display);
        childRoot.setAttribute('opacity', nextVisible ? '1' : '0');
        if (childRoot.style) {
          childRoot.style.visibility = visibility;
          childRoot.style.display = display;
          childRoot.style.opacity = nextVisible ? '1' : '0';
        }
      }
      const message = {
        type: 'map:layerVisibilityChanged',
        layerKey: normalizedLayerKey,
        visible: nextVisible,
      };
      window.postMessage?.(message, window.location.origin);
      document.querySelectorAll('iframe').forEach((frame) => {
        try {
          frame.contentWindow?.postMessage?.(message, '*');
        } catch {}
      });
      const controllerWindows = findLayerControllerWindows(animId);
      controllerWindows.forEach((controllerWindow) => {
        try {
          controllerWindow?.postMessage?.(message, '*');
        } catch (error) {
          console.warn('[current-map] layer controller postMessage failed', {
            layerKey: normalizedLayerKey,
            animId,
            error,
          });
        }
      });
      svgMap.refreshScreen?.();
      console.log('[current-map] layer visibility changed', {
        layerKey: normalizedLayerKey,
        animId,
        visible: nextVisible,
        hasRootAnimation: Boolean(anim),
        hasChildDocument: Boolean(childDoc),
        controllerWindows: controllerWindows.length,
      });
    };

    const broadcastInteractionMode = () => {
      const message = {
        type: 'map:interactionModeChanged',
        interactionMode,
      };
      window.postMessage?.(message, window.location.origin);
      document.querySelectorAll('iframe').forEach((frame) => {
        try {
          frame.contentWindow?.postMessage?.(message, '*');
        } catch {}
      });
      Object.values(LAYER_ANIM_ID).forEach((animId) => {
        const controllerWindows = findLayerControllerWindows(animId);
        controllerWindows.forEach((controllerWindow) => {
          try {
            controllerWindow?.postMessage?.(message, '*');
          } catch (error) {
            console.warn('[current-map] interaction mode postMessage failed', {
              interactionMode,
              animId,
              error,
            });
          }
        });
      });
    };

    const setInteractionMode = (nextMode) => {
      const normalized = INTERACTION_MODES.has(nextMode) ? nextMode : 'inspect-area';
      if (interactionMode === normalized) {
        broadcastInteractionMode();
        return;
      }
      interactionMode = normalized;
      console.log('[current-map] interaction mode changed', {
        interactionMode,
      });
      if (interactionMode !== 'inspect-area') {
        teamActivityHitTargets = [];
        evacuationHitTargets = [];
        console.log('[current-map] cleared inspection hitTargets outside inspect-area');
      }
      if (interactionMode !== 'select-area') {
        areaSelectionTargets = [];
        console.log('[current-map] cleared area selection targets outside select-area');
      }
      broadcastInteractionMode();
    };

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin && event.origin !== 'null') {
        console.warn('[current-map] message rejected by origin', {
          origin: event.origin,
          selfOrigin: window.location.origin,
          type: event.data?.type,
        });
        return;
      }
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'map:setViewport') {
        const vp = msg.viewport;
        if (vp && Number.isFinite(Number(vp.lat)) && Number.isFinite(Number(vp.lon))) {
          try {
            svgMap.setGeoViewPort?.(
              Number(vp.lat), Number(vp.lon),
              Number(vp.latSpan), Number(vp.lonSpan),
              false,
            );
            console.log('[current-map] map:setViewport applied', vp);
          } catch (err) {
            console.warn('[current-map] map:setViewport failed', err);
          }
        }
        return;
      }

      if (msg.type === 'map:setCurrentLocation') {
        setCurrentLocationMarker(msg.location || msg.payload || msg);
        return;
      }

      if (msg.type === 'map:setLayerVisible' || msg.type === 'runtime:setLayerVisibility') {
        const layerKey = msg.layerKey || msg.layerId || msg.payload?.layerKey || msg.payload?.layerId;
        const visible = msg.visible ?? msg.payload?.visible;
        setLayerVisible(layerKey, visible);
        return;
      }

      if (msg.type === 'map:setInteractionMode') {
        setInteractionMode(msg.interactionMode || msg.payload?.interactionMode);
        return;
      }

      // evacuationLayer がデータ読み込み完了を通知してきた
      // layer内から直接 svgMap.refreshScreen() を呼ぶと #parseSVG の途中に
      // 再入してクラッシュするため、ここで setTimeout を挟んで安全に呼ぶ
      if (msg.type === 'evacuationLayer:dataReady' || msg.type === 'evacuationLayer:visibilityChanged') {
        console.log('[current-map] received', msg.type, '→ scheduling refreshScreen');
        window.setTimeout(() => {
          try {
            svgMap.refreshScreen?.();
            console.log('[current-map] refreshScreen called for', msg.type);
          } catch (err) {
            console.warn('[current-map] refreshScreen failed', err);
          }
        }, 80); // SVGMapの現在のparseSVGサイクルが終わるのを待つ
        return;
      }

      // Layer ready → send correct data URL + layer config + municipality filter
      if (msg.type === 'evacuationLayer:ready' || msg.type === 'teamActivityLayer:ready') {
        const isEvac = msg.type === 'evacuationLayer:ready';
        const layerId = isEvac ? 'evacuation' : 'teamActivity';
        const layerCfg = isEvac
          ? runtimeState.config?.layers?.evacuation
          : runtimeState.config?.layers?.teamActivity;
        const dataUrl = layerCfg?.dataUrl;
        if (dataUrl) {
          console.log('[current-map]', msg.type, '→ sending dataUrl', dataUrl);
          const urlMsg = { type: 'map:setDataUrl', layerId, url: dataUrl };
          document.querySelectorAll('iframe').forEach((frame) => {
            try { frame.contentWindow?.postMessage?.(urlMsg, '*'); } catch {}
          });
        }
        if (!isEvac) {
          const baseUrl = layerCfg?.baseAreaLayerUrl;
          const districtTemplate = layerCfg?.districtSvgUrlTemplate;
          if (baseUrl || districtTemplate) {
            const cfgMsg = { type: 'map:setLayerConfig', layerId: 'teamActivity', baseAreaLayerUrl: baseUrl, districtSvgUrlTemplate: districtTemplate };
            document.querySelectorAll('iframe').forEach((frame) => {
              try { frame.contentWindow?.postMessage?.(cfgMsg, '*'); } catch {}
            });
          }
        }
        const allowedCodes = runtimeState.municipalityCodes
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);
        if (allowedCodes.length > 0) {
          console.log('[current-map]', msg.type, '→ sending municipality filter', allowedCodes);
          const filterMsg = { type: 'map:setMunicipalityFilter', municipalityCodes: allowedCodes };
          document.querySelectorAll('iframe').forEach((frame) => {
            try { frame.contentWindow?.postMessage?.(filterMsg, '*'); } catch {}
          });
        }
        return;
      }

      if (msg.type === 'runtime:dataStatus') {
        const payload = msg.payload || {};
        emitDataStatus({
          key: payload.key || msg.key || 'runtimeData',
          label: payload.label || msg.label,
          source: payload.source || msg.source || 'fallback',
          url: payload.url || msg.url,
          online: payload.online,
          updatedAt: payload.updatedAt || payload.at,
          message: payload.message,
        });
        return;
      }

      if (msg.type === 'evacuation:hitTargets') {
        evacuationHitTargets = interactionMode === 'inspect-area' && layerVisibility.evacuation && Array.isArray(msg.targets)
          ? msg.targets
          : [];
        console.log('[current-map] evacuation hitTargets received', {
          count: evacuationHitTargets.length,
          zoom: msg.zoom,
          sample: evacuationHitTargets[0] || null,
        });
        return;
      }

      if (msg.type === 'teamActivity:hitTargets') {
        teamActivityHitTargets = interactionMode === 'inspect-area' && Array.isArray(msg.targets) ? msg.targets : [];
        console.log('[current-map] teamActivity hitTargets received', {
          count: teamActivityHitTargets.length,
          zoom: msg.zoom,
          interactionMode,
          sample: teamActivityHitTargets[0] || null,
          ids: teamActivityHitTargets.map((target) => target.id),
        });
        return;
      }

      if (msg.type === 'teamActivity:areaTargets') {
        areaSelectionTargets = interactionMode === 'select-area' && Array.isArray(msg.targets)
          ? msg.targets
          : [];
        console.log('[current-map] area selection targets received', {
          count: areaSelectionTargets.length,
          zoom: msg.zoom,
          interactionMode,
        });
        return;
      }

      if (msg.type === 'runtime:featureSelect') {
        const feature = normalizeFeature(msg.payload || msg.feature);
        if (feature?.layerId === 'teamActivity' && !layerVisibility.teamActivity) {
          console.log('[current-map] ignored teamActivity featureSelect: hidden', {
            id: feature.id,
          });
          return;
        }
        if (feature?.layerId === 'teamActivity') {
          console.log('[current-map] teamActivity featureSelect received', {
            id: feature.id,
            layerId: feature.layerId,
            title: feature.title,
            teams: feature.teams?.length,
          });
        }
        if (feature) emitFeature(feature);
      }
    });

    await loadRuntimeConfig();
    console.log('[current-map] data-src set to', runtimeState.config.containerUrl);
    const svgMapModule = await import('/map/vendor/svgmapjs/SVGMapLv0.1_r18module.js');
    svgMap = svgMapModule.svgMap;
    window.svgMap = svgMap;
    svgMap.initLoad();
    init();
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>避難所 WebApp Layer</title>
</head>
<body>
<script type="module">
import { MAP_MESSAGES } from '../../shared/mapMessages.js';
import { fetchWithRuntimeCache } from '../../shared/runtimeCache.js';

(() => {
  // SVGMap が exec=hiddenOnLayerLoad を呼び出すことへの対応
  // (evacuationLayer.svg の data-controller 属性で指定されている)
  // これがないと parseSVG / dynamicLoad が NotFoundError になる
  window.hiddenOnLayerLoad = () => {
    console.log('[evacuationLayer] hiddenOnLayerLoad called by SVGMap');
  };
  const EVACUATION_VISUAL_VERSION = 'evacuation-svg-image-icons-all-zooms-2026-05-01.1';
  console.log(`[evacuationLayer] VERSION ${EVACUATION_VISUAL_VERSION}`);
  const XLINK_NS = 'http://www.w3.org/1999/xlink';
  const state = {
    dataUrl: '/map/data/evacuation/okayama.json',
    records: [],
    loaded: false,
    loading: false,
    visible: true,
    interactionMode: 'inspect-area',
    signature: '',
    selectedMunicipalityCodes: new Set(),
  };

  let selectedFeatureId = null;
  let lastMarkerEmitAt = 0;
  let loadSeq = 0;

  const emitDataStatus = (payload) => {
    window.parent?.postMessage?.({
      type: MAP_MESSAGES.runtimeDataStatus,
      payload: {
        online: navigator.onLine,
        updatedAt: new Date().toISOString(),
        ...payload,
      },
    }, window.location.origin);
  };

  const parseHashParams = () => {
    const raw = String(window.svgImageProps?.hash || window.svgImageProps?.Path?.split('#')?.[1] || '');
    const params = new URLSearchParams(raw.replace(/^#/, ''));
    state.dataUrl = params.get('data') || state.dataUrl;
    const codesParam = params.get('municipalityCodes') || '';
    if (codesParam) {
      state.selectedMunicipalityCodes = new Set(codesParam.split(',').filter(Boolean));
    }
  };

  const asNumber = (value) => {
    const num = Number(value);
    return Number.isFinite(num) ? num : null;
  };

  const normalizePayload = (payload) => {
    if (Array.isArray(payload)) return payload;
    if (Array.isArray(payload?.items)) return payload.items;
    if (Array.isArray(payload?.records)) return payload.records;
    return [];
  };

  const loadRecords = async () => {
    if (state.loaded || state.loading) return;
    state.loading = true;
    const seq = ++loadSeq;
    try {
      const { data: payload, source } = await fetchWithRuntimeCache(state.dataUrl, 'evacuation', {
        label: '避難所',
        emitDataStatus,
        logLabel: 'evacuationLayer',
      });
      if (seq !== loadSeq) { state.loading = false; return; }
      state.records = normalizePayload(payload)
        .map((record, index) => {
          const lat = asNumber(record.lat ?? record.latitude);
          const lon = asNumber(record.lon ?? record.lng ?? record.longitude);
          if (lat == null || lon == null) return null;
          const title = String(record.title || record.name || `避難所 ${index + 1}`);
          return {
            ...record,
            id: String(record.id || `evacuation:${title}`),
            layerId: 'evacuation',
            kind: 'poi',
            title,
            lat,
            lon,
            lodRank: asNumber(record.lodRank) ?? 5,
            municipalityCode: String(record.municipalityCode || ''),
          };
        })
        .filter(Boolean);
      const withCode = state.records.filter((r) => r.municipalityCode).length;
      console.log(`[evacuationLayer] fetched: ${state.dataUrl}`, { source });
      console.log(`[evacuationLayer] records: ${state.records.length} total, ${withCode} with municipalityCode, ${state.records.length - withCode} without`);
      state.loaded = true;
    } catch (error) {
      if (seq !== loadSeq) { state.loading = false; return; }
      console.error('[evacuationLayer] load failed', error);
      state.records = [];
      state.loaded = true;
    } finally {
      if (seq === loadSeq) state.loading = false;
    }

    if (seq !== loadSeq) return;
    // ★ Fix: loadRecords完了後の再描画はparentに委譲
    console.log('[evacuationLayer] loadRecords done → notifying parent for refresh');
    state.signature = '';
    window.parent?.postMessage?.({ type: MAP_MESSAGES.evacuationLayerDataReady }, window.location.origin);
  };

  const getZoomLevel = () => {
    const scale = Number(window.svgImageProps?.scale);
    if (Number.isFinite(scale) && scale > 0) return Math.floor(Math.LOG2E * Math.log(scale) + 7.25);
    return 13;
  };

  const getMaxLodRank = (zoom) => {
    if (zoom < 9.2) return 0;
    if (zoom < 10.2) return 1;
    if (zoom < 11.2) return 2;
    if (zoom < 12.2) return 3;
    if (zoom < 13.2) return 4;
    return 5;
  };

  const normalizeStatus = (status) => {
    const value = String(status || '').trim().toLowerCase();
    if (['open', 'opened', 'active', 'available', '利用可', '開設中'].includes(value)) return 'open';
    if (['limited', 'crowded', 'near_full', '要確認'].includes(value)) return 'limited';
    if (['full', '満員'].includes(value)) return 'full';
    if (['closed', 'close', 'inactive', '閉鎖'].includes(value)) return 'closed';
    return 'unknown';
  };

  const shelterIconHrefForStatus = (status) => {
    const normalized = normalizeStatus(status);
    if (normalized === 'open') return '/map/icons/shelter-open.png';
    if (normalized === 'limited') return '/map/icons/shelter-limited.png';
    if (normalized === 'full') return '/map/icons/shelter-full.png';
    if (normalized === 'closed') return '/map/icons/shelter-closed.png';
    return '/map/icons/shelter-default.png';
  };

  const inView = (record, box) => {
    const padX = Number(box.width) * 0.08;
    const padY = Number(box.height) * 0.08;
    return record.lon >= box.x - padX &&
      record.lon <= box.x + box.width + padX &&
      record.lat >= box.y - padY &&
      record.lat <= box.y + box.height + padY;
  };

  const payloadFor = (record) => ({
    enabled: true,
    id: record.id,
    layerId: 'evacuation',
    title: record.title,
    kind: 'dynamic',
    type: 'evacuation',
    category: 'evacuation',
    summary: record.summary || record.subtitle || '避難所',
    description: record.description || record.summary || '避難所',
    address: record.address || '',
    status: normalizeStatus(record.status),
    capacity: record.capacity ?? record.capacityText ?? record.estimatedCapacity ?? undefined,
    facilityType: record.facilityType || record.type || record.category || undefined,
    source: record.source || record.sourceName || undefined,
    municipalityCode: record.municipalityCode || undefined,
    lat: record.lat,
    lon: record.lon,
    feature: record,
  });

  const EVACUATION_STATUS_TABLE = {
    open: { label: '開設中', tone: 'green', icon: '/map/icons/shelter-open.png' },
    limited: { label: '混雑・要確認', tone: 'amber', icon: '/map/icons/shelter-limited.png' },
    full: { label: '満員', tone: 'red', icon: '/map/icons/shelter-full.png' },
    closed: { label: '閉鎖', tone: 'gray', icon: '/map/icons/shelter-closed.png' },
    unknown: { label: '状況不明', tone: 'blue', icon: '/map/icons/shelter-default.png' },
  };

  const detailText = (value) => {
    if (value === null || value === undefined) return null;
    const text = String(value).trim();
    return text.length > 0 ? text : null;
  };

  const detailCapacityText = (value) => {
    if (typeof value === 'number' && Number.isFinite(value)) return value + '人';
    return detailText(value);
  };

  const detailLatLonText = (lat, lon) => {
    const la = typeof lat === 'number' ? lat : Number(lat);
    const lo = typeof lon === 'number' ? lon : Number(lon);
    if (!Number.isFinite(la) || !Number.isFinite(lo)) return null;
    return la.toFixed(5) + ', ' + lo.toFixed(5);
  };

  const googleMapsDirectionsHref = (lat, lon) => {
    const la = typeof lat === 'number' ? lat : Number(lat);
    const lo = typeof lon === 'number' ? lon : Number(lon);
    if (!Number.isFinite(la) || !Number.isFinite(lo)) return null;
    return 'https://www.google.com/maps/dir/?api=1&destination=' + la + ',' + lo;
  };

  const evacuationStatusDetail = (status) =>
    EVACUATION_STATUS_TABLE[normalizeStatus(status)] || EVACUATION_STATUS_TABLE.unknown;

  const buildEvacuationFeatureDetail = (feature) => {
    if (feature == null) return null;
    if (feature.id == null || feature.id === '') return null;
    const titleText = detailText(feature.title);
    if (titleText === null) return null;

    const statusInfo = evacuationStatusDetail(feature.status);
    const lat = typeof feature.lat === 'number' ? feature.lat : Number(feature.lat);
    const lon = typeof feature.lon === 'number' ? feature.lon : Number(feature.lon);
    const rows = [
      { label: '住所', value: detailText(feature.address) },
      { label: '収容人数', value: detailCapacityText(feature.capacity) },
      { label: '施設種別', value: detailText(feature.facilityType) },
      { label: '出典', value: detailText(feature.source) },
      { label: '自治体', value: detailText(feature.municipalityCode) },
      { label: '緯度経度', value: detailLatLonText(lat, lon) },
    ].filter((row) => row.value !== null);

    const actions = [];
    const mapsHref = googleMapsDirectionsHref(lat, lon);
    if (mapsHref) actions.push({ label: 'Google マップで開く', href: mapsHref });

    return {
      id: String(feature.id),
      title: titleText,
      accent: 'green',
      badge: { label: statusInfo.label, tone: statusInfo.tone },
      icon: { src: statusInfo.icon, alt: statusInfo.label + ' の避難所' },
      rows,
      actions: actions.length > 0 ? actions : undefined,
    };
  };

  const renderEvacuationDetail = (feature) => {
    if (!feature) return;
    selectedFeatureId = feature.id || null;
    state.signature = '';
    const detail = buildEvacuationFeatureDetail(feature);
    if (!detail) return;
    window.parent?.postMessage?.({
      type: MAP_MESSAGES.runtimeFeatureDetail,
      payload: { layerId: 'evacuation', detail },
    }, window.location.origin);
  };

  // 本家(notoRoad)寄せ: SVGMap の POI クリックを setShowPoiProperty で差し替える。
  // SVGMap は POI(use) クリック時、標準ポップアップの代わりにこの関数を target=<use>
  // 付きで呼ぶ。ここで data-feature を読んで React 側へ runtimeFeatureDetail を流し、
  // showModal を呼ばないことで SVGMap 標準ポップアップを抑止する。
  const customShowPoiProperty = (target) => {
    console.log('[evacuationLayer] customShowPoiProperty called', {
      tag: target?.tagName,
      id: target?.getAttribute?.('data-feature-id'),
      title: target?.getAttribute?.('xlink:title') || target?.getAttribute?.('title'),
      content: target?.getAttribute?.('content'),
      hasDataFeature: Boolean(target?.getAttribute?.('data-feature')),
      layerID: window.layerID,
    });
    try {
      const raw = target?.getAttribute?.('data-feature');
      const feature = raw ? JSON.parse(raw) : null;
      if (feature) renderEvacuationDetail(feature);
    } catch (error) {
      console.error('[evacuationLayer] customShowPoiProperty failed', error);
    }
    // showModal は呼ばない → SVGMap 標準ポップアップは表示しない
  };

  // アイコンのシンボル定義（<defs> 内の <g><image>）を動的生成する。
  // ※既知の課題: getSymbols() は #dynamicLoad の冒頭(preRenderより前)に走るため、
  //   ここで draw 内から defs を足すと「その回」のシンボル表に載らず、<use> は次の
  //   パスでしか解決されない（初回はパンするまで hit-test 未登録）。恒久対処は別途。
  const ICON_STATUSES = ['open', 'limited', 'full', 'closed', 'unknown'];

  const ensureIconDefs = () => {
    const svg = window.svgImage;
    if (!svg?.createElement) return;
    if (svg.getElementById?.('evac-icon-open')) return; // 構築済み
    const defs = svg.getElementsByTagName?.('defs')?.[0];
    if (!defs) return;
    for (const status of ICON_STATUSES) {
      const href = shelterIconHrefForStatus(status);
      for (const variant of [{ suffix: '', size: 26 }, { suffix: '-sel', size: 30 }]) {
        const g = svg.createElement('g');
        g.setAttribute('id', `evac-icon-${status}${variant.suffix}`);
        const half = variant.size / 2;
        const img = svg.createElement('image');
        img.setAttribute('href', href);
        img.setAttributeNS(XLINK_NS, 'xlink:href', href);
        img.setAttribute('x', String(-half));
        img.setAttribute('y', String(-half));
        img.setAttribute('width', String(variant.size));
        img.setAttribute('height', String(variant.size));
        img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        g.appendChild(img);
        defs.appendChild(g);
      }
    }
  };

  // === POI ノードの再利用管理 ===
  // draw() のたびに <use> を全削除して作り直すと、SVGMap が保持する描画済み img の
  // ソース <use> が消え、getSvgTarget() が null → getHyperLink(null) でクラッシュする。
  // そこで feature id をキーに <use> ノードを使い回し、属性更新と表示/非表示の
  // 切り替えだけ行う（削除しない）。
  const poiNodeById = new Map();
  // hidden DOM の上限。超えたら「画面外(hidden)で最も古い」ノードから削除する。
  // visible/選択中は削除しない。hidden ノードは SVGMap が rendered img をパージ済みなので
  // 削除しても getSvgTarget null クラッシュは起きない（in-view の削除のみが危険）。
  const POI_NODE_CAP = 1200;

  const evictHiddenPOIs = (visibleIds) => {
    if (poiNodeById.size <= POI_NODE_CAP) return 0;
    let evicted = 0;
    // Map は挿入順＝「再表示で末尾へ詰め直す」LRU 順なので、先頭から古い hidden を消す。
    for (const [id, node] of poiNodeById) {
      if (poiNodeById.size <= POI_NODE_CAP) break;
      if (visibleIds.has(id) || id === selectedFeatureId) continue;
      if (node.getAttribute?.('data-hidden') !== 'true') continue;
      node.remove?.();
      poiNodeById.delete(id);
      evicted++;
    }
    return evicted;
  };

  const createPoiUse = (record) => {
    const cx = (record.lon * 100).toFixed(5);
    const cy = (-record.lat * 100).toFixed(5);
    const poi = window.svgImage.createElement('use');
    poi.setAttribute('x', '0');
    poi.setAttribute('y', '0');
    poi.setAttribute('transform', `ref(svg,${cx},${cy})`); // 位置は feature 固定
    poi.setAttribute('data-feature-id', record.id);
    poi.setAttribute('data-layer-id', 'evacuation');
    poi.setAttribute('data-kind', 'dynamic');
    return poi;
  };

  // 状態(status/選択/inspect)とメタデータ(content/data-feature)を更新する。
  const updatePoiUse = (poi, record, inspectMode) => {
    const isSelected = record.id === selectedFeatureId;
    const status = normalizeStatus(record.status);
    const symbolId = `#evac-icon-${status}${isSelected ? '-sel' : ''}`;
    poi.setAttribute('href', symbolId);
    poi.setAttributeNS(XLINK_NS, 'xlink:href', symbolId);
    poi.setAttribute('xlink:title', record.title);
    poi.setAttribute('data-title', record.title);
    poi.setAttribute('content', contentFor(record));
    poi.setAttribute('data-feature', JSON.stringify(payloadFor(record)));
    poi.setAttribute('opacity', inspectMode ? (isSelected ? '1' : '0.94') : '0.35');
  };

  const showPoi = (poi) => {
    poi.removeAttribute('display');
    poi.setAttribute('visibility', 'visible');
    poi.setAttribute('pointer-events', 'visiblePainted');
    poi.removeAttribute('data-hidden');
  };
  const hidePoi = (poi) => {
    poi.setAttribute('display', 'none');
    poi.setAttribute('visibility', 'hidden');
    poi.setAttribute('pointer-events', 'none');
    poi.setAttribute('data-hidden', 'true');
  };

  const hideAllPOIs = () => { for (const node of poiNodeById.values()) hidePoi(node); };
  // データ差し替え時のみ全消去（feature 集合が変わるため）。
  const clearAllPOIs = () => {
    for (const node of poiNodeById.values()) node.remove?.();
    poiNodeById.clear();
  };

  // SVG ルートの property="id,title,address,status,municipalityCode,summary" に対応する
  // content(CSV) を生成。値中のカンマ/改行は列ズレ防止のため空白化する。
  const csvCell = (value) => String(value ?? '').replace(/[\r\n,]/g, ' ').trim();
  const contentFor = (record) => [
    record.id,
    record.title,
    record.address || '',
    normalizeStatus(record.status),
    record.municipalityCode || '',
    record.summary || '避難所',
  ].map(csvCell).join(',');

  const draw = () => {
    parseHashParams();
    if (!state.visible) {
      hideAllPOIs();
      state.signature = '';
      console.log('[evacuationLayer] draw skipped: hidden');
      return;
    }
    if (!state.loaded) return;

    const geoViewBox = window.svgMap?.getGeoViewBox?.();
    if (!geoViewBox || !Number.isFinite(Number(geoViewBox.width))) return;

    const zoom = getZoomLevel();
    const maxRank = getMaxLodRank(zoom);
    const maxPoints = 400;
    const muniFilterKey = [...state.selectedMunicipalityCodes].sort().join(',');
    const signature = [
      'use-poi-v1',
      maxRank,
      Number(geoViewBox.x).toFixed(4),
      Number(geoViewBox.y).toFixed(4),
      Number(geoViewBox.width).toFixed(4),
      Number(geoViewBox.height).toFixed(4),
      state.records.length,
      selectedFeatureId || '',
      EVACUATION_VISUAL_VERSION,
      state.visible ? 'visible' : 'hidden',
      state.interactionMode,
      muniFilterKey,
    ].join('|');
    if (state.signature === signature) return;
    state.signature = signature;

    // defs(シンボル) は load 時 initIconDefs() で一度だけ生成済み（draw では作らない）。
    const root = window.svgImage?.documentElement;
    if (!root || !window.svgImage?.createElement) return;

    // Apply municipality filter before viewport filter for efficiency
    const filteredByMuni = state.selectedMunicipalityCodes.size > 0
      ? state.records.filter((r) => !r.municipalityCode || state.selectedMunicipalityCodes.has(r.municipalityCode))
      : state.records;

    const inViewRecords = filteredByMuni.filter((record) => inView(record, geoViewBox));
    const lodFilteredRecords = inViewRecords.filter((record) => Number(record.lodRank) <= maxRank);

    const fallbackMinVisible = 48;

    // 市区町村を round-robin でサンプリング（先頭スライスによる特定市区町村偏りを防ぐ）
    const sampleByMunicipality = (recs, limit) => {
      const groups = new Map();
      for (const r of recs) {
        const key = r.municipalityCode || '_';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      const queues = [...groups.values()];
      const out = [];
      for (let i = 0; out.length < limit; i++) {
        let added = false;
        for (const q of queues) {
          if (i < q.length && out.length < limit) { out.push(q[i]); added = true; }
        }
        if (!added) break;
      }
      return out;
    };

    let nearestRecords = null;
    if (lodFilteredRecords.length === 0 && inViewRecords.length === 0) {
      const centerLon = Number(geoViewBox.x) + Number(geoViewBox.width) / 2;
      const centerLat = Number(geoViewBox.y) + Number(geoViewBox.height) / 2;
      nearestRecords = sampleByMunicipality(
        [...filteredByMuni].sort((a, b) => Math.hypot(a.lon - centerLon, a.lat - centerLat) - Math.hypot(b.lon - centerLon, b.lat - centerLat)),
        fallbackMinVisible,
      );
    }
    const records =
      lodFilteredRecords.length > 0 ? lodFilteredRecords.slice(0, maxPoints)
      : inViewRecords.length > 0   ? sampleByMunicipality(inViewRecords, fallbackMinVisible)
      : (nearestRecords || []);

    console.log('[evacuationLayer] draw', { zoom, maxRank, recordsTotal: state.records.length, filteredByMunicipality: filteredByMuni.length, inView: inViewRecords.length, rendering: records.length, selectedMunicipalityCodes: [...state.selectedMunicipalityCodes] });

    const inspectMode = state.interactionMode === 'inspect-area';

    // === 差分更新（ノード再利用）===
    // 既存 <use> は削除せず属性更新＋表示。新規のみ append。対象外は隠す（削除しない）。
    // これで SVGMap の「描画済み img → ソース <use>」逆引きが壊れず、クリック時の
    // getSvgTarget null クラッシュを防ぐ。
    const visibleIds = new Set();
    let createdCount = 0;
    for (const record of records) {
      visibleIds.add(record.id);
      let node = poiNodeById.get(record.id);
      if (!node || !node.isConnected) {
        node = createPoiUse(record);
        root.appendChild(node);
        createdCount++;
      }
      // 末尾へ詰め直して LRU 順を維持（再表示＝most-recently-used）
      poiNodeById.delete(record.id);
      poiNodeById.set(record.id, node);
      updatePoiUse(node, record, inspectMode);
      showPoi(node);
    }
    let hiddenCount = 0;
    for (const [id, node] of poiNodeById) {
      if (!visibleIds.has(id)) { hidePoi(node); hiddenCount++; }
    }
    const evicted = evictHiddenPOIs(visibleIds);
    console.log('[evacuationLayer] POIs reconciled', { rendering: records.length, created: createdCount, hidden: hiddenCount, evicted, total: poiNodeById.size });
  };

  window.preRenderFunction = draw;
  window.addEventListener('message', (event) => {
    const msg = event.data || {};
    if (msg.type === MAP_MESSAGES.mapInteractionModeChanged) {
      state.interactionMode = msg.interactionMode || msg.payload?.interactionMode || 'inspect-area';
      state.signature = '';
      console.log('[evacuationLayer] interaction mode changed', state.interactionMode);
      return;
    }
    if (msg.type === MAP_MESSAGES.mapLayerVisibilityChanged) {
      const layerKey = msg.layerKey || msg.payload?.layerKey || msg.payload?.layerId;
      if (layerKey !== 'evacuation') return;
      state.visible = msg.visible !== false;
      state.signature = '';
      console.log('[evacuationLayer] visibility changed', state.visible);
      if (!state.visible) {
        selectedFeatureId = null;
        hideAllPOIs();
      }
      // refreshScreen はparentに委譲（layer内から直接呼ぶと再入クラッシュ）
      console.log('[evacuationLayer] visibility changed → notifying parent for refresh');
      window.parent?.postMessage?.({ type: MAP_MESSAGES.evacuationLayerVisibilityChanged, visible: state.visible }, window.location.origin);
      return;
    }
    if (msg.type === MAP_MESSAGES.mapSetMunicipalityFilter) {
      const codes = Array.isArray(msg.municipalityCodes) ? msg.municipalityCodes : [];
      state.selectedMunicipalityCodes = new Set(codes);
      state.signature = '';
      console.log('[evacuationLayer] municipality filter set', codes);
      return;
    }
    if (msg.type === MAP_MESSAGES.mapShowEvacuationFeature) {
      const feature = msg.feature;
      if (feature) {
        console.log('[evacuationLayer] map:showEvacuationFeature', feature.id);
        renderEvacuationDetail(feature);
        selectedFeatureId = feature.id || null;
        state.signature = '';
      }
      return;
    }
    if (msg.type === MAP_MESSAGES.mapSetDataUrl && (msg.layerId === 'evacuation' || !msg.layerId)) {
      const newUrl = msg.url || msg.dataUrl;
      if (!newUrl) return;
      if (newUrl !== state.dataUrl) {
        console.log('[evacuationLayer] setDataUrl', newUrl);
        state.dataUrl = newUrl;
        state.records = [];
        state.loaded = false;
        state.loading = false;
        loadSeq++;
        state.signature = '';
        clearAllPOIs(); // feature 集合が変わるため再利用ノードは全消去
      }
      void loadRecords();
      return;
    }
  });
  // SVGMap webapp レイヤーのフレームワークが注入する layerID(=自レイヤーの文書ID)を
  // 使って、自レイヤーの POI 表示関数だけを差し替える（他レイヤーには影響しない）。
  let registerAttempt = 0;
  const registerPoiHandler = () => {
    registerAttempt++;
    const layerId = window.layerID;
    const ok = Boolean(window.svgMap?.setShowPoiProperty && layerId);
    if (ok) {
      window.svgMap.setShowPoiProperty(customShowPoiProperty, layerId);
    }
    console.log('[evacuationLayer] setShowPoiProperty registered', {
      layerID: layerId,
      hasSvgMap: Boolean(window.svgMap),
      hasSetShowPoiProperty: Boolean(window.svgMap?.setShowPoiProperty),
      attempt: registerAttempt,
      ok,
    });
    return ok;
  };

  // シンボル定義は draw()(preRender)より前＝初回 getSymbols より前に window.svgImage へ
  // 入れておく必要がある（getSymbols は #dynamicLoad 冒頭で走るため）。データ取得は非同期
  // なので、svgImage 注入を待って init 時に一度だけ defs を構築する。
  const initIconDefs = () => {
    if (!window.svgImage?.getElementsByTagName) return false;
    ensureIconDefs();
    const built = Boolean(window.svgImage.getElementById?.('evac-icon-open'));
    console.log('[evacuationLayer] initIconDefs', { hasSvgImage: true, built });
    return built;
  };

  window.addEventListener('load', () => {
    parseHashParams();
    // svgMap / layerID / svgImage の注入タイミングに依存しうるため数回リトライする
    const tryInit = () => {
      const a = registerPoiHandler();
      const b = initIconDefs();
      return a && b;
    };
    if (!tryInit()) {
      let tries = 0;
      const timer = setInterval(() => {
        if (tryInit() || ++tries >= 30) clearInterval(timer);
      }, 100);
    }
    window.parent?.postMessage?.({ type: MAP_MESSAGES.evacuationLayerReady }, window.location.origin);
  });
})();
</script>
</body>

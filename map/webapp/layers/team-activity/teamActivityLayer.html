<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>チーム活動 WebApp Layer</title>
</head>
<body>
<script>
(() => {
  window.hiddenOnLayerLoad = () => {
    console.log('[teamActivityLayer] hiddenOnLayerLoad called by SVGMap');
  };

  const TEAM_ACTIVITY_VISUAL_VERSION = 'team-activity-svg-image-icons-2026-05-01.1';
  console.log(`[teamActivityLayer] VERSION ${TEAM_ACTIVITY_VISUAL_VERSION}`);

  const DRAW_GROUP_ID = 'team-activity-webapp-draw';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XLINK_NS = 'http://www.w3.org/1999/xlink';
  const DATA_CACHE_NAME = 'svgmap-runtime-data-v1';

  const state = {
    dataUrl: '/map/data/team-activity/okayama.json',
    baseAreaUrl: '',
    districtSvgUrlTemplate: '',
    records: [],
    districts: [],        // municipality-level: { code, title, paths: string[], centroid }
    districtsByCode: {},  // 丁目-level: code → [{internalD, poly, name, centroid}] | null
    codesLoaded: new Set(),
    codesLoading: new Set(),
    loaded: false,
    loading: false,
    baseLoaded: false,
    baseLoading: false,
    visible: true,
    interactionMode: 'inspect-area',
    signature: '',
    selectedMunicipalityCodes: new Set(),
  };

  let selectedFeatureId = null;
  let pointerDownInfo = null;
  let lastEmitAt = 0;
  let loadSeq = 0;

  const emitDataStatus = (payload) => {
    window.parent?.postMessage?.({
      type: 'runtime:dataStatus',
      payload: {
        online: navigator.onLine,
        updatedAt: new Date().toISOString(),
        ...payload,
      },
    }, '*');
  };

  const fetchWithRuntimeCache = async (url, key, { responseType = 'json', label } = {}) => {
    const absoluteUrl = new URL(url, window.location.href).href;
    const request = new Request(absoluteUrl, { method: 'GET' });
    try {
      const response = await fetch(absoluteUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      if ('caches' in window) {
        const cache = await caches.open(DATA_CACHE_NAME);
        await cache.put(request, response.clone());
      }
      emitDataStatus({ key, label, source: 'network', url });
      return {
        source: 'network',
        data: responseType === 'text' ? await response.text() : await response.json(),
      };
    } catch (error) {
      if ('caches' in window) {
        const cache = await caches.open(DATA_CACHE_NAME);
        const cached = await cache.match(request);
        if (cached) {
          console.warn('[teamActivityLayer] using cached data', { key, url, error });
          emitDataStatus({ key, label, source: 'cache', url, message: 'ネットワーク取得失敗のため保存済みを表示' });
          return {
            source: 'cache',
            data: responseType === 'text' ? await cached.text() : await cached.json(),
          };
        }
      }
      emitDataStatus({ key, label, source: 'fallback', url, message: 'キャッシュなし' });
      throw error;
    }
  };

  const createSvgElement = (tagName) =>
    window.svgImage?.createElement?.(tagName) || window.svgImage?.createElementNS?.(SVG_NS, tagName);

  const safeHref = (win) => {
    try {
      return win?.location?.href || '';
    } catch {
      return 'cross-origin-or-inaccessible';
    }
  };

  const parseHashParams = () => {
    const raw = String(window.svgImageProps?.hash || window.svgImageProps?.Path?.split('#')?.[1] || '');
    const params = new URLSearchParams(raw.replace(/^#/, ''));
    state.dataUrl = params.get('data') || state.dataUrl;
    state.baseAreaUrl = params.get('baseArea') || params.get('baseAreaLayerUrl') || state.baseAreaUrl;
    state.districtSvgUrlTemplate = params.get('districtSvgUrlTemplate') || state.districtSvgUrlTemplate;
    const codesParam = params.get('municipalityCodes') || '';
    if (codesParam) {
      state.selectedMunicipalityCodes = new Set(codesParam.split(',').filter(Boolean));
    }
  };

  const normalizePayload = (payload) =>
    Array.isArray(payload) ? payload : (payload?.items || payload?.records || []);

  // Convert SVG path d from raw lat/lon to SVGMap internal space (x=lon*100, y=-lat*100)
  const toInternal = (d) =>
    d.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g, (_, x, y) =>
      `${(parseFloat(x) * 100).toFixed(3)} ${(parseFloat(y) * -100).toFixed(3)}`
    );

  // Extract [lon, lat] vertex pairs from raw d attribute
  const parsePoly = (d) => {
    const pts = [];
    for (const [, x, y] of d.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)) {
      pts.push([parseFloat(x), parseFloat(y)]);
    }
    return pts;
  };

  // Ray-casting point-in-polygon (lon/lat space, pts = [[lon, lat], ...])
  const pip = (lon, lat, pts) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1];
      const xj = pts[j][0], yj = pts[j][1];
      if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
        inside = !inside;
      }
    }
    return inside;
  };

  // Centroid of polygon vertices in SVGMap internal space
  const centroidOfPoly = (pts) => {
    if (!pts.length) return null;
    let slon = 0, slat = 0;
    for (const [lon, lat] of pts) { slon += lon; slat += lat; }
    return { cx: (slon / pts.length) * 100, cy: -(slat / pts.length) * 100 };
  };

  // Centroid of LONGEST internal-space path string (for municipality-level fallback)
  const centroidOf = (paths) => {
    const main = paths.reduce((a, b) => (a.length >= b.length ? a : b), '');
    let sx = 0, sy = 0, n = 0;
    for (const [, x, y] of main.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)) {
      sx += parseFloat(x); sy += parseFloat(y); n++;
    }
    return n ? { cx: sx / n, cy: sy / n } : null;
  };

  const loadBaseArea = async () => {
    if (!state.baseAreaUrl) { state.baseLoaded = true; return; }
    if (state.baseLoaded || state.baseLoading) return;
    state.baseLoading = true;
    try {
      const { data: text, source } = await fetchWithRuntimeCache(state.baseAreaUrl, 'baseArea', { responseType: 'text', label: '地域境界' });
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'image/svg+xml');
      const byCode = {};
      doc.querySelectorAll('path[id]').forEach((el) => {
        const rawId = el.getAttribute('id') || '';
        const code = rawId.replace(/^m_/, '');
        if (!/^\d{5}$/.test(code)) return;
        const d = el.getAttribute('d');
        if (!d) return;
        const title = el.querySelector('title')?.textContent || '';
        if (!byCode[code]) byCode[code] = { code, title, paths: [] };
        byCode[code].paths.push(toInternal(d));
      });
      state.districts = Object.values(byCode).map((dist) => ({
        ...dist,
        centroid: centroidOf(dist.paths),
      }));
      state.baseLoaded = true;
      console.log('[teamActivityLayer] base area loaded:', state.districts.length, 'districts', { source });
    } catch (err) {
      console.error('[teamActivityLayer] loadBaseArea failed', err);
      state.baseLoaded = true;
    } finally {
      state.baseLoading = false;
      window.svgMap?.refreshScreen?.();
    }
  };

  // Match area name to municipality code via base area title
  const matchCode = (area) => {
    if (!area) return null;
    const name = area.trim();
    for (const d of state.districts) {
      const stripped = d.title.replace(/^岡山県\s*/, '');
      if (stripped === name || d.title === name || d.title.endsWith(name) || name.endsWith(stripped)) {
        return d.code;
      }
    }
    return null;
  };

  // Load 丁目-level district polygons for a municipality code
  const loadDistrictSvg = async (code) => {
    if (!state.districtSvgUrlTemplate || !state.districtSvgUrlTemplate.includes('{code}')) {
      // No template — mark immediately so draw() proceeds to coordinate fallback.
      state.codesLoaded.add(code);
      state.districtsByCode[code] = null;
      return;
    }
    if (state.codesLoaded.has(code) || state.codesLoading.has(code)) return;
    state.codesLoading.add(code);
    const url = state.districtSvgUrlTemplate.replace('{code}', code);
    console.log(`[teamActivityLayer] district:${code} fetching`, url);
    try {
      const { data: text, source } = await fetchWithRuntimeCache(url, 'districtSvg', { responseType: 'text', label: '地区境界' });
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'image/svg+xml');
      const pathEls = Array.from(doc.querySelectorAll('path'));
      const paths = pathEls
        .map((el) => {
          const rawD = el.getAttribute('d') || '';
          const name = el.querySelector('title')?.textContent || '';
          const poly = parsePoly(rawD);
          return { code, internalD: toInternal(rawD), poly, name, centroid: centroidOfPoly(poly) };
        })
        .filter((p) => p.poly.length >= 3);

      const firstEl = pathEls[0];
      const propKeys = firstEl
        ? Array.from(firstEl.attributes).map((a) => a.name).join(', ')
        : '(none)';
      const sampleNames = paths.slice(0, 3).map((p) => p.name).join(' / ');
      console.log(`[teamActivityLayer] district:${code} loaded: ${paths.length} paths`, { source });
      console.log(`[teamActivityLayer] district:${code} propKeys: ${propKeys}`);
      console.log(`[teamActivityLayer] district:${code} samples: ${sampleNames || '(none)'}`);

      if (paths.length === 0) {
        console.warn(`[teamActivityLayer] district:${code} no valid paths — district data unavailable`);
        state.districtsByCode[code] = null;
      } else {
        state.districtsByCode[code] = paths;
      }
    } catch (err) {
      console.error(`[teamActivityLayer] district:${code} load failed`, err);
      console.warn(`[teamActivityLayer] district:${code} no district data — will use centroid badge fallback`);
      state.districtsByCode[code] = null;
    } finally {
      state.codesLoaded.add(code);
      state.codesLoading.delete(code);
      window.svgMap?.refreshScreen?.();
    }
  };

  const loadRecords = async () => {
    if (state.loaded || state.loading) return;
    state.loading = true;
    const seq = ++loadSeq;
    console.log('[teamActivityLayer] fetching', state.dataUrl);
    try {
      const { data: payload, source } = await fetchWithRuntimeCache(state.dataUrl, 'teamActivity', { label: '活動情報' });
      if (seq !== loadSeq) { state.loading = false; return; }
      state.records = normalizePayload(payload)
        .map((record, index) => {
          const lat = Number(record.lat ?? record.latitude);
          const lon = Number(record.lon ?? record.lng ?? record.longitude);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
          return {
            ...record,
            id: String(record.id || record.teamId || `team-${index + 1}`),
            layerId: 'teamActivity',
            kind: 'district-overlay',
            title: String(record.title || record.teamName || `チーム ${index + 1}`),
            status: String(record.status || 'active'),
            lat, lon,
          };
        })
        .filter(Boolean);
      state.loaded = true;
      console.log('[teamActivityLayer] records loaded:', state.records.length, { source });
    } catch (error) {
      if (seq !== loadSeq) { state.loading = false; return; }
      console.error('[teamActivityLayer] load failed', error);
      state.records = []; state.loaded = true;
    } finally {
      if (seq === loadSeq) {
        state.loading = false;
        window.svgMap?.refreshScreen?.();
      }
    }
  };

  const getZoomLevel = () => {
    const scale = Number(window.svgImageProps?.scale);
    if (Number.isFinite(scale) && scale > 0) return Math.floor(Math.LOG2E * Math.log(scale) + 7.25);
    return 13;
  };

  const colorsFor = (status) => {
    const normalized = normalizeStatus(status);
    if (normalized === 'standby')         return { fill: '#f59e0b', stroke: '#92400e', text: '#173b78', label: '待機中' };
    if (normalized === 'planned')         return { fill: '#d97706', stroke: '#92400e', text: '#173b78', label: '対応予定' };
    if (normalized === 'completed')       return { fill: '#16a34a', stroke: '#14532d', text: '#173b78', label: '完了' };
    if (normalized === 'needs_attention') return { fill: '#dc2626', stroke: '#991b1b', text: '#173b78', label: '要確認' };
    if (normalized === 'unknown')         return { fill: '#64748b', stroke: '#334155', text: '#334155', label: '情報なし' };
    return { fill: '#2563eb', stroke: '#1e40af', text: '#173b78', label: '活動中' };
  };

  const colorsForRecord = (record) => {
    const normalized = normalizeStatus(record?.status);
    return colorsFor(normalized);
  };

  const STATUS_PRIORITY = ['needs_attention', 'active', 'planned', 'standby', 'completed', 'unknown'];

  const normalizeStatus = (status) => {
    const value = String(status || '').trim().toLowerCase();
    if (['active', 'ongoing', '活動中'].includes(value)) return 'active';
    if (['standby', 'waiting', '待機中'].includes(value)) return 'standby';
    if (['planned', 'scheduled', 'plan', '予定', '計画中'].includes(value)) return 'planned';
    if (['completed', 'complete', 'done', '完了'].includes(value)) return 'completed';
    if (['needs_attention', 'warning', 'alert', '要確認', '要対応'].includes(value)) return 'needs_attention';
    if (['stopped', 'inactive', '停止中'].includes(value)) return 'unknown';
    return value || 'unknown';
  };

  const pickStatus = (records) => {
    const statuses = records.map((record) => normalizeStatus(record.status));
    return STATUS_PRIORITY.find((status) => statuses.includes(status)) || 'unknown';
  };

  const payloadFor = (rep, code) => ({
    enabled: true,
    id: `teamActivity:${rep.id}`,
    layerId: 'teamActivity',
    title: rep.title,
    kind: 'district-overlay',
    category: 'teamActivity',
    summary: colorsFor(rep.status).label,
    description: rep.note || '',
    status: normalizeStatus(rep.status),
    municipalityCode: code,
    lat: rep.lat,
    lon: rep.lon,
    feature: { ...rep, status: normalizeStatus(rep.status), districtName: rep.districtName || rep.area || '' },
    area: rep.districtName || rep.area || '',
    teams: [{
      id: rep.id,
      title: rep.title,
      status: normalizeStatus(rep.status),
      note: rep.note || '',
      activityType: rep.activityType || '',
      operator: rep.operator || '',
      updatedAt: rep.updatedAt || '',
    }],
  });

  const areaPayloadFor = (record, code, districtName) => ({
    enabled: true,
    id: `area:${code}:${districtName || record.area || record.id}`,
    layerId: 'area',
    title: districtName || record.area || '区域',
    kind: 'area',
    category: 'area',
    summary: '区域選択',
    description: 'この区域を選択して、避難所・活動情報を確認します。',
    status: normalizeStatus(record.status),
    municipalityCode: code,
    lat: record.lat,
    lon: record.lon,
    area: districtName || record.area || '',
    resolvedArea: districtName || record.area || '',
    feature: {
      id: `area:${code}:${districtName || record.area || record.id}`,
      title: districtName || record.area || '区域',
      districtName: districtName || record.area || '',
      municipalityCode: code,
      status: normalizeStatus(record.status),
      sourceTeamId: record.id,
    },
  });

  const payloadForMesh = (cell) => ({
    enabled: true,
    id: cell.id,
    layerId: 'teamActivity',
    title: `${cell.area || '活動エリア'} 活動 ${cell.records.length}件`,
    kind: 'activity-mesh',
    category: 'teamActivity',
    summary: colorsFor(cell.status).label,
    description: '地区境界に結び付けられない活動を、周辺メッシュとして表示しています。',
    status: cell.status,
    municipalityCode: cell.code,
    lat: cell.centerLat,
    lon: cell.centerLon,
    feature: {
      id: cell.id,
      status: cell.status,
      area: cell.area || '',
      districtName: '活動メッシュ',
      activityType: 'mesh',
      note: `${cell.records.length}件の活動があります`,
    },
    teams: cell.records.map((record) => ({
      id: record.id,
      title: record.title,
      status: normalizeStatus(record.status),
      note: record.note || '',
      activityType: record.activityType || '',
      operator: record.operator || '',
      updatedAt: record.updatedAt || '',
    })),
  });

  const buildTeamActivityDetailHtml = (feature) => {
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const statusInfo = {
      active:          { label: '活動中',   badgeBg: '#2563eb' },
      standby:         { label: '待機中',   badgeBg: '#d97706' },
      planned:         { label: '対応予定', badgeBg: '#d97706' },
      completed:       { label: '完了',     badgeBg: '#16a34a' },
      needs_attention: { label: '要確認',   badgeBg: '#dc2626' },
      unknown:         { label: '情報なし', badgeBg: '#64748b' },
    };
    const iconMap = {
      standby: '/map/icons/team-standby.png',
      planned: '/map/icons/team-planned.png',
      completed: '/map/icons/team-completed.png',
      needs_attention: '/map/icons/team-attention.png',
    };
    const st = statusInfo[feature.status] || statusInfo.unknown;
    const icon = iconMap[feature.status] || '/map/icons/team-active.png';
    const team0 = feature.teams?.[0];
    const row = (label, value) => {
      if (value == null || value === '') return '';
      return `<div style="display:grid;grid-template-columns:4.15rem minmax(0,1fr);gap:0.52rem;align-items:start;min-width:0;"><dt style="margin:0;color:#64748b;font-size:0.82rem;font-weight:800;padding-top:0.05em;">${esc(label)}</dt><dd style="margin:0;font-size:0.9rem;font-weight:700;line-height:1.45;color:#0f172a;min-width:0;overflow-wrap:anywhere;">${esc(String(value))}</dd></div>`;
    };
    const latLon = (feature.lat != null && feature.lon != null)
      ? `${Number(feature.lat).toFixed(5)}, ${Number(feature.lon).toFixed(5)}`
      : null;
    const rows = [
      row('活動エリア', feature.area),
      row('種別',       team0?.activityType),
      row('担当',       team0?.operator),
      row('メモ',       team0?.note),
      row('更新日時',   team0?.updatedAt),
      row('自治体',     feature.municipalityCode),
      row('緯度経度',   latLon),
    ].filter(Boolean).join('');
    const teams = Array.isArray(feature.teams) && feature.teams.length > 1 ? feature.teams : [];
    const teamStatusBg = (s) => ({
      active: '#2563eb', planned: '#d97706', standby: '#d97706',
      completed: '#16a34a', needs_attention: '#dc2626',
    }[s] || '#64748b');
    const teamsHtml = teams.length ? `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.5rem;">${
      teams.map((t) => `<li style="display:flex;flex-direction:column;gap:0.18rem;padding:0.5rem 0.72rem;border-radius:0.7rem;background:#f4f8fd;">
        <div style="display:flex;align-items:center;gap:0.45rem;">
          <span style="display:inline-block;width:0.55rem;height:0.55rem;border-radius:50%;background:${teamStatusBg(t.status)};flex-shrink:0;"></span>
          <span style="font-size:0.88rem;font-weight:700;color:#0f172a;overflow-wrap:anywhere;">${esc(t.title || t.id || '活動')}</span>
          <span style="font-size:0.72rem;color:#64748b;white-space:nowrap;">${esc(statusInfo[t.status]?.label || t.status || '')}</span>
        </div>
        ${t.activityType || t.operator ? `<div style="font-size:0.78rem;color:#64748b;">${esc([t.activityType, t.operator].filter(Boolean).join(' / '))}</div>` : ''}
        ${t.note ? `<div style="font-size:0.82rem;color:#475569;">${esc(t.note)}</div>` : ''}
        ${t.updatedAt ? `<div style="font-size:0.72rem;color:#94a3b8;">${esc(t.updatedAt)}</div>` : ''}
      </li>`).join('')
    }</ul>` : '';
    return `<section style="position:relative;background:#ffffff;border:1px solid rgba(29,111,214,0.18);border-radius:1.45rem;box-shadow:0 18px 46px rgba(30,86,145,0.16);overflow:hidden;padding:1rem 1rem 1.05rem;display:flex;flex-direction:column;gap:0.72rem;font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;box-sizing:border-box;width:100%;">
  <div style="position:absolute;top:0;left:0;right:0;height:0.38rem;background:linear-gradient(90deg,#2563eb,#f59e0b,#dc2626);"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:0.1rem;">
    <span style="display:inline-flex;align-items:center;padding:0.15rem 0.55rem;border-radius:999px;background:rgba(29,111,214,0.12);color:#1d4ed8;font-size:0.72rem;font-weight:700;letter-spacing:0.04em;">活動情報</span>
    <button data-lawa-close="1" id="team-detail-close" type="button" style="display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border:1px solid rgba(148,163,184,0.35);border-radius:50%;background:#ffffff;color:#94a3b8;font-size:1rem;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,0.10);flex-shrink:0;">×</button>
  </div>
  <div style="display:grid;grid-template-columns:4.25rem minmax(0,1fr);gap:0.92rem;align-items:start;">
    <div style="display:inline-flex;align-items:center;justify-content:center;width:4.25rem;height:4.25rem;border-radius:1.1rem;overflow:hidden;box-shadow:0 8px 18px rgba(15,23,42,0.18);">
      <img src="${icon}" alt="" style="width:100%;height:100%;object-fit:contain;" />
    </div>
    <div style="min-width:0;">
      <h3 style="margin:0;font-size:1.4rem;font-weight:900;line-height:1.2;letter-spacing:-0.03em;overflow-wrap:anywhere;color:#0f172a;">${esc(feature.title || '活動情報')}</h3>
      <span style="display:inline-flex;align-items:center;margin-top:0.4rem;padding:0.28rem 0.72rem;border-radius:999px;background:${st.badgeBg};color:#fff;font-size:0.78rem;font-weight:800;box-shadow:0 5px 14px rgba(15,23,42,0.12);">${esc(st.label)}</span>
    </div>
  </div>
  ${rows ? `<dl style="display:grid;gap:0.45rem;margin:0;padding:0.78rem 0.88rem;border-radius:1rem;background:#f4f8fd;">${rows}</dl>` : ''}
  ${teamsHtml ? `<div><div style="font-size:0.8rem;font-weight:800;color:#1d4ed8;letter-spacing:0.03em;margin-bottom:0.4rem;">地区内チーム一覧</div>${teamsHtml}</div>` : ''}
</section>`;
  };

  const renderTeamActivityDetail = (feature) => {
    if (!feature) return;
    selectedFeatureId = feature.id || null;
    state.signature = '';
    const html = buildTeamActivityDetailHtml(feature);
    window.parent?.postMessage?.({ type: 'runtime:layerDetailHtml', layerId: 'teamActivity', html }, '*');
  };

  const emitFeature = (feature) => {
    if (!state.visible) {
      console.log('[teamActivityLayer] featureSelect ignored: hidden', {
        id: feature?.id,
      });
      return;
    }
    lastEmitAt = Date.now();
    console.log('[teamActivityLayer] emitFeature', {
      id: feature?.id,
      layerId: feature?.layerId,

    if (!state.visible) {

      if (carrier) stopFeatureEvent(event);
      return Boolean(carrier);

    if (Date.now() - lastEmitAt < 450) {
      stopFeatureEvent(event);
      return true;

    const fid = carrier.getAttribute('data-feature-id') || null;

  const getMeshCell = (record, code, zoom) => {

    const west = col * cellDeg;
    const south = row * cellDeg;
    const east = west + cellDeg;
    const north = south + cellDeg;
    return {
      id: `teamActivity:mesh:${code}:${row}:${col}`,
      code,

      col,

    matches.push(...findMatchesIn(record, preferred));
    for (const [code, paths] of Object.entries(state.districtsByCode)) {
      if (code === preferredCode || !paths) continue;
      matches.push(...findMatchesIn(record, paths));
    }
    return matches;

  const draw = () => {
    parseHashParams();
    const earlyZoom = getZoomLevel();
    if (!state.visible) {
      removeGroup();
      emitHitTargets([], earlyZoom);
      emitAreaTargets([], earlyZoom);
      return;
    }
    if (!state.loaded) return;
    if (!state.baseLoaded) return;

    const geoViewBox = window.svgMap?.getGeoViewBox?.();
    if (!geoViewBox || !Number.isFinite(Number(geoViewBox.width))) return;
    const zoom = getZoomLevel();

    // Resolve municipality codes and kick off district SVG loads.
    // When a municipality filter is active, only load SVGs for selected codes.
    let anyLoading = false;
    for (const record of state.records) {
      const code = record.municipalityCode || matchCode(record.area) || matchCode(record.district);
      if (!code) continue;
      if (state.selectedMunicipalityCodes.size > 0 && !state.selectedMunicipalityCodes.has(code)) continue;
      if (!state.codesLoaded.has(code) && !state.codesLoading.has(code)) {
        void loadDistrictSvg(code);
        // anyLoading only if the code is now actually in-flight (async fetch started)
        if (state.codesLoading.has(code)) anyLoading = true;
      } else if (state.codesLoading.has(code)) {
        anyLoading = true;
      }
    }
    if (anyLoading) {
      // Do not draw mesh rectangles while the real district polygons are still loading.
      // The temporary rectangles made the area layer look like plain square tiles.
      console.log('[teamActivityLayer] draw deferred while district SVG is loading');
      emitHitTargets([], zoom);
      emitAreaTargets([], zoom);
      return;
    }

    const muniFilterKey = [...state.selectedMunicipalityCodes].sort().join(',');
    const signature = [
      state.visible ? 'visible' : 'hidden',
      Number(geoViewBox.x).toFixed(3),
      Number(geoViewBox.y).toFixed(3),
      Number(geoViewBox.width).toFixed(3),
      Number(geoViewBox.height).toFixed(3),
      zoom,
      state.records.length,
      state.codesLoaded.size,
      selectedFeatureId || '',
      TEAM_ACTIVITY_VISUAL_VERSION,
      state.interactionMode,
      muniFilterKey,
    ].join('|');
    if (state.signature === signature) return;
    state.signature = signature;

    const groups = clearGroup();
    if (!groups) return;
    const { polygonGroup, badgeGroup } = groups;

    // Apply municipality filter before processing records
    const activeRecords = state.selectedMunicipalityCodes.size > 0
      ? state.records.filter((r) => {
          const code = r.municipalityCode || matchCode(r.area) || matchCode(r.district);
          return !code || state.selectedMunicipalityCodes.has(code);
        })
      : state.records;

    let pipMatched = 0, pipNoMatch = 0, noDistrictData = 0, noCode = 0;
    let polygonCount = 0, meshCount = 0, markerCount = 0;
    const meshCells = new Map();
    const coordinateFallbackMarkers = [];
    const hitTargets = [];
    const areaTargets = [];
    const selectAreaMode = state.interactionMode === 'select-area';
    const inspectAreaMode = state.interactionMode === 'inspect-area';
    const allowsAreaHit = selectAreaMode || inspectAreaMode;

    const addMeshFallback = (record, code, reason) => {
      coordinateFallbackMarkers.push({ record, code, reason });
      console.log(`[teamActivityLayer] coordinate marker fallback (${reason}):`, record.title, '->', code);
    };

    for (const record of activeRecords) {
      const code = record.municipalityCode || matchCode(record.area) || matchCode(record.district);

      if (!code) {
        // Keep record visible even if municipality code cannot be resolved.
        noCode++;
        addMeshFallback(record, 'unknown', 'no-code');
        continue;
      }

      const featureId = `teamActivity:${record.id}`;
      const isSelected = featureId === selectedFeatureId;
      const normalizedStatus = normalizeStatus(record.status);
      const displayRecord = { ...record, status: normalizedStatus };
      const colors = colorsForRecord(displayRecord);

      const districtPaths = state.districtsByCode[code];
      let matched = [];

      if (!districtPaths) {
        // No preferred 丁目-level data — try every loaded district before using mesh.
        matched = findMatchesAcrossLoadedDistricts(displayRecord, code);
        if (matched.length > 0) {
          console.warn(`[teamActivityLayer] district:${code} unavailable, but matched another district for "${record.title}" → "${matched[0].name}"`);
        } else {
          console.warn(`[teamActivityLayer] district:${code} no district data — mesh fallback for "${record.title}"`);
        }
        noDistrictData++;
        if (matched.length === 0) {
          addMeshFallback(displayRecord, code, 'no-district-data');
          continue;
        }
      } else {
        // PIP: first try the declared/area-matched municipality, then all loaded district polygons.
        matched = findMatchesIn(displayRecord, districtPaths);
        if (matched.length === 0) {
          matched = findMatchesAcrossLoadedDistricts(displayRecord, code);
          if (matched.length > 0) {
            console.warn(`[teamActivityLayer] district:${code} PIP no match, recovered by coordinate search for "${record.title}" → "${matched[0].name}"`);
          }
        }

        if (matched.length === 0) {
          console.warn(`[teamActivityLayer] district:${code} PIP no match — lon=${record.lon} lat=${record.lat} "${record.title}" — mesh fallback`);
          pipNoMatch++;
          addMeshFallback(displayRecord, code, 'pip-no-match');
          continue;
        }
      }

      console.log(`[teamActivityLayer] PIP matched: "${record.title}" → "${matched[0].name}" (${matched.length} path(s))`);
      pipMatched++;
      displayRecord.districtName = matched[0].name || record.area || '';
      const matchedCode = matched[0].code || code;
      const payload = JSON.stringify(payloadFor(displayRecord, matchedCode));

      // Build team feature payload once; polygon clicks reuse it so they show the team activity, not an area stub.
      const teamFeature = payloadFor(displayRecord, matchedCode);

      // Draw matched 丁目 polygon(s)
      for (const mp of matched) {
        const poly = createSvgElement('path');
        poly.setAttribute('d', mp.internalD);
        poly.setAttribute('fill', colors.fill);
        poly.setAttribute('fill-opacity', isSelected ? '0.34' : '0.22');
        poly.setAttribute('stroke', colors.stroke);
        poly.setAttribute('stroke-width', isSelected ? '3.2' : '2.1');
        poly.setAttribute('stroke-opacity', isSelected ? '0.96' : '0.68');
        poly.setAttribute('vector-effect', 'non-scaling-stroke');
        poly.setAttribute('pointer-events', 'none');
        poly.setAttribute('data-feature', payload);
        poly.setAttribute('data-feature-id', featureId);
        poly.setAttribute('data-layer-id', 'teamActivity');
        poly.setAttribute('data-kind', 'district-overlay');
        poly.setAttribute('data-title', record.title);
        poly.setAttribute('data-team-code', matchedCode);
        if (poly.style) {
          poly.style.cursor = 'default';
          poly.style.pointerEvents = 'none';
        }
        polygonGroup.appendChild(poly);
        polygonCount++;
        if (allowsAreaHit && Array.isArray(mp.poly) && mp.poly.length >= 3) {
          areaTargets.push({
            ...teamFeature,
            poly: mp.poly,
            x: mp.centroid?.cx,
            y: mp.centroid?.cy,
            lon: mp.centroid?.cx != null ? mp.centroid.cx / 100 : displayRecord.lon,
            lat: mp.centroid?.cy != null ? -mp.centroid.cy / 100 : displayRecord.lat,
          });
        }
      }

      // Marker at matched 丁目 centroid. Details are shown in the React sidebar.
      const centroid = matched[0].centroid;
      if (centroid) {
        try {
          const target = drawActivityMarker(badgeGroup, centroid.cx, centroid.cy, displayRecord, matchedCode, featureId, payload, colors, isSelected, { kind: 'activity-marker' });
          if (target) {
            markerCount++;
            if (inspectAreaMode && target !== true) hitTargets.push(target);
          }
        } catch (error) {
          console.error('[teamActivityLayer] drawActivityMarker failed', {
            id: displayRecord?.id,
            title: displayRecord?.title,
            error,
          });
        }
      }
    }

    for (const cell of meshCells.values()) {
      meshCount++;
      try {
        const target = drawMeshCell(polygonGroup, badgeGroup, cell, zoom);
        if (target) {
          markerCount++;
            if (inspectAreaMode && target !== true) hitTargets.push(target);
        }
      } catch (error) {
        console.error('[teamActivityLayer] drawActivityMarker failed', {
          id: cell?.id,
          title: cell?.title,
          error,
        });
      }
    }

    for (const fallback of coordinateFallbackMarkers) {
      const record = fallback.record;
      const code = fallback.code || record.municipalityCode || 'unknown';
      const featureId = `teamActivity:${record.id}`;
      const isSelected = featureId === selectedFeatureId;
      const normalizedStatus = normalizeStatus(record.status);
      const displayRecord = {
        ...record,
        status: normalizedStatus,
        districtName: record.districtName || record.area || record.district || '',
      };
      const colors = colorsForRecord(displayRecord);
      const payload = JSON.stringify(payloadFor(displayRecord, code));
      const cx = Number(record.lon) * 100;
      const cy = Number(record.lat) * -100;
      if (!Number.isFinite(cx) || !Number.isFinite(cy)) continue;
      try {
        const target = drawActivityMarker(
          badgeGroup,
          cx,
          cy,
          displayRecord,
          code,
          featureId,
          payload,
          colors,
          isSelected,
          { kind: 'activity-marker' },
        );
        if (target) {
          markerCount++;
          if (inspectAreaMode && target !== true) hitTargets.push(target);
        }
      } catch (error) {
        console.error('[teamActivityLayer] drawActivityMarker fallback failed', {
          id: displayRecord?.id,
          title: displayRecord?.title,
          reason: fallback.reason,
          error,
        });
      }
    }

    emitHitTargets(inspectAreaMode ? hitTargets : [], zoom);
    emitAreaTargets(allowsAreaHit ? areaTargets : [], zoom);
  };

  // Badge elements own pointer handlers. This fallback only catches a real click that began on the same badge.
  window.addEventListener('click', (event) => {
    const carrier = featureCarrierFromEvent(event);
    if (carrier) confirmBadgeClick(event, carrier, 'click-fallback');
  }, true);
  window.addEventListener('message', (event) => {
    const msg = event.data || {};

    if (msg.type === 'map:showTeamActivityFeature') {
      const feature = msg.feature;
      if (feature) {
        console.log('[teamActivityLayer] map:showTeamActivityFeature', feature.id);
        renderTeamActivityDetail(feature);
      }
      return;
    }

    if (msg.type === 'map:interactionModeChanged') {
      state.interactionMode = msg.interactionMode || msg.payload?.interactionMode || 'inspect-area';
      state.signature = '';
      console.log('[teamActivityLayer] interaction mode changed', state.interactionMode);
      if (state.interactionMode !== 'inspect-area') {
        emitHitTargets([], getZoomLevel());
      }
      if (state.interactionMode !== 'select-area' && state.interactionMode !== 'inspect-area') {
        emitAreaTargets([], getZoomLevel());
      }
      return;
    }

    if (msg.type === 'map:layerVisibilityChanged') {
      const layerKey = msg.layerKey || msg.payload?.layerKey || msg.payload?.layerId;
      if (layerKey !== 'teamActivity' && layerKey !== 'team-activity') return;
      state.visible = msg.visible !== false;
      state.signature = '';
      console.log('[teamActivityLayer] visibility changed', state.visible);
      if (!state.visible) {
        selectedFeatureId = null;
        removeGroup();
        emitHitTargets([], getZoomLevel());
        emitAreaTargets([], getZoomLevel());
        console.log('[teamActivityLayer] cleared because hidden');
        return;
      }
      window.svgMap?.refreshScreen?.();
      return;
    }
    if (msg.type === 'map:setMunicipalityFilter') {
      const codes = Array.isArray(msg.municipalityCodes) ? msg.municipalityCodes : [];
      state.selectedMunicipalityCodes = new Set(codes);
      state.signature = '';
      console.log('[teamActivityLayer] municipality filter set', codes);
      return;
    }
    if (msg.type === 'map:setDataUrl' && (msg.layerId === 'teamActivity' || !msg.layerId)) {
      const newUrl = msg.url || msg.dataUrl;
      if (!newUrl) return;
      if (newUrl !== state.dataUrl) {
        console.log('[teamActivityLayer] setDataUrl', newUrl);
        state.dataUrl = newUrl;
        state.records = [];
        state.loaded = false;
        state.loading = false;
        loadSeq++;
        state.signature = '';
      }
      void loadRecords();
      return;
    }
    if (msg.type === 'map:setLayerConfig' && (msg.layerId === 'teamActivity' || !msg.layerId)) {
      const newBaseUrl = msg.baseAreaLayerUrl || msg.baseAreaUrl;
      const newDistrictTemplate = msg.districtSvgUrlTemplate;
      let changed = false;
      if (newBaseUrl && newBaseUrl !== state.baseAreaUrl) {
        state.baseAreaUrl = newBaseUrl;
        state.baseLoaded = false;
        state.baseLoading = false;
        state.districts = [];
        changed = true;
      }
      if (newDistrictTemplate && newDistrictTemplate !== state.districtSvgUrlTemplate) {
        state.districtSvgUrlTemplate = newDistrictTemplate;
        state.districtsByCode = {};
        state.codesLoaded = new Set();
        state.codesLoading = new Set();
        changed = true;
      }
      if (changed) {
        state.signature = '';
        console.log('[teamActivityLayer] setLayerConfig', { baseAreaUrl: state.baseAreaUrl, districtSvgUrlTemplate: state.districtSvgUrlTemplate });
        void loadBaseArea();
      }
      return;
    }
  });

  window.preRenderFunction = draw;
  window.addEventListener('load', () => {
    parseHashParams();
    // Do not call loadRecords()/loadBaseArea() here — wait for map:setDataUrl/map:setLayerConfig
    window.parent?.postMessage?.({ type: 'teamActivityLayer:ready' }, '*');
  });
})();
</script>
</body>
</html>

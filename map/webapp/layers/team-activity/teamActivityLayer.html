<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>チーム活動 WebApp Layer</title>
</head>
<body>
<script type="module">
import { MAP_MESSAGES } from '../../shared/mapMessages.js';
import { fetchWithRuntimeCache } from '../../shared/runtimeCache.js';

(() => {
  window.hiddenOnLayerLoad = () => {
    console.log('[teamActivityLayer] hiddenOnLayerLoad called by SVGMap');
  };

  const TEAM_ACTIVITY_VISUAL_VERSION = 'team-activity-svg-use-icons-2026-06-02.1';
  console.log(`[teamActivityLayer] VERSION ${TEAM_ACTIVITY_VISUAL_VERSION}`);

  const DRAW_GROUP_ID = 'team-activity-webapp-draw';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XLINK_NS = 'http://www.w3.org/1999/xlink';
  const state = {
    dataUrl: '/map/data/team-activity/okayama.json',
    baseAreaUrl: '',
    districtSvgUrlTemplate: '',
    records: [],
    districts: [],        // municipality-level: { code, title, paths: string[], centroid }
    districtsByCode: {},  // 丁目-level: code → [{internalD, poly, name, centroid}] | null
    codesLoaded: new Set(),
    codesLoading: new Set(),
    loaded: false,
    loading: false,
    baseLoaded: false,
    baseLoading: false,
    visible: true,
    interactionMode: 'inspect-area',
    signature: '',
    selectedMunicipalityCodes: new Set(),
    loadedAt: 0,
    qtctTree: null,
    qtctRecordsSignature: '',
    renderPins: true,
  };

  let selectedFeatureId = null;
  let loadSeq = 0;
  let lastMarkersReadySignature = '';

  const emitDataStatus = (payload) => {
    window.parent?.postMessage?.({
      type: MAP_MESSAGES.runtimeDataStatus,
      payload: {
        online: navigator.onLine,
        updatedAt: new Date().toISOString(),
        ...payload,
      },
    }, window.location.origin);
  };

  const createSvgElement = (tagName) =>
    window.svgImage?.createElement?.(tagName) || window.svgImage?.createElementNS?.(SVG_NS, tagName);

  const safeHref = (win) => {
    try {
      return win?.location?.href || '';
    } catch {
      return 'cross-origin-or-inaccessible';
    }
  };

  const parseHashParams = () => {
    const raw = String(window.svgImageProps?.hash || window.svgImageProps?.Path?.split('#')?.[1] || '');
    const params = new URLSearchParams(raw.replace(/^#/, ''));
    state.dataUrl = params.get('data') || state.dataUrl;
    state.baseAreaUrl = params.get('baseArea') || params.get('baseAreaLayerUrl') || state.baseAreaUrl;
    state.districtSvgUrlTemplate = params.get('districtSvgUrlTemplate') || state.districtSvgUrlTemplate;
    const renderPinsParam = params.get('renderPins');
    const mode = params.get('mode');
    if (renderPinsParam != null || mode) {
      state.renderPins = renderPinsParam !== 'false' && mode !== 'overlay';
    }
    const codesParam = params.get('municipalityCodes') || '';
    if (codesParam) {
      state.selectedMunicipalityCodes = new Set(codesParam.split(',').filter(Boolean));
    }
  };

  const normalizePayload = (payload) =>
    Array.isArray(payload) ? payload : (payload?.items || payload?.records || []);

  // Convert SVG path d from raw lat/lon to SVGMap internal space (x=lon*100, y=-lat*100)
  const toInternal = (d) =>
    d.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g, (_, x, y) =>
      `${(parseFloat(x) * 100).toFixed(3)} ${(parseFloat(y) * -100).toFixed(3)}`
    );

  // Extract [lon, lat] vertex pairs from raw d attribute
  const parsePoly = (d) => {
    const pts = [];
    for (const [, x, y] of d.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)) {
      pts.push([parseFloat(x), parseFloat(y)]);
    }
    return pts;
  };

  // Ray-casting point-in-polygon (lon/lat space, pts = [[lon, lat], ...])
  const pip = (lon, lat, pts) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1];
      const xj = pts[j][0], yj = pts[j][1];
      if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
        inside = !inside;
      }
    }
    return inside;
  };

  // Polygon centroid in SVGMap internal space (shoelace formula)
  const centroidOfPoly = (pts) => {
    if (pts.length < 3) return null;
    let twiceArea = 0;
    let cx = 0;
    let cy = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [x0, y0] = pts[j];
      const [x1, y1] = pts[i];
      const cross = x0 * y1 - x1 * y0;
      twiceArea += cross;
      cx += (x0 + x1) * cross;
      cy += (y0 + y1) * cross;
    }
    if (twiceArea === 0) {
      let sx = 0, sy = 0;
      for (const [lon, lat] of pts) { sx += lon; sy += lat; }
      return { cx: (sx / pts.length) * 100, cy: -(sy / pts.length) * 100 };
    }
    const area = twiceArea / 2;
    const lon = cx / (6 * area);
    const lat = cy / (6 * area);
    return { cx: lon * 100, cy: -lat * 100 };
  };

  // Centroid of LONGEST internal-space path string (for municipality-level fallback)
  const centroidOf = (paths) => {
    const main = paths.reduce((a, b) => (a.length >= b.length ? a : b), '');
    let sx = 0, sy = 0, n = 0;
    for (const [, x, y] of main.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)) {
      sx += parseFloat(x); sy += parseFloat(y); n++;
    }
    return n ? { cx: sx / n, cy: sy / n } : null;
  };

  const loadBaseArea = async () => {
    if (!state.baseAreaUrl) { state.baseLoaded = true; return; }
    if (state.baseLoaded || state.baseLoading) return;
    state.baseLoading = true;
    try {
      const { data: text, source } = await fetchWithRuntimeCache(state.baseAreaUrl, 'baseArea', {
        responseType: 'text',
        label: '地域境界',
        emitDataStatus,
        logLabel: 'teamActivityLayer',
      });
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'image/svg+xml');
      const byCode = {};
      doc.querySelectorAll('path[id]').forEach((el) => {
        const rawId = el.getAttribute('id') || '';
        const code = rawId.replace(/^m_/, '');
        if (!/^\d{5}$/.test(code)) return;
        const d = el.getAttribute('d');
        if (!d) return;
        const title = el.querySelector('title')?.textContent || '';
        if (!byCode[code]) byCode[code] = { code, title, paths: [] };
        byCode[code].paths.push(toInternal(d));
      });
      state.districts = Object.values(byCode).map((dist) => ({
        ...dist,
        centroid: centroidOf(dist.paths),
      }));
      state.baseLoaded = true;
      console.log('[teamActivityLayer] base area loaded:', state.districts.length, 'districts', { source });
    } catch (err) {
      console.error('[teamActivityLayer] loadBaseArea failed', err);
      state.baseLoaded = true;
    } finally {
      state.baseLoading = false;
      window.svgMap?.refreshScreen?.();
    }
  };

  // Match area name to municipality code via base area title
  const matchCode = (area) => {
    if (!area) return null;
    const name = area.trim();
    for (const d of state.districts) {
      const stripped = d.title.replace(/^岡山県\s*/, '');
      if (stripped === name || d.title === name || d.title.endsWith(name) || name.endsWith(stripped)) {
        return d.code;
      }
    }
    return null;
  };

  // Load 丁目-level district polygons for a municipality code
  const loadDistrictSvg = async (code) => {
    if (!state.districtSvgUrlTemplate || !state.districtSvgUrlTemplate.includes('{code}')) {
      // No template — mark immediately so draw() proceeds to coordinate fallback.
      state.codesLoaded.add(code);
      state.districtsByCode[code] = null;
      return;
    }
    if (state.codesLoaded.has(code) || state.codesLoading.has(code)) return;
    state.codesLoading.add(code);
    const url = state.districtSvgUrlTemplate.replace('{code}', code);
    console.log(`[teamActivityLayer] district:${code} fetching`, url);
    try {
      const { data: text, source } = await fetchWithRuntimeCache(url, 'districtSvg', {
        responseType: 'text',
        label: '地区境界',
        emitDataStatus,
        logLabel: 'teamActivityLayer',
      });
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'image/svg+xml');
      const pathEls = Array.from(doc.querySelectorAll('path'));
      const paths = pathEls
        .map((el) => {
          const rawD = el.getAttribute('d') || '';
          const name = el.querySelector('title')?.textContent || '';
          const poly = parsePoly(rawD);
          return { code, internalD: toInternal(rawD), poly, name, centroid: centroidOfPoly(poly) };
        })
        .filter((p) => p.poly.length >= 3);

      const firstEl = pathEls[0];
      const propKeys = firstEl
        ? Array.from(firstEl.attributes).map((a) => a.name).join(', ')
        : '(none)';
      const sampleNames = paths.slice(0, 3).map((p) => p.name).join(' / ');
      console.log(`[teamActivityLayer] district:${code} loaded: ${paths.length} paths`, { source });
      console.log(`[teamActivityLayer] district:${code} propKeys: ${propKeys}`);
      console.log(`[teamActivityLayer] district:${code} samples: ${sampleNames || '(none)'}`);

      if (paths.length === 0) {
        console.warn(`[teamActivityLayer] district:${code} no valid paths — district data unavailable`);
        state.districtsByCode[code] = null;
      } else {
        state.districtsByCode[code] = paths;
      }
    } catch (err) {
      console.error(`[teamActivityLayer] district:${code} load failed`, err);
      console.warn(`[teamActivityLayer] district:${code} no district data — will use centroid badge fallback`);
      state.districtsByCode[code] = null;
    } finally {
      state.codesLoaded.add(code);
      state.codesLoading.delete(code);
      window.svgMap?.refreshScreen?.();
    }
  };

  const loadRecords = async () => {
    if (state.loaded || state.loading) return;
    state.loading = true;
    const seq = ++loadSeq;
    console.log('[teamActivityLayer] fetching', state.dataUrl);
    try {
      const { data: payload, source } = await fetchWithRuntimeCache(state.dataUrl, 'teamActivity', {
        label: '活動情報',
        emitDataStatus,
        logLabel: 'teamActivityLayer',
      });
      if (seq !== loadSeq) { state.loading = false; return; }
      state.records = normalizePayload(payload)
        .map((record, index) => {
          const lat = Number(record.lat ?? record.latitude);
          const lon = Number(record.lon ?? record.lng ?? record.longitude);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
          return {
            ...record,
            id: String(record.id || record.teamId || `team-${index + 1}`),
            layerId: 'teamActivity',
            kind: 'district-overlay',
            title: String(record.title || record.teamName || `チーム ${index + 1}`),
            status: String(record.status || 'active'),
            lat, lon,
          };
        })
        .filter(Boolean);
      state.loaded = true;
      state.loadedAt = Date.now();
      console.log('[teamActivityLayer] records loaded:', state.records.length, { source });
    } catch (error) {
      if (seq !== loadSeq) { state.loading = false; return; }
      console.error('[teamActivityLayer] load failed', error);
      state.records = []; state.loaded = true;
    } finally {
      if (seq === loadSeq) {
        state.loading = false;
        window.svgMap?.refreshScreen?.();
      }
    }
  };

  const getZoomLevel = () => {
    const scale = Number(window.svgImageProps?.scale);
    if (Number.isFinite(scale) && scale > 0) return Math.floor(Math.LOG2E * Math.log(scale) + 7.25);
    return 13;
  };

  const colorsFor = (status) => {
    const normalized = normalizeStatus(status);
    if (normalized === 'standby')         return { fill: '#f59e0b', stroke: '#92400e', text: '#173b78', label: '待機中' };
    if (normalized === 'planned')         return { fill: '#d97706', stroke: '#92400e', text: '#173b78', label: '対応予定' };
    if (normalized === 'completed')       return { fill: '#16a34a', stroke: '#14532d', text: '#173b78', label: '完了' };
    if (normalized === 'needs_attention') return { fill: '#dc2626', stroke: '#991b1b', text: '#173b78', label: '要確認' };
    if (normalized === 'unknown')         return { fill: '#64748b', stroke: '#334155', text: '#334155', label: '情報なし' };
    return { fill: '#2563eb', stroke: '#1e40af', text: '#173b78', label: '活動中' };
  };

  const colorsForRecord = (record) => {
    const normalized = normalizeStatus(record?.status);
    return colorsFor(normalized);
  };

  const STATUS_PRIORITY = ['needs_attention', 'active', 'planned', 'standby', 'completed', 'unknown'];

  const normalizeStatus = (status) => {
    const value = String(status || '').trim().toLowerCase();
    if (['active', 'ongoing', '活動中'].includes(value)) return 'active';
    if (['standby', 'waiting', '待機中'].includes(value)) return 'standby';
    if (['planned', 'scheduled', 'plan', '予定', '計画中'].includes(value)) return 'planned';
    if (['completed', 'complete', 'done', '完了'].includes(value)) return 'completed';
    if (['needs_attention', 'warning', 'alert', '要確認', '要対応'].includes(value)) return 'needs_attention';
    if (['unknown', 'no_info', 'no-info', 'none', 'stopped', 'inactive', '情報なし', '不明', '状況不明', '停止中'].includes(value)) return 'unknown';
    return value || 'unknown';
  };

  const pickStatus = (records) => {
    const statuses = records.map((record) => normalizeStatus(record.status));
    return STATUS_PRIORITY.find((status) => statuses.includes(status)) || 'unknown';
  };

  const payloadFor = (rep, code) => ({
    enabled: true,
    id: `teamActivity:${rep.id}`,
    layerId: 'teamActivity',
    title: rep.title,
    kind: 'district-overlay',
    category: 'teamActivity',
    summary: colorsFor(rep.status).label,
    description: rep.note || '',
    status: normalizeStatus(rep.status),
    municipalityCode: code,
    lat: rep.lat,
    lon: rep.lon,
    feature: { ...rep, status: normalizeStatus(rep.status), districtName: rep.districtName || rep.area || '' },
    area: rep.districtName || rep.area || '',
    teams: [{
      id: rep.id,
      title: rep.title,
      status: normalizeStatus(rep.status),
      note: rep.note || '',
      activityType: rep.activityType || '',
      operator: rep.operator || '',
      updatedAt: rep.updatedAt || '',
    }],
  });

  const payloadForMesh = (cell) => ({
    enabled: true,
    id: cell.id,
    layerId: 'teamActivity',
    title: `${cell.area || '活動エリア'} 活動 ${cell.records.length}件`,
    kind: 'activity-mesh',
    category: 'teamActivity',
    summary: colorsFor(cell.status).label,
    description: '地区境界に結び付けられない活動を、周辺メッシュとして表示しています。',
    status: cell.status,
    municipalityCode: cell.code,
    lat: cell.centerLat,
    lon: cell.centerLon,
    feature: {
      id: cell.id,
      status: cell.status,
      area: cell.area || '',
      districtName: '活動メッシュ',
      activityType: 'mesh',
      note: `${cell.records.length}件の活動があります`,
    },
    teams: cell.records.map((record) => ({
      id: record.id,
      title: record.title,
      status: normalizeStatus(record.status),
      note: record.note || '',
      activityType: record.activityType || '',
      operator: record.operator || '',
      updatedAt: record.updatedAt || '',
    })),
  });

  const emitHitTargets = (targets, zoom) => {
    const pinTargets = targets.filter((target) => target?.kind !== 'activity-mesh');
    window.parent?.postMessage?.({
      type: MAP_MESSAGES.runtimePinHitTargets,
      payload: {
        layerId: 'teamActivity',
        targets: pinTargets,
        zoom,
        source: 'teamActivityLayer',
        emittedAt: new Date().toISOString(),
      },
    }, window.location.origin);
  };

  const emitPoiLayerRendered = (signature, featureCount) => {
    if (!featureCount || lastMarkersReadySignature === signature) return;
    lastMarkersReadySignature = signature;
    window.parent?.postMessage?.({
      type: MAP_MESSAGES.runtimePoiLayerRendered,
      payload: {
        layerId: 'teamActivity',
        featureCount,
        signature,
        renderedAt: Date.now(),
      },
    }, window.location.origin);
  };

  const clearGroup = () => {
    const root = window.svgImage?.documentElement;
    if (!root || (!window.svgImage?.createElementNS && !window.svgImage?.createElement)) return null;
    window.svgImage.getElementById?.(DRAW_GROUP_ID)?.remove?.();
    const g = createSvgElement('g');
    g.setAttribute('id', DRAW_GROUP_ID);
    g.setAttribute('pointer-events', 'none');
    if (g.style) g.style.pointerEvents = 'none';
    const polygonGroup = createSvgElement('g');
    polygonGroup.setAttribute('id', `${DRAW_GROUP_ID}-polygons`);
    polygonGroup.setAttribute('pointer-events', 'none');
    if (polygonGroup.style) polygonGroup.style.pointerEvents = 'none';
    const badgeGroup = createSvgElement('g');
    badgeGroup.setAttribute('id', `${DRAW_GROUP_ID}-markers`);
    badgeGroup.setAttribute('pointer-events', 'none');
    if (badgeGroup.style) badgeGroup.style.pointerEvents = 'none';
    g.appendChild(polygonGroup);
    g.appendChild(badgeGroup);
    root.appendChild(g);
    return { root: g, polygonGroup, badgeGroup };
  };

  const iconHrefForStatus = (status) => {
    const normalized = normalizeStatus(status);
    if (normalized === 'standby') return '/map/icons/team-standby.png';
    if (normalized === 'planned') return '/map/icons/team-planned.png';
    if (normalized === 'completed') return '/map/icons/team-completed.png';
    if (normalized === 'needs_attention') return '/map/icons/team-attention.png';
    if (normalized === 'unknown') return '/map/icons/team-attention.png';
    return '/map/icons/team-active.png';
  };

  const TEAM_ICON_STATUSES = ['active', 'standby', 'planned', 'completed', 'needs_attention', 'unknown'];

  const ensureIconDefs = () => {
    const svg = window.svgImage;
    if (!svg?.createElement) return;
    if (svg.getElementById?.('team-icon-active')) return;
    const defs = svg.getElementsByTagName?.('defs')?.[0];
    if (!defs) return;
    for (const status of TEAM_ICON_STATUSES) {
      const href = iconHrefForStatus(status);
      for (const variant of [{ suffix: '', size: 28 }, { suffix: '-sel', size: 32 }]) {
        const g = svg.createElement('g');
        g.setAttribute('id', `team-icon-${status}${variant.suffix}`);
        const half = variant.size / 2;
        const img = svg.createElement('image');
        img.setAttribute('href', href);
        img.setAttributeNS(XLINK_NS, 'xlink:href', href);
        img.setAttribute('x', String(-half));
        img.setAttribute('y', String(-half));
        img.setAttribute('width', String(variant.size));
        img.setAttribute('height', String(variant.size));
        img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        g.appendChild(img);
        defs.appendChild(g);
      }
    }
  };

  const markerNodeById = new Map();
  // hidden DOM の上限。超えたら「画面外(hidden)で最も古い」マーカーから削除する。
  // visible/選択中は削除しない。hidden マーカーは SVGMap が rendered img をパージ済みのため
  // 削除しても getSvgTarget null クラッシュは起きない（in-view の削除のみが危険）。
  const MARKER_NODE_CAP = 1200;

  const evictHiddenMarkers = (visibleIds) => {
    if (markerNodeById.size <= MARKER_NODE_CAP) return 0;
    let evicted = 0;
    // Map は「再表示で末尾へ詰め直す」LRU 順なので、先頭から古い hidden を消す。
    for (const [id, marker] of markerNodeById) {
      if (markerNodeById.size <= MARKER_NODE_CAP) break;
      if (visibleIds.has(id) || id === selectedFeatureId) continue;
      if (marker.getAttribute?.('data-hidden') !== 'true') continue;
      marker.remove?.();
      markerNodeById.delete(id);
      evicted++;
    }
    return evicted;
  };

  const createMarkerUse = (featureId) => {
    const marker = createSvgElement('use');
    if (!marker) return null;
    marker.setAttribute('x', '0');
    marker.setAttribute('y', '0');
    marker.setAttribute('data-feature-id', featureId);
    marker.setAttribute('data-layer-id', 'teamActivity');
    return marker;
  };

  const csvCell = (value) => String(value ?? '').replace(/[\r\n,]/g, ' ').trim();
  const contentFor = (feature, record, code) => [
    feature.id || '',
    feature.title || record.title || '',
    normalizeStatus(feature.status || record.status),
    feature.area || record.districtName || record.area || '',
    feature.teams?.[0]?.operator || record.operator || '',
    feature.teams?.[0]?.updatedAt || record.updatedAt || '',
    feature.summary || colorsFor(feature.status || record.status).label,
  ].map(csvCell).join(',');

  const updateMarkerUse = (marker, cx, cy, record, code, featureId, payload, isSelected, options = {}) => {
    const inspectMode = state.interactionMode === 'inspect-area';
    const normalizedStatus = normalizeStatus(record.status);
    const iconStatus = TEAM_ICON_STATUSES.includes(normalizedStatus) ? normalizedStatus : 'active';
    const symbolId = `#team-icon-${iconStatus}${isSelected ? '-sel' : ''}`;
    marker.setAttribute('href', symbolId);
    marker.setAttributeNS?.(XLINK_NS, 'xlink:href', symbolId);
    marker.setAttribute('transform', `ref(svg,${cx.toFixed(5)},${cy.toFixed(5)})`);
    // renderPins=true の旧互換時だけマーカーを描く。通常構成ではピンは代表ピンレイヤーが担当する。
    marker.setAttribute('pointer-events', inspectMode ? 'visiblePainted' : 'none');
    marker.setAttribute('opacity', inspectMode ? (isSelected ? '1' : '0.96') : '0.35');
    marker.setAttribute('data-feature-id', featureId);
    marker.setAttribute('data-layer-id', 'teamActivity');
    marker.setAttribute('data-kind', options.kind || 'activity-marker');
    marker.setAttribute('data-title', record.title);
    marker.setAttribute('data-team-code', code);
    marker.setAttribute('data-lon', String(cx / 100));
    marker.setAttribute('data-lat', String(-cy / 100));
    // 旧互換マーカー用属性。通常構成では current-map の汎用 pin hit-test がピン選択を処理する。
    marker.setAttribute('data-feature', payload || '{}');
    try {
      marker.setAttribute('content', contentFor(JSON.parse(payload || '{}'), record, code));
    } catch { marker.setAttribute('content', ''); }
    marker.setAttribute('xlink:title', record.title);
    if (marker.style) {
      marker.style.cursor = inspectMode ? 'pointer' : 'default';
    }
    return symbolId;
  };

  const showMarker = (marker) => {
    marker.removeAttribute('display');
    marker.setAttribute('visibility', 'visible');
    // inspectMode の pointer-events は updateMarkerUse で設定済みだが、
    // hideMarker → showMarker のサイクルで 'none' が残らないよう evacuation と揃えて明示復元。
    // inspectMode かどうかは updateMarkerUse が責任を持つため、ここは visiblePainted に戻すだけ。
    if (state.interactionMode === 'inspect-area') {
      marker.setAttribute('pointer-events', 'visiblePainted');
    }
    marker.removeAttribute('data-hidden');
  };

  const hideMarker = (marker) => {
    marker.setAttribute('display', 'none');
    marker.setAttribute('visibility', 'hidden');
    marker.setAttribute('pointer-events', 'none');
    marker.setAttribute('data-hidden', 'true');
  };

  const hideAllMarkers = () => {
    for (const marker of markerNodeById.values()) hideMarker(marker);
  };

  const clearAllMarkers = () => {
    for (const marker of markerNodeById.values()) marker.remove?.();
    markerNodeById.clear();
  };

  const removeGroup = () => {

  const getBadgeDisplayMode = (zoom) => {

  const getSvgUnitsPerPixel = () => {
    const geoViewBox = window.svgMap?.getGeoViewBox?.();
    const canvasSize = window.svgMap?.getCanvasSize?.();
    const fallback = window.parent?.document?.querySelector?.('#mapcanvas canvas')?.getBoundingClientRect?.();
    const widthPx = Number(canvasSize?.width || fallback?.width || window.innerWidth || 1200);
    const heightPx = Number(canvasSize?.height || fallback?.height || window.innerHeight || 800);
    const xUnits = Number(geoViewBox?.width) * 100 / Math.max(widthPx, 1);
    const yUnits = Number(geoViewBox?.height) * 100 / Math.max(heightPx, 1);
    const units = Math.max(Math.min(Number.isFinite(xUnits) ? xUnits : 0.01, Number.isFinite(yUnits) ? yUnits : 0.01), 0.0008);
    return {
      units,
      widthPx,
      heightPx,
      geoWidth: Number(geoViewBox?.width || 0),
      geoHeight: Number(geoViewBox?.height || 0),
    };
  };

  const compactTeamLabel = (title) =>

  const drawLabelBadge = (group, cx, cy, record, code, featureId, payload, colors, isSelected, zoom, options = {}) => {

    console.log('[teamActivityLayer] badge create attempt', {

    const scale = getSvgUnitsPerPixel();

    const transformMode = 'ref-local';

    group.appendChild(labelGroup);
    console.log('[teamActivityLayer] badge transform mode', {

    const displayFontSizePx = 11.5;
    const labelWidthPx = Math.max(118, Math.min(172, visualLabelText.length * 11.5 + 42));
    const labelHeightPx = 26;
    const displayFontSize = displayFontSizePx;
    const labelWidth = labelWidthPx;

    const strokeWidth = isSelected ? 1.5 : 1.3;

    const shadow = createSvgElement('rect');
    shadow.setAttribute('x', (leftX + 1.2).toFixed(5));

    leftCap.setAttribute('cx', (leftX + capRadius).toFixed(5));

    leftCap.setAttribute('r', capRadius.toFixed(5));
    body.setAttribute('x', (leftX + capRadius).toFixed(5));
    body.setAttribute('y', (-capRadius).toFixed(5));
    body.setAttribute('width', Math.max(labelWidth - 2 * capRadius, 0).toFixed(5));
    body.setAttribute('height', labelHeight.toFixed(5));
    rightCap.setAttribute('cx', (rightX - capRadius).toFixed(5));
    rightCap.setAttribute('cy', '0');
    rightCap.setAttribute('r', capRadius.toFixed(5));

    for (const el of [leftCap, body, rightCap]) {
      el.setAttribute('fill', isSelected ? '#eff6ff' : '#f8fbff');
      el.setAttribute('fill-opacity', isSelected ? '0.94' : '0.92');
      el.setAttribute('stroke', colors.stroke);
      el.setAttribute('stroke-width', strokeWidth.toFixed(5));
      el.setAttribute('stroke-opacity', isSelected ? '0.95' : '0.82');
      el.setAttribute('shape-rendering', 'geometricPrecision');
      el.setAttribute('visibility', 'visible');
      el.setAttribute('display', 'inline');
      el.setAttribute('opacity', '1');
      el.setAttribute('pointer-events', 'none');
      bgGroup.appendChild(el);
    }
    labelGroup.appendChild(bgGroup);

    const dotHalo = createSvgElement('circle');
    dotHalo.setAttribute('cx', dotX.toFixed(3));
    dotHalo.setAttribute('cy', dotY.toFixed(3));
    dotHalo.setAttribute('r', '6.5');
    dotHalo.setAttribute('fill', colors.fill);
    dotHalo.setAttribute('fill-opacity', isSelected ? '0.12' : '0.08');
    dotHalo.setAttribute('pointer-events', 'none');
    labelGroup.appendChild(dotHalo);

    const dot = createSvgElement('circle');
    dot.setAttribute('cx', dotX.toFixed(3));
    dot.setAttribute('cy', dotY.toFixed(3));
    dot.setAttribute('r', dotRadius.toFixed(3));
    dot.setAttribute('fill', colors.fill);
    dot.setAttribute('stroke', colors.stroke);
    dot.setAttribute('stroke-width', '0.55');
    dot.setAttribute('visibility', 'visible');
    dot.setAttribute('opacity', '1');
    dot.setAttribute('pointer-events', 'none');
    labelGroup.appendChild(dot);

    const txt = createSvgElement('text');
    txt.setAttribute('x', textX.toFixed(5));
    txt.setAttribute('y', (textY + 4).toFixed(5));
    txt.setAttribute('text-anchor', 'start');
    txt.setAttribute('dominant-baseline', 'middle');
    txt.setAttribute('font-size', displayFontSize.toFixed(5));
    txt.setAttribute('font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif');
    txt.setAttribute('font-weight', '700');
    txt.setAttribute('fill', '#172554');
    txt.setAttribute('stroke', '#ffffff');
    txt.setAttribute('stroke-width', '0.35');
    txt.setAttribute('stroke-linejoin', 'round');
    txt.setAttribute('paint-order', 'stroke');
    txt.setAttribute('letter-spacing', (0.15 * unit).toFixed(5));
    txt.setAttribute('visibility', 'visible');
    txt.setAttribute('display', 'inline');
    txt.setAttribute('opacity', '1');
    txt.setAttribute('pointer-events', 'none');
    txt.textContent = visualLabelText;
    labelGroup.appendChild(txt);
    group.appendChild(labelGroup);
    console.log('[teamActivityLayer] badge append debug', {
      id: featureId,
      parentName: labelGroup.parentNode?.nodeName || null,
      parentClass: labelGroup.parentNode?.getAttribute?.('class') || null,
      rootContainsBadge: group?.contains?.(labelGroup) || false,
      badgeOuterHTML: labelGroup.outerHTML?.slice?.(0, 300) || null,
    });

    console.log('[teamActivityLayer] badge created', {
      id: featureId,
      labelText,
      visualLabelText,
      x: Number(cx.toFixed(3)),
      y: Number(cy.toFixed(3)),
      zoom,
      displayMode,
      transform: labelGroup.getAttribute('transform'),
      pointerEvents: labelGroup.getAttribute('pointer-events'),
    });
    let hitTarget = null;
    try {
      const feature = JSON.parse(payload || '{}');
      hitTarget = {
        ...feature,
        layerId: 'teamActivity',
        kind: feature.kind || options.kind || 'teamActivity',
        label: visualLabelText,
        area: feature.area || record.districtName || record.area || '',
        resolvedArea: feature.area || record.districtName || record.area || '',
        lon: cx / 100,
        lat: -cy / 100,
        x: cx,
        y: cy,
        screenWidth: Math.round(labelWidthPx),
        screenHeight: Math.round(labelHeightPx),
        hitRadius: Math.round(Math.max(labelWidthPx / 2, 32)),
        properties: feature.properties || feature.feature || record,
      };
    } catch (error) {
      console.warn('[teamActivityLayer] hit target payload parse failed', error);
    }

    console.log('[teamActivityLayer] badge geometry debug', {
      id: featureId,
      label: labelText,
      x: Number(cx.toFixed(3)),
      y: Number(cy.toFixed(3)),
      zoom,
      mode: displayMode,
      transform: labelGroup.getAttribute('transform'),
      bboxWidth: String(labelWidth),
      bboxHeight: String(labelHeight),
      unit,
      canvas: `${scale.widthPx}x${scale.heightPx}`,
      geo: `${scale.geoWidth}x${scale.geoHeight}`,
      pointerEvents: labelGroup.getAttribute('pointer-events'),
    });
    console.log('[teamActivityLayer] label style applied', {
      version: TEAM_ACTIVITY_VISUAL_VERSION,
      renderMode: 'legacy-label-unused',
      labelText,
      visualLabelText,
      labelWidthPx,
      labelHeightPx,
      bgVisible: true,
      bgNode: 'circle+rect+circle',
      bgPathD: null,
      bgPathHasMapCoords: false,
      mapX: Number(cx.toFixed(5)),
      mapY: Number(cy.toFixed(5)),
      groupTransform: labelGroup.getAttribute('transform'),
      bgFill: body.getAttribute('fill'),
      bgFillOpacity: body.getAttribute('fill-opacity'),
      bgStroke: body.getAttribute('stroke'),
      bgStrokeWidth: body.getAttribute('stroke-width'),
      bgStrokeOpacity: body.getAttribute('stroke-opacity'),
      leftCapCx: leftCap.getAttribute('cx'),
      rightCapCx: rightCap.getAttribute('cx'),
      bodyX: body.getAttribute('x'),
      bodyWidth: body.getAttribute('width'),
      dotR: dot.getAttribute('r'),
      textFill: txt.getAttribute('fill'),
      textStroke: txt.getAttribute('stroke'),
      textStrokeWidth: txt.getAttribute('stroke-width'),
      textFontSize: txt.getAttribute('font-size'),
      textFontWeight: txt.getAttribute('font-weight'),
      filter: labelGroup.getAttribute('filter'),
    });
    return hitTarget || true;
  };

  const getMeshCellDeg = (zoom) => {
    if (zoom < 9) return 0.02;
    if (zoom < 11) return 0.01;
    if (zoom < 13) return 0.005;
    return 0.003;
  };

  const drawActivityMarker = (markerRoot, cx, cy, record, code, featureId, payload, colors, isSelected, visibleMarkerIds, options = {}) => {
    if (!markerRoot) return false;
    visibleMarkerIds.add(featureId);
    let marker = markerNodeById.get(featureId);
    if (!marker || !marker.isConnected) {
      marker = createMarkerUse(featureId);
      if (!marker) return false;
      markerRoot.appendChild(marker);
    }
    // 末尾へ詰め直して LRU 順を維持（再表示＝most-recently-used）
    markerNodeById.delete(featureId);
    markerNodeById.set(featureId, marker);
    const symbolId = updateMarkerUse(marker, cx, cy, record, code, featureId, payload, isSelected, options);
    markerRoot.appendChild(marker);
    showMarker(marker);

    console.log('[teamActivityLayer] activity marker created', {
      version: TEAM_ACTIVITY_VISUAL_VERSION,
      id: featureId,
      title: record.title,
      kind: options.kind || 'activity-marker',
      cx: Number(cx.toFixed(5)),
      cy: Number(cy.toFixed(5)),
      symbolId,
      color: colors.fill,
      reused: true,
    });
    if (state.interactionMode !== 'inspect-area') return true;
    try {
      const feature = JSON.parse(payload || '{}');
      return {
        ...feature,
        layerId: 'teamActivity',
        kind: options.kind || 'activity-marker',
        label: record.title || feature.title || '活動情報',
        area: feature.area || record.districtName || record.area || '',
        resolvedArea: feature.area || record.districtName || record.area || '',
        lon: cx / 100,
        lat: -cy / 100,
        x: cx,
        y: cy,
        screenWidth: isSelected ? 32 : 28,
        screenHeight: isSelected ? 32 : 28,
        hitRadius: isSelected ? 18 : 14,
        properties: feature.properties || feature.feature || record,
      };
    } catch (error) {
      console.warn('[teamActivityLayer] marker hit target payload parse failed', error);
      return true;
    }
  };

  const getMeshCell = (record, code, zoom) => {
    const cellDeg = getMeshCellDeg(zoom);
    const col = Math.floor(record.lon / cellDeg);
    const row = Math.floor(record.lat / cellDeg);
    const west = col * cellDeg;
    const south = row * cellDeg;
    const east = west + cellDeg;
    const north = south + cellDeg;
    return {
      id: `teamActivity:mesh:${code}:${row}:${col}`,
      code,
      row,
      col,
      west,
      south,
      east,
      north,
      centerLon: (west + east) / 2,
      centerLat: (south + north) / 2,
      area: record.area || record.district || '',
      records: [],
      status: 'unknown',
    };
  };

  const QTCT_BOUNDS = { minLon: 122.434, minLat: 23.546, maxLon: 154.487, maxLat: 46.056 };
  const QTCT_MAX_DEPTH = 12;
  const QTCT_LEAF_SIZE = 2;

  const qtctTargetDepthForZoom = (zoom) => {
    if (zoom < 7.5) return 5;
    if (zoom < 9) return 6;
    if (zoom < 10) return 7;
    if (zoom < 10.7) return 8;
    if (zoom < 11.1) return 9;
    if (zoom < 11.4) return 10;
    if (zoom < 11.7) return 11;
    return 11;
  };

  const qtctRecordsSignature = (records) =>
    records.map((record) => `${record.id}:${record.lat}:${record.lon}:${record.status}:${record.municipalityCode || ''}`).join('|');

  const qtctRepresentative = (records) => {
    let lat = 0;
    let lon = 0;
    for (const record of records) {
      lat += record.lat;
      lon += record.lon;
    }
    lat /= records.length;
    lon /= records.length;
    let best = records[0];
    let bestScore = Number.POSITIVE_INFINITY;
    for (const record of records) {
      const score = (record.lat - lat) ** 2 + (record.lon - lon) ** 2;
      if (score < bestScore) {
        best = record;
        bestScore = score;
      }
    }
    return best;
  };

  const qtctChildBounds = (bounds) => {
    const midLon = (bounds.minLon + bounds.maxLon) / 2;
    const midLat = (bounds.minLat + bounds.maxLat) / 2;
    return [
      { minLon: bounds.minLon, minLat: bounds.minLat, maxLon: midLon, maxLat: midLat },
      { minLon: midLon, minLat: bounds.minLat, maxLon: bounds.maxLon, maxLat: midLat },
      { minLon: bounds.minLon, minLat: midLat, maxLon: midLon, maxLat: bounds.maxLat },
      { minLon: midLon, minLat: midLat, maxLon: bounds.maxLon, maxLat: bounds.maxLat },
    ];
  };

  const buildQtctNode = (records, bounds, depth) => {
    const representative = qtctRepresentative(records);
    const node = {
      depth,
      bounds,
      count: records.length,
      representative,
    };
    if (records.length <= QTCT_LEAF_SIZE || depth >= QTCT_MAX_DEPTH) {
      node.records = records;
      return node;
    }
    const midLon = (bounds.minLon + bounds.maxLon) / 2;
    const midLat = (bounds.minLat + bounds.maxLat) / 2;
    const groups = [[], [], [], []];
    for (const record of records) {
      const east = record.lon >= midLon ? 1 : 0;
      const north = record.lat >= midLat ? 2 : 0;
      groups[east + north].push(record);
    }
    node.children = qtctChildBounds(bounds)
      .map((childBounds, index) => groups[index].length > 0 ? buildQtctNode(groups[index], childBounds, depth + 1) : null)
      .filter(Boolean);
    return node;
  };

  const ensureQtctTree = (records) => {
    const signature = qtctRecordsSignature(records);
    if (state.qtctTree && state.qtctRecordsSignature === signature) return state.qtctTree;
    const validRecords = records.filter((record) =>
      Number.isFinite(record.lat) &&
      Number.isFinite(record.lon) &&
      record.lon >= QTCT_BOUNDS.minLon &&
      record.lon <= QTCT_BOUNDS.maxLon &&
      record.lat >= QTCT_BOUNDS.minLat &&
      record.lat <= QTCT_BOUNDS.maxLat
    );
    state.qtctRecordsSignature = signature;
    state.qtctTree = validRecords.length > 0 ? buildQtctNode(validRecords, QTCT_BOUNDS, 0) : null;
    return state.qtctTree;
  };

  const qtctIntersects = (bounds, view) =>
    bounds.maxLon >= view.x &&
    bounds.minLon <= view.x + view.width &&
    bounds.maxLat >= view.y &&
    bounds.minLat <= view.y + view.height;

  const collectQtctVisible = (node, view, targetDepth, out) => {
    if (!node || !qtctIntersects(node.bounds, view)) return;
    if (!node.children || node.depth >= targetDepth) {
      out.push(node);
      return;
    }
    node.children.forEach((child) => collectQtctVisible(child, view, targetDepth, out));
  };

  const drawQtctRepresentatives = (geoViewBox, zoom) => {
    const targetDepth = qtctTargetDepthForZoom(zoom);
    const qtctTree = ensureQtctTree(state.records);
    const signature = [
      state.visible ? 'visible' : 'hidden',
      'qtct',
      Number(geoViewBox.x).toFixed(3),
      Number(geoViewBox.y).toFixed(3),
      Number(geoViewBox.width).toFixed(3),
      Number(geoViewBox.height).toFixed(3),
      zoom,
      targetDepth,
      state.records.length,
      selectedFeatureId || '',
      TEAM_ACTIVITY_VISUAL_VERSION,
      state.interactionMode,
    ].join('|');
    if (state.signature === signature) return;
    state.signature = signature;

    let groups = window.svgImage?.getElementById?.(DRAW_GROUP_ID)
      ? {
          root: window.svgImage.getElementById(DRAW_GROUP_ID),
          polygonGroup: window.svgImage.getElementById(`${DRAW_GROUP_ID}-polygons`),
          badgeGroup: window.svgImage.getElementById(`${DRAW_GROUP_ID}-markers`),
        }
      : clearGroup();
    if (!groups) return;
    const { polygonGroup } = groups;
    while (polygonGroup.firstChild) polygonGroup.removeChild(polygonGroup.firstChild);
    const badgeGroup = groups.badgeGroup || window.svgImage?.getElementById?.(`${DRAW_GROUP_ID}-markers`);
    if (badgeGroup) while (badgeGroup.firstChild) badgeGroup.removeChild(badgeGroup.firstChild);

    const markerRoot = window.svgImage?.documentElement;
    const visibleMarkerIds = new Set();
    const hitTargetList = [];
    const nodes = [];
    collectQtctVisible(qtctTree, geoViewBox, targetDepth, nodes);

    for (const node of nodes) {
      const rep = node.representative;
      if (!rep) continue;
      const code = rep.municipalityCode || matchCode(rep.area) || matchCode(rep.district) || 'unknown';
      const normalizedStatus = normalizeStatus(rep.status);
      const displayRecord = {
        ...rep,
        status: normalizedStatus,
        title: node.count > 1 ? `${rep.title} 周辺 ${node.count}件` : rep.title,
        districtName: rep.districtName || rep.area || rep.district || '',
      };
      const featureId = node.count > 1 ? `teamActivity:qtct:${node.depth}:${rep.id}:${node.count}` : `teamActivity:${rep.id}`;
      const payload = JSON.stringify({
        ...payloadFor(displayRecord, code),
        kind: node.count > 1 ? 'representative-pin' : 'activity-marker',
        representative: node.count > 1,
        count: node.count,
      });
      const target = drawActivityMarker(
        markerRoot,
        rep.lon * 100,
        rep.lat * -100,
        displayRecord,
        code,
        featureId,
        payload,
        colorsForRecord(displayRecord),
        featureId === selectedFeatureId,
        visibleMarkerIds,
        { kind: node.count > 1 ? 'representative-pin' : 'activity-marker' },
      );
      if (target && state.interactionMode === 'inspect-area' && target !== true) hitTargetList.push(target);
    }

    for (const [id, marker] of markerNodeById) {
      if (!visibleMarkerIds.has(id)) hideMarker(marker);
    }
    evictHiddenMarkers(visibleMarkerIds);
    emitPoiLayerRendered(`${signature}|markers:${visibleMarkerIds.size}`, visibleMarkerIds.size);
    emitHitTargets(hitTargetList, zoom);
  };

  const findMatchesIn = (record, paths) => {
    if (!paths?.length) return [];
    return paths.filter((p) => pip(record.lon, record.lat, p.poly));
  };

  const findMatchesAcrossLoadedDistricts = (record, preferredCode) => {
    const matches = [];
    const preferred = preferredCode ? state.districtsByCode[preferredCode] : null;
    matches.push(...findMatchesIn(record, preferred));
    for (const [code, paths] of Object.entries(state.districtsByCode)) {
      if (code === preferredCode || !paths) continue;
      matches.push(...findMatchesIn(record, paths));
    }
    return matches;
  };

  const drawMeshCell = (polygonGroup, markerRoot, cell, zoom, visibleMarkerIds) => {
    const colors = colorsFor(cell.status);
    const rect = createSvgElement('rect');
    rect.setAttribute('x', (cell.west * 100).toFixed(3));
    rect.setAttribute('y', (-cell.north * 100).toFixed(3));
    rect.setAttribute('width', ((cell.east - cell.west) * 100).toFixed(3));
    rect.setAttribute('height', ((cell.north - cell.south) * 100).toFixed(3));
    rect.setAttribute('fill', colors.fill);
    rect.setAttribute('fill-opacity', '0.24');
    rect.setAttribute('stroke', colors.stroke);
    rect.setAttribute('stroke-width', '1.8');
    rect.setAttribute('stroke-opacity', '0.62');
    rect.setAttribute('vector-effect', 'non-scaling-stroke');
    rect.setAttribute('pointer-events', 'none');
    polygonGroup.appendChild(rect);

    const displayRecord = {
      id: cell.id,
      title: `活動 ${cell.records.length}件`,
      status: cell.status,
      area: cell.area || '活動メッシュ',
    };
    const payload = JSON.stringify(payloadForMesh(cell));
    return drawActivityMarker(
      markerRoot,
      cell.centerLon * 100,
      -cell.centerLat * 100,
      displayRecord,
      cell.code,
      cell.id,
      payload,
      colors,
      cell.id === selectedFeatureId,
      visibleMarkerIds,
      {
        kind: 'activity-mesh',
      },
    );
  };

  const draw = () => {
    parseHashParams();
    const earlyZoom = getZoomLevel();
    if (!state.visible) {
      removeGroup();
      hideAllMarkers();
      return;
    }
    if (!state.loaded) return;
    if (!state.baseLoaded) return;

    if (String(state.dataUrl || '').startsWith('/api/') && state.loaded && state.loadedAt && Date.now() - state.loadedAt > 15000) {
      state.loaded = false;
      state.signature = '';
      void loadRecords();
      return;
    }

    const geoViewBox = window.svgMap?.getGeoViewBox?.();
    if (!geoViewBox || !Number.isFinite(Number(geoViewBox.width))) return;
    const zoom = getZoomLevel();
    if (zoom < 12 && state.renderPins) {
      drawQtctRepresentatives(geoViewBox, zoom);
      return;
    }

    // Resolve municipality codes and kick off district SVG loads.
    // When a municipality filter is active, only load SVGs for selected codes.
    let anyLoading = false;
    for (const record of state.records) {
      const code = record.municipalityCode || matchCode(record.area) || matchCode(record.district);
      if (!code) continue;
      if (!state.codesLoaded.has(code) && !state.codesLoading.has(code)) {
        void loadDistrictSvg(code);
        // anyLoading only if the code is now actually in-flight (async fetch started)
        if (state.codesLoading.has(code)) anyLoading = true;
      } else if (state.codesLoading.has(code)) {
        anyLoading = true;
      }
    }
    if (anyLoading) {
      // Do not draw mesh rectangles while the real district polygons are still loading.
      // The temporary rectangles made the area layer look like plain square tiles.
      console.log('[teamActivityLayer] draw deferred while district SVG is loading');
      hideAllMarkers();
      return;
    }

    const muniFilterKey = [...state.selectedMunicipalityCodes].sort().join(',');
    const signature = [
      state.visible ? 'visible' : 'hidden',
      Number(geoViewBox.x).toFixed(3),
      Number(geoViewBox.y).toFixed(3),
      Number(geoViewBox.width).toFixed(3),
      Number(geoViewBox.height).toFixed(3),
      zoom,
      state.records.length,
      state.codesLoaded.size,
      selectedFeatureId || '',
      TEAM_ACTIVITY_VISUAL_VERSION,
      state.interactionMode,
      muniFilterKey,
      state.renderPins ? 'pins' : 'overlay',
    ].join('|');
    if (state.signature === signature) return;
    state.signature = signature;

    // draw group は初回のみ作成。毎 draw で remove→appendChild すると
    // parseSVG の live NodeList が乱れてマーカー POI の setPoiBBox が呼ばれなくなる。
    let groups = window.svgImage?.getElementById?.(DRAW_GROUP_ID)
      ? {
          root: window.svgImage.getElementById(DRAW_GROUP_ID),
          polygonGroup: window.svgImage.getElementById(`${DRAW_GROUP_ID}-polygons`),
          badgeGroup: window.svgImage.getElementById(`${DRAW_GROUP_ID}-markers`),
        }
      : clearGroup();
    if (!groups) return;
    const hitTargetList = [];
    // 既存の polygons/badges を空にする（マーカーは node reuse で管理済み）
    const { polygonGroup } = groups;
    while (polygonGroup.firstChild) polygonGroup.removeChild(polygonGroup.firstChild);
    const badgeGroup = groups.badgeGroup || window.svgImage?.getElementById?.(`${DRAW_GROUP_ID}-markers`);
    if (badgeGroup) while (badgeGroup.firstChild) badgeGroup.removeChild(badgeGroup.firstChild);
    const markerRoot = state.renderPins ? window.svgImage?.documentElement : null;
    const visibleMarkerIds = new Set();

    // municipality filter は表示対象を絞らず、補助情報としてのみ保持する
    const activeRecords = state.records;

    let pipMatched = 0, pipNoMatch = 0, noDistrictData = 0, noCode = 0;
    let polygonCount = 0, meshCount = 0, markerCount = 0;
    const meshCells = new Map();
    const coordinateFallbackMarkers = [];
    const inspectAreaMode = state.interactionMode === 'inspect-area';

    const addMeshFallback = (record, code, reason) => {
      coordinateFallbackMarkers.push({ record, code, reason });
      console.log(`[teamActivityLayer] coordinate marker fallback (${reason}):`, record.title, '->', code);
    };

    for (const record of activeRecords) {
      const code = record.municipalityCode || matchCode(record.area) || matchCode(record.district);

      if (!code) {
        // Keep record visible even if municipality code cannot be resolved.
        noCode++;
        addMeshFallback(record, 'unknown', 'no-code');
        continue;
      }

      const featureId = `teamActivity:${record.id}`;
      const isSelected = featureId === selectedFeatureId;
      const normalizedStatus = normalizeStatus(record.status);
      const displayRecord = { ...record, status: normalizedStatus };
      const colors = colorsForRecord(displayRecord);

      const districtPaths = state.districtsByCode[code];
      let matched = [];

      if (!districtPaths) {
        // No preferred 丁目-level data — try every loaded district before using mesh.
        matched = findMatchesAcrossLoadedDistricts(displayRecord, code);
        if (matched.length > 0) {
          console.warn(`[teamActivityLayer] district:${code} unavailable, but matched another district for "${record.title}" → "${matched[0].name}"`);
        } else {
          console.warn(`[teamActivityLayer] district:${code} no district data — mesh fallback for "${record.title}"`);
        }
        noDistrictData++;
        if (matched.length === 0) {
          addMeshFallback(displayRecord, code, 'no-district-data');
          continue;
        }
      } else {
        // PIP: first try the declared/area-matched municipality, then all loaded district polygons.
        matched = findMatchesIn(displayRecord, districtPaths);
        if (matched.length === 0) {
          matched = findMatchesAcrossLoadedDistricts(displayRecord, code);
          if (matched.length > 0) {
            console.warn(`[teamActivityLayer] district:${code} PIP no match, recovered by coordinate search for "${record.title}" → "${matched[0].name}"`);
          }
        }

        if (matched.length === 0) {
          console.warn(`[teamActivityLayer] district:${code} PIP no match — lon=${record.lon} lat=${record.lat} "${record.title}" — mesh fallback`);
          pipNoMatch++;
          addMeshFallback(displayRecord, code, 'pip-no-match');
          continue;
        }
      }

      console.log(`[teamActivityLayer] PIP matched: "${record.title}" → "${matched[0].name}" (${matched.length} path(s))`);
      pipMatched++;
      displayRecord.districtName = matched[0].name || record.area || '';
      const matchedCode = matched[0].code || code;
      const payload = JSON.stringify(payloadFor(displayRecord, matchedCode));

      // Build team feature payload once; polygon clicks reuse it so they show the team activity, not an area stub.
      const teamFeature = payloadFor(displayRecord, matchedCode);

      // Draw matched 丁目 polygon(s)
      for (const mp of matched) {
        const poly = createSvgElement('path');
        poly.setAttribute('d', mp.internalD);
        poly.setAttribute('fill', colors.fill);
        poly.setAttribute('fill-opacity', '0.22');
        poly.setAttribute('stroke', colors.stroke);
        poly.setAttribute('stroke-width', '2.1');
        poly.setAttribute('stroke-opacity', '0.68');
        poly.setAttribute('vector-effect', 'non-scaling-stroke');
        poly.setAttribute('pointer-events', 'none');
        if (poly.style) {
          poly.style.cursor = 'default';
          poly.style.pointerEvents = 'none';
        }
        polygonGroup.appendChild(poly);
        polygonCount++;
      }

      // Marker at matched 丁目 centroid. Details are shown in the React sidebar.
      const centroid = matched[0].centroid;
      if (state.renderPins && centroid) {
        try {
          const target = drawActivityMarker(markerRoot, centroid.cx, centroid.cy, displayRecord, matchedCode, featureId, payload, colors, isSelected, visibleMarkerIds, { kind: 'activity-marker' });
          if (target) {
            markerCount++;
            if (inspectAreaMode && target !== true) hitTargetList.push(target);
          }
        } catch (error) {
          console.error('[teamActivityLayer] drawActivityMarker failed', {
            id: displayRecord?.id,
            title: displayRecord?.title,
            error,
          });
        }
      }
    }

    if (state.renderPins) {
      for (const cell of meshCells.values()) {
        meshCount++;
        try {
          const target = drawMeshCell(polygonGroup, markerRoot, cell, zoom, visibleMarkerIds);
          if (target) {
            markerCount++;
            if (inspectAreaMode && target !== true) hitTargetList.push(target);
          }
        } catch (error) {
          console.error('[teamActivityLayer] drawActivityMarker failed', {
            id: cell?.id,
            title: cell?.title,
            error,
          });
        }
      }
    }

    if (state.renderPins) {
      for (const fallback of coordinateFallbackMarkers) {
        const record = fallback.record;
        const code = fallback.code || record.municipalityCode || 'unknown';
        const featureId = `teamActivity:${record.id}`;
        const isSelected = featureId === selectedFeatureId;
        const normalizedStatus = normalizeStatus(record.status);
        const displayRecord = {
          ...record,
          status: normalizedStatus,
          districtName: record.districtName || record.area || record.district || '',
        };
        const colors = colorsForRecord(displayRecord);
        const payload = JSON.stringify(payloadFor(displayRecord, code));
        const cx = Number(record.lon) * 100;
        const cy = Number(record.lat) * -100;
        if (!Number.isFinite(cx) || !Number.isFinite(cy)) continue;
        try {
          const target = drawActivityMarker(
            markerRoot,
            cx,
            cy,
            displayRecord,
            code,
            featureId,
            payload,
            colors,
            isSelected,
            visibleMarkerIds,
            { kind: 'activity-marker' },
          );
          if (target) {
            markerCount++;
            if (inspectAreaMode && target !== true) hitTargetList.push(target);
          }
        } catch (error) {
          console.error('[teamActivityLayer] drawActivityMarker fallback failed', {
            id: displayRecord?.id,
            title: displayRecord?.title,
            reason: fallback.reason,
            error,
          });
        }
      }
    }

    if (!state.renderPins) {
      hideAllMarkers();
      return;
    }

    let hiddenMarkerCount = 0;
    for (const [id, marker] of markerNodeById) {
      if (!visibleMarkerIds.has(id)) {
        hideMarker(marker);
        hiddenMarkerCount++;
      }
    }
    const evictedMarkers = evictHiddenMarkers(visibleMarkerIds);
    console.log('[teamActivityLayer] markers reconciled', {
      visible: visibleMarkerIds.size,
      hidden: hiddenMarkerCount,
      evicted: evictedMarkers,
      total: markerNodeById.size,
    });
    const markersReadySignature = `${signature}|markers:${visibleMarkerIds.size}`;
    emitPoiLayerRendered(markersReadySignature, visibleMarkerIds.size);

    // 座標ヒットテスト用に表示中マーカーの位置情報をホストへ送る（LaWA ハイブリッド）
    emitHitTargets(hitTargetList, zoom);

  };

  window.addEventListener('message', (event) => {
    const msg = event.data || {};

    if (msg.type === MAP_MESSAGES.mapInteractionModeChanged) {
      state.interactionMode = msg.interactionMode || msg.payload?.interactionMode || 'inspect-area';
      state.signature = '';
      console.log('[teamActivityLayer] interaction mode changed', state.interactionMode);
      return;
    }

    if (msg.type === MAP_MESSAGES.mapLayerVisibilityChanged) {
      const layerKey = msg.layerKey || msg.payload?.layerKey || msg.payload?.layerId;
      if (layerKey !== 'teamActivity' && layerKey !== 'team-activity') return;
      state.visible = msg.visible !== false;
      state.signature = '';
      console.log('[teamActivityLayer] visibility changed', state.visible);
      if (!state.visible) {
        selectedFeatureId = null;
        removeGroup();
        hideAllMarkers();
        return;
      }
      window.svgMap?.refreshScreen?.();
      return;
    }
    if (msg.type === MAP_MESSAGES.mapSetMunicipalityFilter) {
      const codes = Array.isArray(msg.municipalityCodes) ? msg.municipalityCodes : [];
      state.selectedMunicipalityCodes = new Set(codes);
      state.signature = '';
      console.log('[teamActivityLayer] municipality filter set', codes);
      return;
    }
    if (msg.type === MAP_MESSAGES.mapSetDataUrl && (msg.layerId === 'teamActivity' || !msg.layerId)) {
      const newUrl = msg.url || msg.dataUrl;
      if (!newUrl) return;
      if (newUrl !== state.dataUrl) {
        console.log('[teamActivityLayer] setDataUrl', newUrl);
        state.dataUrl = newUrl;
        state.records = [];
        state.loaded = false;
        state.loading = false;
        loadSeq++;
        state.signature = '';
        clearAllMarkers();
      }
      void loadRecords();
      return;
    }
    if (msg.type === MAP_MESSAGES.mapSetLayerConfig && (msg.layerId === 'teamActivity' || !msg.layerId)) {
      const newBaseUrl = msg.baseAreaLayerUrl || msg.baseAreaUrl;
      const newDistrictTemplate = msg.districtSvgUrlTemplate;
      let changed = false;
      if (newBaseUrl && newBaseUrl !== state.baseAreaUrl) {
        state.baseAreaUrl = newBaseUrl;
        state.baseLoaded = false;
        state.baseLoading = false;
        state.districts = [];
        clearAllMarkers();
        changed = true;
      }
      if (newDistrictTemplate && newDistrictTemplate !== state.districtSvgUrlTemplate) {
        state.districtSvgUrlTemplate = newDistrictTemplate;
        state.districtsByCode = {};
        state.codesLoaded = new Set();
        state.codesLoading = new Set();
        clearAllMarkers();
        changed = true;
      }
      if (changed) {
        state.signature = '';
        console.log('[teamActivityLayer] setLayerConfig', { baseAreaUrl: state.baseAreaUrl, districtSvgUrlTemplate: state.districtSvgUrlTemplate });
        void loadBaseArea();
      }
      return;
    }
  });

  window.preRenderFunction = draw;
  window.addEventListener('load', () => {
    parseHashParams();
    const initIconDefs = () => {
      if (!window.svgImage?.getElementsByTagName) return false;
      ensureIconDefs();
      const built = Boolean(window.svgImage.getElementById?.('team-icon-active'));
      console.log('[teamActivityLayer] initIconDefs', { hasSvgImage: true, built });
      return built;
    };
    const tryInit = () => {
      const b = initIconDefs();
      return b;
    };
    if (!tryInit()) {
      let tries = 0;
      const timer = setInterval(() => {
        if (tryInit() || ++tries >= 30) clearInterval(timer);
      }, 100);
    }
    // Do not call loadRecords()/loadBaseArea() here — wait for map:setDataUrl/map:setLayerConfig
    window.parent?.postMessage?.({ type: MAP_MESSAGES.teamActivityLayerReady }, window.location.origin);
  });
})();
</script>
</body>
</html>

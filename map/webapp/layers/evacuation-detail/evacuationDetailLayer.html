<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>避難所詳細 WebApp Layer</title>
</head>
<body>
<script type="module">
import { MAP_MESSAGES } from '../../shared/mapMessages.js';

(() => {
  window.hiddenOnLayerLoad = () => {};

  const STATUS_TABLE = {
    open:    { label: '開設中',   tone: 'green', icon: '/map/icons/shelter-open.png' },
    limited: { label: '混雑',     tone: 'amber', icon: '/map/icons/shelter-limited.png' },
    full:    { label: '満員',     tone: 'red',   icon: '/map/icons/shelter-full.png' },
    closed:  { label: '閉鎖',     tone: 'gray',  icon: '/map/icons/shelter-closed.png' },
    unknown: { label: '情報なし', tone: 'gray',  icon: '/map/icons/shelter-default.png' },
  };

  const normalizeStatus = (status) => {
    const value = String(status || '').trim().toLowerCase();
    if (['open', 'opened', 'active', 'available', '利用可', '開設中'].includes(value)) return 'open';
    if (['limited', 'crowded', 'near_full', '要確認'].includes(value)) return 'limited';
    if (['full', '満員'].includes(value)) return 'full';
    if (['closed', 'close', 'inactive', '閉鎖'].includes(value)) return 'closed';
    return 'unknown';
  };

  const statusDetail = (status) => STATUS_TABLE[normalizeStatus(status)] || STATUS_TABLE.unknown;

  const detailText = (value) => {
    if (value === null || value === undefined) return null;
    const text = String(value).trim();
    return text.length > 0 ? text : null;
  };

  const detailLatLonText = (lat, lon) => {
    const la = typeof lat === 'number' ? lat : Number(lat);
    const lo = typeof lon === 'number' ? lon : Number(lon);
    if (!Number.isFinite(la) || !Number.isFinite(lo)) return null;
    return `${la.toFixed(5)}, ${lo.toFixed(5)}`;
  };

  const buildEvacuationFeatureDetail = (feature) => {
    if (!feature || feature.id == null || feature.id === '') return null;
    const rawTitle = feature.representative ? `${feature.title} 周辺` : feature.title;
    const title = detailText(rawTitle);
    if (title === null) return null;

    const sd = statusDetail(feature.representative ? 'open' : feature.status);
    const count = Number(feature.count);
    const rows = [
      feature.representative && Number.isFinite(count) && count > 1 ? { label: '周辺件数', value: String(count) } : null,
      { label: '住所',   value: detailText(feature.address) },
      { label: '種別',   value: detailText(feature.summary) },
      { label: '担当',   value: detailText(feature.operator) },
      { label: '自治体', value: detailText(feature.municipalityCode) },
      { label: '緯度経度', value: detailLatLonText(feature.lat, feature.lon) },
    ].filter((row) => row && row.value !== null);

    return {
      id: String(feature.id),
      title,
      accent: 'green',
      badge: { label: feature.representative ? '代表地点' : '個別地点', tone: feature.representative ? 'blue' : 'green' },
      icon: { src: sd.icon, alt: `${sd.label} の避難所` },
      rows,
    };
  };

  const renderEvacuationDetail = (feature) => {
    const detail = buildEvacuationFeatureDetail(feature);
    if (!detail) return;
    console.debug('[evacuationDetailLayer] detail built', detail);
  };

  window.addEventListener('message', (event) => {
    const msg = event.data || {};
    if (msg.type !== MAP_MESSAGES.mapShowEvacuationFeature) return;
    if (msg.feature) renderEvacuationDetail(msg.feature);
  });

  window.addEventListener('load', () => {});
})();
</script>
</body>
</html>

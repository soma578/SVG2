<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ハザード WebApp Layer</title>
</head>
<body>
<script type="module">
import { MAP_MESSAGES } from '../../shared/mapMessages.js';
import { fetchWithRuntimeCache } from '../../shared/runtimeCache.js';

(() => {
  window.hiddenOnLayerLoad = () => {};

  // hash params:
  //   prefSvgUrl=/map/layers/hazard/{prefCode}/{regionId}.svg
  //   svgUrlTemplate=/map/layers/hazard/{prefCode}/districts/{code}.svg
  const parseHashParams = () => {
    const raw = String(window.svgImageProps?.hash || window.svgImageProps?.Path?.split('#')?.[1] || '');
    const params = new URLSearchParams(raw.replace(/^#/, ''));
    return {
      prefSvgUrl: params.get('prefSvgUrl') || '',
      svgUrlTemplate: params.get('svgUrlTemplate') || '',
    };
  };

  // コンテナは visibility="visible" にして SVGMap にコントローラを起動させる。
  // ポリゴンの表示/非表示は applyVisibility() で 4グループの visibility を制御する。
  const state = {
    prefSvgUrl: '',
    svgUrlTemplate: '',
    currentCode: '',
    visible: true,
    loadedKey: '',
    loadingKey: '',
    mode: 'none',
    pathCount: 0,
  };
  let lastStatusSignature = '';

  const MIN_VISIBLE_ZOOM = 10;
  const MUNICIPALITY_ZOOM = 12;

  // ----------------------------------------------------------------
  // 4グループを空にする
  // ----------------------------------------------------------------
  const GROUP_IDS = ['hazard-flood', 'hazard-tsunami-inundation', 'hazard-landslide-warning', 'hazard-landslide-special'];

  const emitDataStatus = (payload = {}) => {
    console.debug('[hazardLayer] dataStatus', {
      online: navigator.onLine,
      updatedAt: new Date().toISOString(),
      ...payload,
      key: 'hazard',
      label: payload.label || 'ハザード',
    });
  };

  const scheduleNativeReparse = () => {
    window.setTimeout(() => {
      try {
        const geoViewBox = window.svgMap?.getGeoViewBox?.();
        if (
          geoViewBox
          && Number.isFinite(Number(geoViewBox.x))
          && Number.isFinite(Number(geoViewBox.y))
          && Number.isFinite(Number(geoViewBox.width))
          && Number.isFinite(Number(geoViewBox.height))
        ) {
          window.svgMap?.setGeoViewPort?.(
            Number(geoViewBox.y),
            Number(geoViewBox.x),
            Number(geoViewBox.height),
            Number(geoViewBox.width),
            false,
          );
          return;
        }
      } catch (error) {
        console.warn('[hazardLayer] native reparse failed', error);
      }
      window.svgMap?.refreshScreen?.();
    }, 80);
  };

  const statusUrlForMode = () => {
    if (state.mode === 'pref') return state.prefSvgUrl;
    if (state.mode === 'municipality' && state.currentCode && state.svgUrlTemplate) {
      return state.svgUrlTemplate.replace('{code}', state.currentCode);
    }
    return state.prefSvgUrl || state.svgUrlTemplate || '';
  };

  const emitHazardState = (message = '') => {
    const zoom = getZoomLevel();
    const signature = [
      zoom,
      state.visible,
      state.mode,
      state.currentCode,
      state.loadedKey,
      state.loadingKey,
      state.pathCount,
      state.prefSvgUrl,
      state.svgUrlTemplate,
      message,
    ].join('|');
    if (signature === lastStatusSignature) return;
    lastStatusSignature = signature;
    emitDataStatus({
      source: state.loadedKey ? 'cache' : 'fallback',
      url: statusUrlForMode(),
    });
  };

  const clearGroups = () => {
    const svg = window.svgImage;
    if (!svg) return;
    state.pathCount = 0;
    for (const id of GROUP_IDS) {
      const g = svg.getElementById?.(id);
      if (!g) continue;
      while (g.firstChild) g.removeChild(g.firstChild);
    }
  };

  // ----------------------------------------------------------------
  // 取得した SVG テキストを解析してグループにパスを注入する
  // ----------------------------------------------------------------
  const injectSvg = (svgText) => {
    const svg = window.svgImage;
    if (!svg) return 0;
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgText, 'image/svg+xml');
    clearGroups();
    let pathCount = 0;
    for (const id of GROUP_IDS) {
      const srcG = doc.getElementById(id);
      const dstG = svg.getElementById?.(id);
      if (!srcG || !dstG) continue;
      for (const child of Array.from(srcG.childNodes)) {
        if (child.nodeType !== 1) continue; // element only
        const imported = svg.importNode?.(child, true) || child.cloneNode(true);
        dstG.appendChild(imported);
        pathCount += 1;
      }
    }
    state.pathCount = pathCount;
    return pathCount;
  };

  // ----------------------------------------------------------------
  // ハザードSVGを取得してレイヤーに注入する
  // ----------------------------------------------------------------
  const loadHazardSvg = async (key, url) => {
    if (!url || !key) return;
    if (state.loadedKey === key || state.loadingKey === key) return;

    state.loadingKey = key;
    console.log('[hazardLayer] fetch', { key, url });
    emitHazardState(`fetching key=${key} url=${url}`);
    try {
      const { data: svgText, source } = await fetchWithRuntimeCache(url, `hazard:${key}`, {
        responseType: 'text',
        label: 'ハザード',
        logLabel: 'hazardLayer',
        emitDataStatus,
      });
      if (state.loadingKey !== key) return; // 別モード/別市に切り替わっていたら破棄
      state.loadingKey = '';
      console.log('[hazardLayer] loaded', { key, source });
      const pathCount = injectSvg(svgText);
      state.loadedKey = key;
      applyVisibility();
      emitHazardState(`loaded key=${key} source=${source} paths=${pathCount}`);
      scheduleNativeReparse();
    } catch (err) {
      if (state.loadingKey === key) state.loadingKey = '';
      console.warn('[hazardLayer] fetch failed', { url, err });
      clearGroups();
      state.loadedKey = '';
      emitHazardState(`failed url=${url} error=${err?.message || err}`);
    }
  };

  const getZoomLevel = () => {
    const scale = Number(window.svgImageProps?.scale);
    if (Number.isFinite(scale) && scale > 0) return Math.floor(Math.LOG2E * Math.log(scale) + 7.25);
    return 13;
  };

  const modeForZoom = (zoom) => {
    if (!state.visible || zoom < MIN_VISIBLE_ZOOM) return 'none';
    if (!state.currentCode) return 'pref';
    return zoom >= MUNICIPALITY_ZOOM ? 'municipality' : 'pref';
  };

  // ----------------------------------------------------------------
  // 表示/非表示切替
  // ----------------------------------------------------------------
  const applyVisibility = () => {
    const svg = window.svgImage;
    if (!svg) return;
    const shown = state.visible && state.mode !== 'none';
    const vis = shown ? 'visible' : 'hidden';
    for (const id of GROUP_IDS) {
      const g = svg.getElementById?.(id);
      if (g) {
        g.setAttribute('visibility', vis);
        g.setAttribute('display', shown ? 'inline' : 'none');
      }
    }
  };

  const draw = () => {
    const zoom = getZoomLevel();
    const nextMode = modeForZoom(zoom);
    if (nextMode !== state.mode) {
      state.mode = nextMode;
      applyVisibility();
    }
    emitHazardState();
    if (nextMode === 'none') return;

    if (nextMode === 'pref') {
      void loadHazardSvg('pref', state.prefSvgUrl);
      return;
    }

    if (nextMode === 'municipality' && state.currentCode && state.svgUrlTemplate) {
      void loadHazardSvg(`municipality:${state.currentCode}`, state.svgUrlTemplate.replace('{code}', state.currentCode));
    }
  };

  // ----------------------------------------------------------------
  // メッセージハンドラ
  // ----------------------------------------------------------------
  window.addEventListener('message', (event) => {
    const msg = event.data || {};

    if (msg.type === MAP_MESSAGES.mapLayerVisibilityChanged) {
      const key = msg.layerKey || msg.payload?.layerKey;
      if (key !== 'hazard') return;
      state.visible = msg.visible !== false;
      state.mode = modeForZoom(getZoomLevel());
      applyVisibility();
      emitHazardState('visibility changed');
      if (state.visible) draw();
      scheduleNativeReparse();
      return;
    }

    if (msg.type === MAP_MESSAGES.mapSetMunicipalityFilter) {
      const codes = Array.isArray(msg.municipalityCodes) ? msg.municipalityCodes : [];
      const code = codes[0] || '';
      if (!code || code === state.currentCode) return;
      state.currentCode = code;
      emitHazardState('municipality changed');
      if (state.visible) draw();
      scheduleNativeReparse();
      return;
    }

    // host から svgUrlTemplate を渡す場合（任意）
    if (msg.type === MAP_MESSAGES.mapSetLayerConfig && msg.layerId === 'hazard') {
      if (msg.prefSvgUrl || msg.layerUrl) state.prefSvgUrl = msg.prefSvgUrl || msg.layerUrl;
      if (msg.svgUrlTemplate) state.svgUrlTemplate = msg.svgUrlTemplate;
      emitHazardState('config changed');
      if (state.visible) draw();
      scheduleNativeReparse();
      return;
    }
  });

  // ----------------------------------------------------------------
  // 初期化
  // ----------------------------------------------------------------
  window.addEventListener('load', () => {
    const { prefSvgUrl, svgUrlTemplate } = parseHashParams();
    if (prefSvgUrl) state.prefSvgUrl = prefSvgUrl;
    if (svgUrlTemplate) state.svgUrlTemplate = svgUrlTemplate;
    // 初期非表示を適用してから ready を通知する
    state.mode = modeForZoom(getZoomLevel());
    applyVisibility();
    emitHazardState('ready');
    console.log('[hazardLayer] ready', { prefSvgUrl: state.prefSvgUrl, svgUrlTemplate: state.svgUrlTemplate });
    draw();
    scheduleNativeReparse();
  });

  window.preRenderFunction = draw;
})();
</script>
</body>
</html>

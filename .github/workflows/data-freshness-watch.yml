name: Watch data freshness

# 上流には一切アクセスしない。リポジトリに入っている source-health を読むだけ。
# 走査を伴う更新は operator-triggered のまま（refresh-river-webcams.yml）で、
# ここはその実行を促すための警報にすぎない。
on:
  schedule:
    # 毎日 00:10 UTC (09:10 JST)
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-freshness-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check source freshness
        id: freshness
        working-directory: frontend
        run: |
          set +e
          output=$(node scripts/check-source-health.mjs --fail-on-stale 2>&1)
          status=$?
          echo "$output"
          {
            echo 'report<<REPORT_EOF'
            echo "$output"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "stale=$([ $status -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the staleness issue
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.freshness.outputs.report }}
        with:
          script: |
            const title = 'データ取得元の鮮度切れ'
            const body = [
              '防災データの取得元が鮮度切れです。表示は正しく「保存済み」と伝えていますが、',
              '中身が古いままです。しきい値を緩めるのではなく、更新を実行してください。',
              '',
              '- カメラ台帳: `Refresh river webcam data` ワークフローを手動実行（上流保護のため自動化しない）',
              '- 河川水位: 高頻度公開の経路から更新',
              '',
              '```',
              process.env.REPORT || '',
              '```',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-freshness',
            })
            const issue = existing.data.find((entry) => entry.title === title)
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              })
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-freshness'],
            })

name: Refresh river webcam data

on:
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: Refresh metadata for every camera (high upstream load)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: operator-refresh-river-webcams
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci
      - name: Build camera data release
        working-directory: frontend
        env:
          REFRESH_METADATA: ${{ inputs.refresh_metadata }}
        run: |
          args=(--output "$RUNNER_TEMP/japan-river-webcams")
          if [[ "$REFRESH_METADATA" == "true" ]]; then
            args+=(--refresh-metadata)
          fi
          npm run webcams:release -- "${args[@]}"
      - name: Upload deployable release
        uses: actions/upload-artifact@v4
        with:
          name: japan-river-webcams
          path: ${{ runner.temp }}/japan-river-webcams
          if-no-files-found: error
          retention-days: 14
